  function refreshFormStatus() {
    var box = $('form');
    if (!box) return;
    box.querySelectorAll('.acc').forEach(function (d) {
      if (!d._statusFn) return;
      var txt = '';
      try { txt = d._statusFn() || ''; } catch (e) { txt = ''; }
      d._status.textContent = txt;
    });
    // 有内容时自动展开该维度，让用户看见自己填了什么
    box.querySelectorAll('.acc').forEach(function (d) {
      if (d._status && d._status.textContent && !d.open) d.open = true;
    });
  }

  /* ==========================================================================
     动作
     ======================================================================== */
  function doSaveEntry(entry) {
    var r = L.addEntry(state, curDate, entry, Date.now());
    if (r.error) { toast(r.error); return false; }
    state = r.state;
    if (!saveState(state)) {
      // ⚠️ 写失败时**绝不能显示"已保存"**（课程表踩过这个坑）
      toast('保存失败：本地存储写不进去，请先导出备份');
      return false;
    }
    renderAll();
    return true;
  }

  function doDelete(id) {
    var r = L.removeEntry(state, curDate, id);
    if (r.error) { toast(r.error); return; }
    state = r.state;
    saveState(state);
    renderAll();
    toast('已删除');
  }

  /* ---------- 编辑弹层 ---------- */
  function openEditSheet(e) {
    openSheet(function (panel) {
      panel.appendChild(el('h3', null, '编辑这条记录（' + (e.at || '') + '）'));
      var ta = document.createElement('textarea');
      ta.value = entryText(e) || e.raw || '';
      panel.appendChild(el('p', 'hint',
        '改完点「保存文字」即可。也可以点「🤖 重新让 AI 解析」——' +
        '把这段文字重新拆一遍（原文永久保留，所以重复解析不会丢东西）。'));
      panel.appendChild(ta);
      var btns = el('div', 'btns');
      var b1 = el('button', 'btn p grow', '保存文字');
      b1.onclick = function () {
        var patch = { raw: ta.value };
        // 只改 raw 不够直观，这里同时把 raw 存起来，字段留给表单编辑
        var r = L.updateEntry(state, curDate, e.id, patch, Date.now());
        if (r.error) { toast(r.error); return; }
        state = r.state; saveState(state); renderAll(); closeSheet(); toast('已保存');
      };
      /*
       * 重新让 AI 解析这段文字。
       * 这条路径的价值：`raw` 是**永久保留**的（方案 §6 设计决定 1），
       * 所以提示词改进后、或者当时 AI 拆错了，都能重新解析而不丢任何数据。
       */
      var bRe = el('button', 'btn', '🤖 重新解析');
      bRe.onclick = function () {
        if (!A) { toast('AI 模块没加载'); return; }
        if (!aiReady()) { toast('还没设置 API key'); openSettings(); return; }
        var text = ta.value.trim();
        if (!text) { toast('内容为空'); return; }
        bRe.disabled = true; bRe.textContent = '⏳ 解析中…';
        var now = new Date();
        A.parseNote(text, aiSettings(), {
          nowHint: '现在是 ' + L.toDateKey(now) + ' ' + L.nowHHMM(now)
        }).then(function (res) {
          bRe.disabled = false; bRe.textContent = '🤖 重新解析';
          accountUsage(res.usage);
          if (!res.ok) { aiFail(res.error); return; }
          // 用新解析的字段覆盖这条记录（raw 同时更新成用户改过的文字）
          var patch = { raw: text };
          Object.keys(res.data).forEach(function (k) { patch[k] = res.data[k]; });
          var r = L.updateEntry(state, curDate, e.id, patch, Date.now());
          if (r.error) { toast(r.error); return; }
          state = r.state;
          if (!saveState(state)) { toast('解析成功了，但存不进去'); return; }
          closeSheet(); renderAll();
          toast('已重新解析并更新这条记录');
        }).catch(function (err) {
          bRe.disabled = false; bRe.textContent = '🤖 重新解析';
          toast('出错了：' + (err && err.message || err));
        });
      };
      var b2 = el('button', 'btn', '在表单里改');
      b2.onclick = function () {
        formVal = JSON.parse(JSON.stringify(e));
        delete formVal.id; delete formVal.at; delete formVal.createdAt;
        delete formVal.updatedAt; delete formVal.raw;
        editingId = e.id;
        renderForm();
        closeSheet();
        toast('已载入表单，改完点「保存这条记录」');
      };
      var b3 = el('button', 'btn', '取消');
      b3.onclick = closeSheet;
      btns.appendChild(b1); btns.appendChild(bRe); btns.appendChild(b2); btns.appendChild(b3);
      panel.appendChild(btns);
    });
  }

  var editingId = null;

  function openSheet(build) {
    var panel = clear($('sheetPanel'));
    build(panel);
    $('sheet').classList.add('on');
    $('sheet').onclick = function (ev) { if (ev.target === $('sheet')) closeSheet(); };
  }
  function closeSheet() { $('sheet').classList.remove('on'); }

  /* ---------- 导出备份 ---------- */
  function exportBackup() {
    var obj = L.exportForBackup(state, Date.now());
    var text = JSON.stringify(obj, null, 2);
    downloadText('个人规划备份-' + L.todayKey() + '.json', text, 'application/json');
    state.settings.lastExportAt = Date.now();
    saveState(state);
    renderBanners();
    toast('已导出（备份里**不含** API key，可以放心传）');
  }

  function downloadText(filename, text, mime) {
    try {
      var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
    } catch (e) {
      // 降级：弹层里显示全文，让用户自己复制
      openSheet(function (panel) {
        panel.appendChild(el('h3', null, '导出（浏览器不支持直接下载，请手动复制）'));
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.minHeight = '46vh';
        panel.appendChild(ta);
        ta.select();
        var b = el('button', 'btn p', '关闭');
        b.onclick = closeSheet;
        panel.appendChild(b);
      });
    }
  }

  /* ==========================================================================
     M4：AI 交互
     ======================================================================== */

  /** 当前是否配好了 AI */
  function aiReady() { return !!(A && A.isReady(state.settings)); }

  /** 把设置里的 key 交给 ai.js 用（会话模式时不落盘，但本次可用） */
  function aiSettings() {
    return {
      apiKey: state.settings.apiKey || '',
      model: state.settings.model || 'deepseek-flash',
      baseUrl: state.settings.baseUrl || ''
    };
  }

  /** 记一次用量（按真实 usage 记账，不是估算） */
  function accountUsage(usage) {
    if (!usage) return;
    if (!state.settings.ledger || typeof state.settings.ledger !== 'object') state.settings.ledger = {};
    state.settings.ledger = A.recordUsage(state.settings.ledger, usage, state.settings.model || 'deepseek-flash', Date.now());
    saveState(state);
  }

  /** 统一的 AI 失败提示（把 ai.js 的错误对象变成人话） */
  function aiFail(err) {
    var e = err || {};
    var msg = (e.icon ? e.icon + ' ' : '') + (e.text || 'AI 调用失败');
    toast(msg);
    if (e.kind === 'no_key') { openSettings(); }
    return false;
  }

  /**
   * 一句话 → AI 拆字段 → **弹层让用户确认**（D2：你看一眼改完再存）
   *
   * 为什么必须确认：个人档案最怕脏数据。一旦你发现记的不对，信任就崩了，
   * 就不会再记 —— 整个 App 就白做了。所以 AI 的结果只是"草稿"。
   */
  function runAIParse(text) {
    if (!A) { toast('AI 模块没加载'); return; }
    if (!aiReady()) { toast('还没设置 API key'); openSettings(); return; }

    var btn = $('btnAI');
    var oldLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ 正在整理…';

    var now = new Date();
    var hint = '现在是 ' + L.toDateKey(now) + ' ' + L.nowHHMM(now) +
               '（星期' + '一二三四五六日'[L.isoDayOfWeek(L.toDateKey(now)) - 1] + '）';

    A.parseNote(text, aiSettings(), { nowHint: hint }).then(function (r) {
      btn.disabled = false;
      btn.textContent = oldLabel;
      accountUsage(r.usage);
      if (!r.ok) { aiFail(r.error); return; }
      showAIConfirm(text, r.data, function (dims) {
        // 用户确认（可能改过）→ 载入表单让他继续调，或直接保存
        applyDimsToForm(dims);
        $('quick').value = '';
        toast('已填进表单，检查一下再点「保存这条记录」');
      });
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = oldLabel;
      toast('出错了：' + (e && e.message || e));
    });
  }

  /** 把 AI 拆出的字段灌进表单 */
  function applyDimsToForm(dims) {
    Object.keys(dims || {}).forEach(function (k) { formVal[k] = dims[k]; });
    renderForm();
    // 展开第一个有内容的维度，让用户看到
    var acc = $('form').querySelectorAll('.acc');
    for (var i = 0; i < acc.length; i++) {
      if (acc[i]._status && acc[i]._status.textContent) { acc[i].open = true; break; }
    }
    $('form').scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  /**
   * AI 结果确认弹层。
   * ⚠️ 全程用 textContent，不用 innerHTML —— AI 的内容不能进 HTML 解析，
   *    否则模型可以输出 <img onerror=...> 读走 localStorage 里的 API key。
   */
  function showAIConfirm(rawText, dims, onConfirm) {
    openSheet(function (panel) {
      panel.appendChild(el('h3', null, 'AI 整理结果（检查一下）'));

      panel.appendChild(el('p', 'hint', '原文：' + rawText));

      var keys = Object.keys(dims || {});
      if (!keys.length) {
        panel.appendChild(el('div', 'prev', 'AI 没拆出任何字段。可以写详细一点再试，或者点「手填」自己记。'));
      }

      keys.forEach(function (k) {
        var d = L.dimOf(k);
        var c = el('div', 'sub');
        c.appendChild(el('h4', null, (d ? d.icon + ' ' + d.name : k)));
        // 用 compactDim 把结构化内容压成一行可读文字
        var txt = L.compactDim(k, dims[k]);
        c.appendChild(el('div', 'txt', txt || JSON.stringify(dims[k])));
        panel.appendChild(c);
      });

      if (keys.length) {
        panel.appendChild(el('p', 'hint', '要改就直接改文字（M5 会支持在这里编辑字段）；现在确认后会填进下面的表单。'));
      }

      var btns = el('div', 'btns');
      var b1 = el('button', 'btn p grow', '✅ 填进表单');
      b1.onclick = function () { closeSheet(); onConfirm(dims); };
      var b2 = el('button', 'btn', '重试');
      b2.onclick = function () { closeSheet(); runAIParse(rawText); };
      var b3 = el('button', 'btn', '取消');
      b3.onclick = closeSheet;
      btns.appendChild(b1); btns.appendChild(b2); btns.appendChild(b3);
      panel.appendChild(btns);
    });
  }

  /**
   * 生成今日复盘（三列）。
   */
  function runReview() {
    if (!A) { toast('AI 模块没加载'); return; }
    if (!aiReady()) { toast('还没设置 API key'); openSettings(); return; }

    var day = L.getDay(state, curDate);
    if (!day || !day.entries.length) { toast('这一天还没有记录'); return; }

    var btn = $('btnReview');
    var oldLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ 正在分析今天…';

    A.dailyReview(state, curDate, aiSettings()).then(function (r) {
      btn.disabled = false;
      btn.textContent = oldLabel;
      accountUsage(r.usage);
      if (!r.ok) { aiFail(r.error); return; }
      // 存档到 days[date].ai（并记下条目数，之后又加条目就能提示重新生成）
      var s = L.normalizeState(state);
      if (!s.days[curDate]) s.days[curDate] = { date: curDate, entries: [] };
      s.days[curDate].ai = {
        review: { fact: r.data.fact, contribution: r.data.contribution, next: r.data.next },
        at: Date.now(),
        model: state.settings.model || 'deepseek-flash',
        tokens: r.usage ? { in: r.usage.in, out: r.usage.out } : undefined,
        entryCount: s.days[curDate].entries.length,
        lastEntryAt: (function () {
          var last = 0;
          s.days[curDate].entries.forEach(function (e) { if (e.updatedAt > last) last = e.updatedAt; });
          return last;
        })()
      };
      state = s;
      if (!saveState(state)) { toast('复盘生成了，但存不进去（存储写失败）'); }
      renderAll();
      toast(r.data.insufficient ? '数据有点少，AI 说看不出太多' : '复盘已生成');
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = oldLabel;
      toast('出错了：' + (e && e.message || e));
    });
  }

  /** 渲染已保存的复盘 */
  function renderReview() {
    var box = clear($('reviewBox'));
    var day = L.getDay(state, curDate);
    if (!day || !day.ai || !day.ai.review) return;
    var r = day.ai.review;

    var c = el('div', 'review');
    function col(title, body, cls) {
      var d = el('div', 'rc' + (cls ? ' ' + cls : ''));
      d.appendChild(el('div', 'rt', title));
      d.appendChild(el('div', 'rb', body || '（空）'));
      return d;
    }
    if (r.fact) c.appendChild(col('今日事实', r.fact));
    if (r.contribution) c.appendChild(col('贡献与问题', r.contribution));
    if (r.next) c.appendChild(col('下一步', r.next));
    box.appendChild(c);

    var when = day.ai.at ? new Date(day.ai.at) : null;
    var meta = '由 ' + (day.ai.model || 'AI') + ' 生成';
    if (when) meta += '（' + L.nowHHMM(when) + '）';
    if (day.ai.tokens) meta += ' · 用了 ' + (day.ai.tokens.in || 0) + '+' + (day.ai.tokens.out || 0) + ' token';
    box.appendChild(el('p', 'hint', meta));
  }

  /* ==========================================================================
     M5：仪表盘（趋势图手绘 Canvas，不引图表库）
     ======================================================================== */
  var dashRange = 30;         // 近 30 天
  var chartDim = 'sleep';     // 当前看哪个指标
  var pairA = 'sleep', pairB = 'energy';

  function switchView(v) {
    $('view-today').style.display = (v === 'today') ? '' : 'none';
    $('view-dash').style.display = (v === 'dash') ? '' : 'none';
    document.querySelectorAll('nav button').forEach(function (x) {
      x.setAttribute('aria-current', String(x.getAttribute('data-view') === v));
    });
    if (v === 'dash') renderDash();
  }

  function renderDash() {
    if (!L) return;
    var s = L.dashSummary(state, dashRange, curDate);
    $('dashNote').textContent = s.from + ' ~ ' + s.to;

    var box = clear($('dashStats'));
    function kv(k, v) {
      var w = el('span', 'kv');
      w.appendChild(el('span', 'k', k));
      w.appendChild(el('span', 'v', v));
      box.appendChild(w);
    }
    kv('记录了', s.daysWithRecords + '/' + s.days + ' 天');
    kv('坚持', L.streak(state, curDate) + ' 天');
    kv('维度完成度', Math.round(s.ratio * 100) + '%');
    if (s.mostMissed.length) {
      kv('最常漏记', s.mostMissed.map(function (m) { return m.name + '×' + m.missed; }).join('、'));
    }

    // 范围按钮状态
    document.querySelectorAll('#view-dash [data-range]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-range')) === dashRange));
      b.onclick = function () { dashRange = Number(b.getAttribute('data-range')); renderDash(); };
    });

    renderHeat();
    renderChartPickers();
    drawChart();
    renderPair();
    renderReports();
    // 刷新导出按钮文案（写明要导出哪一周、几天有记录，避免误导出空档）
    resolveExportTarget();
  }

  /* ---------- 日历热力图 ---------- */
  function renderHeat() {
    var box = clear($('heat'));
    var h = L.calendarHeat(state, Math.min(dashRange, 91), curDate);
    if (!h.weeks.length) { box.appendChild(el('div', 'empty', '还没有记录')); return; }

    var wrap = el('div', 'heat');
    // 月份标签行
    var moRow = el('div', 'mo-row');
    h.weeks.forEach(function (w, i) {
      var lab = '';
      for (var k = 0; k < h.months.length; k++) {
        if (h.months[k].weekIndex === i) { lab = Number(h.months[k].m.slice(5)) + '月'; break; }
      }
      var c = el('div', 'mo', lab);
      c.style.width = '12px';
      moRow.appendChild(c);
    });
    var outer = el('div');
    outer.appendChild(moRow);
    moRow.style.display = 'flex';
    moRow.style.gap = '3px';
    moRow.style.minWidth = 'max-content';

    h.weeks.forEach(function (w) {
      var col = el('div', 'wk');
      w.forEach(function (cell) {
        var c = el('div', 'cell' + (cell.level ? ' l' + cell.level : (cell.inRange === false ? ' out' : '')));
        c.title = cell.date + (cell.count ? '：' + cell.count + ' 条、' + cell.filled + ' 个维度' : '：没记');
        col.appendChild(c);
      });
      wrap.appendChild(col);
    });
    outer.appendChild(wrap);
    box.appendChild(outer);
    /*
     * 提示语分两行（挤一行在窄屏会折得很乱）。
     * ⚠️ 必须"复用同一个元素"，不能每次都新建 —— heatHint 每次 renderDash 都会重跑，
     *    每次 append 一个就会越积越多（这个错很容易犯，因为界面上看不出问题，
     *    只有反复切视图才会发现下面堆了一排重复文字）。
     */
    $('heatHint').textContent = h.from + ' ~ ' + h.to;
    var line2 = $('heatLine2');
    if (!line2) {
      line2 = el('p', 'hint');
      line2.id = 'heatLine2';
      $('heatHint').parentNode.insertBefore(line2, $('heatHint').nextSibling);
    }
    line2.textContent = '颜色越深 = 那天记的维度越多；空白 = 那天没记';
  }

  /* ---------- 指标选择 ---------- */
  function renderChartPickers() {
    var series = L.chartSeries(state, dashRange, curDate);
    var pick = clear($('chartPick'));
    series.forEach(function (sr) {
      var b = el('button', 'mini', sr.name);
      b.setAttribute('aria-pressed', String(sr.key === chartDim));
      b.onclick = function () { chartDim = sr.key; renderDash(); };
      pick.appendChild(b);
    });

    var pa = clear($('pairPick'));
    [['pairA', 'A：'], ['pairB', 'B：']].forEach(function (pr) {
      var lab = el('span', 'k', pr[1]);
      lab.style.alignSelf = 'center';
      pa.appendChild(lab);
      series.forEach(function (sr) {
        var cur = (pr[0] === 'pairA') ? pairA : pairB;
        var b = el('button', 'mini', sr.name);
        b.setAttribute('aria-pressed', String(sr.key === cur));
        b.onclick = function () {
          if (pr[0] === 'pairA') pairA = sr.key; else pairB = sr.key;
          renderDash();
        };
        pa.appendChild(b);
      });
      pa.appendChild(el('div', '', ''));
    });
  }

  /* ---------- 折线图（手绘）----------
   * 不引图表库的理由：App 是零依赖的（CSP 也不允许外部脚本）。
   * 朴素折线足够回答"在变好还是变差"这个问题。
   */
  function drawChart() {
    var cv = $('chart');
    if (!cv || !cv.getContext) return;
    var series = L.chartSeries(state, dashRange, curDate);
    var sr = null;
    for (var i = 0; i < series.length; i++) if (series[i].key === chartDim) sr = series[i];
    if (!sr) return;

    var dpr = Math.min(2, (typeof devicePixelRatio === 'number' ? devicePixelRatio : 1));
    var cssW = cv.clientWidth || 320, cssH = 200;
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    cv.style.height = cssH + 'px';
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, cssW, cssH);

    var dark = (typeof matchMedia === 'function') && matchMedia('(prefers-color-scheme: dark)').matches;
    var ink3 = dark ? '#7d838d' : '#8a8f98';
    var line = dark ? '#2c3037' : '#e4e6eb';
    var brand = dark ? '#2dd4bf' : '#0f766e';

    var padL = 30, padR = 8, padT = 12, padB = 20;
    var plotW = cssW - padL - padR, plotH = cssH - padT - padB;
    var vals = sr.values.filter(function (v) { return typeof v === 'number'; });
    if (!vals.length) {
      g.fillStyle = ink3;
      g.font = '13px sans-serif';
      g.textAlign = 'center';
      g.fillText('这段时间还没有 ' + sr.name + ' 的数据', cssW / 2, cssH / 2);
      $('chartStats').textContent = '';
      $('chartHint').textContent = '';
      return;
    }
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max) { min -= 1; max += 1; }
    var span = max - min;

    // 横向网格 + y 轴刻度
    g.strokeStyle = line; g.lineWidth = 1;
    g.font = '10px sans-serif'; g.fillStyle = ink3; g.textAlign = 'right';
    for (var k = 0; k <= 3; k++) {
      var y = padT + plotH * (k / 3);
      g.beginPath(); g.moveTo(padL, Math.round(y) + 0.5); g.lineTo(padL + plotW, Math.round(y) + 0.5); g.stroke();
      var tv = max - span * (k / 3);
      g.fillText((Math.round(tv * 10) / 10) + '', padL - 4, y + 3);
    }

    var n = sr.values.length;
    function xAt(i) { return padL + (n <= 1 ? plotW / 2 : plotW * (i / (n - 1))); }
    function yAt(v) { return padT + plotH * (1 - (v - min) / span); }

    // 折线：在"空档"（null）处断开，不要把缺失连成直线
    g.strokeStyle = brand; g.lineWidth = 2; g.lineJoin = 'round';
    var started = false;
    g.beginPath();
    for (var j = 0; j < n; j++) {
      var v = sr.values[j];
      if (typeof v !== 'number') { started = false; continue; }
      var x = xAt(j), y = yAt(v);
      if (!started) { g.moveTo(x, y); started = true; }
      else g.lineTo(x, y);
    }
    g.stroke();

    // 数据点（有值的日子）
    g.fillStyle = brand;
    for (var m = 0; m < n; m++) {
      if (typeof sr.values[m] !== 'number') continue;
      g.beginPath();
      g.arc(xAt(m), yAt(sr.values[m]), 2.2, 0, Math.PI * 2);
      g.fill();
    }

    // x 轴首尾日期
    g.fillStyle = ink3; g.textAlign = 'left';
    g.fillText(sr.dates[0].slice(5), padL, cssH - 6);
    g.textAlign = 'right';
    g.fillText(sr.dates[n - 1].slice(5), padL + plotW, cssH - 6);

    // 统计
    var st = clear($('chartStats'));
    function sv(k, v) {
      var w = el('span');
      w.appendChild(el('b', null, v));
      w.appendChild(document.createTextNode(' ' + k));
      st.appendChild(w);
    }
    sv('天有数据', st.hmm = String(sr.stat.n));
    if (sr.stat.mean !== null) sv('平均', sr.stat.mean + sr.unit);
    if (sr.last !== null) sv('最近一次', sr.last + sr.unit);
    if (sr.stat.min !== null) sv('最低', sr.stat.min + sr.unit);
    if (sr.stat.max !== null) sv('最高', sr.stat.max + sr.unit);

    $('chartNote').textContent = sr.name + '（' + dashRange + ' 天）';
    $('chartHint').textContent = sr.stat.n < 7
      ? '⚠️ 只有 ' + sr.stat.n + ' 天数据，看不出趋势。多记几天再看。'
      : '断开的缺口 = 那天没记录（不是记成了 0）。';
  }

  /* ---------- 两个指标一起看 ---------- */
  function renderPair() {
    var box = clear($('pairOut'));
    var series = L.chartSeries(state, dashRange, curDate);
    var a = null, b = null;
    series.forEach(function (s) { if (s.key === pairA) a = s; if (s.key === pairB) b = s; });
    if (!a || !b) { box.appendChild(el('div', 'empty', '选两个指标')); return; }
    if (a.key === b.key) { box.appendChild(el('div', 'empty', 'A 和 B 是同一个指标，换一个看看')); return; }

    var cm = L.coMove(a, b);
    var row = el('div', 'pair-row');
    row.appendChild(el('div', 'nm', a.name + ' ↔ ' + b.name));
    row.appendChild(el('div', 'rt', cm.rate === null ? '—' : Math.round(cm.rate * 100) + '%'));
    box.appendChild(row);
    box.appendChild(el('div', 'rr',
      cm.n < 3
        ? '只有 ' + cm.n + ' 天两边都有数据，太少，算不了'
        : '共同有数据的 ' + cm.n + ' 天里，有 ' + Math.round(cm.rate * 100) + '% 的天是同向变化' +
          (cm.n < 7 ? '（⚠️ 样本少于 7 天，别当结论）' : '')));
  }

  /* ==========================================================================
     M6：周报 / 月报 / 按周导出
     ======================================================================== */

  /** 当前所在的周键 */
  function curWeek() { return L.isoWeekKey(curDate) || L.isoWeekKey(L.todayKey()); }

  /** 周报 */
  function runWeekReport() {
    if (!A) { toast('AI 模块没加载'); return; }
    if (!aiReady()) { toast('还没设置 API key'); openSettings(); return; }
    var wk = curWeek();
    var r = L.weekRange(wk);
    if (!r) { toast('周次算不出来'); return; }
    var w = L.weekSummary(state, wk);
    if (!w || !w.daysWithRecords) { toast('这一周还没有记录'); return; }

    var btn = $('btnWeekReport');
    var old = btn.textContent;
    btn.disabled = true; btn.textContent = '⏳ 分析本周…';

    A.rangeReport(state, r.from, r.to, aiSettings()).then(function (res) {
      btn.disabled = false; btn.textContent = old;
      accountUsage(res.usage);
      if (!res.ok) { aiFail(res.error); return; }
      saveReport(wk, 'week', res.data, res.usage);
      renderReports();
      toast('周报已生成（' + res.data.sampleSize + ' 天数据）');
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = old;
      toast('出错了：' + (e && e.message || e));
    });
  }

  /** 月报（分层压缩：喂周摘要） */
  function runMonthReport() {
    if (!A) { toast('AI 模块没加载'); return; }
    if (!aiReady()) { toast('还没设置 API key'); openSettings(); return; }
    var d = L.fromDateKey(curDate) || new Date();
    var y = d.getFullYear(), m = d.getMonth() + 1;

    var btn = $('btnMonthReport');
    var old = btn.textContent;
    btn.disabled = true; btn.textContent = '⏳ 分析本月…';

    A.monthReport(state, y, m, aiSettings()).then(function (res) {
      btn.disabled = false; btn.textContent = old;
      accountUsage(res.usage);
      if (!res.ok) { aiFail(res.error); return; }
      saveReport(y + '-' + (m < 10 ? '0' : '') + m, 'month', res.data, res.usage);
      renderReports();
      toast('月报已生成（基于 ' + (res.weekCount || 0) + ' 周摘要）');
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = old;
      toast('出错了：' + (e && e.message || e));
    });
  }

  /** 报告存档（放 state.reports） */
  function saveReport(key, kind, data, usage) {
    var s = L.normalizeState(state);
    if (!s.reports) s.reports = {};
    s.reports[key] = {
      kind: kind,
      text: JSON.stringify(data),
      at: Date.now(),
      tokens: usage ? { in: usage.in, out: usage.out } : undefined
    };
    state = s;
    if (!saveState(state)) toast('报告生成了，但存不进去（存储写失败）');
  }

  /** 读出最近一份报告并渲染 */
  function renderReports() {
    var box = clear($('reportBox'));
    var keys = Object.keys(state.reports || {}).sort();
    if (!keys.length) { box.appendChild(el('p', 'hint', '还没有报告。点上面的按钮生成一份。')); return; }

    var latest = keys[keys.length - 1];
    var rep = state.reports[latest];
    var data = null;
    try { data = JSON.parse(rep.text); } catch (e) { data = null; }

    var head = el('div', 'rep-head');
    head.appendChild(el('b', null, rep.kind === 'month' ? '月报 ' : '周报 '));
    head.appendChild(document.createTextNode(latest));
    var when = rep.at ? new Date(rep.at) : null;
    head.appendChild(el('span', 'rr', when ? '　生成于 ' + L.nowHHMM(when) : ''));
    box.appendChild(head);

    if (!data) { box.appendChild(el('div', 'empty', '这份报告读不出来')); return; }

    var st = el('div', 'chart-stats');
    st.appendChild(el('span', null, '样本：' + (data.sampleSize || 0) + (rep.kind === 'month' ? ' 周' : ' 天')));
    if (rep.tokens) st.appendChild(el('span', null, 'token ' + rep.tokens.in + '+' + rep.tokens.out));
    box.appendChild(st);

    if (rep.kind === 'month') {
      if (Array.isArray(data.trend) && data.trend.length) {
        box.appendChild(el('div', 'sh', '趋势'));
        data.trend.forEach(function (t) {
          var row = el('div', 'rc');
          row.appendChild(el('div', 'rt', (L.dimOf(t.dim) ? L.dimOf(t.dim).name : t.dim) +
            (t.weeks && t.weeks.length ? '（第 ' + t.weeks.join('、') + ' 周）' : '')));
          row.appendChild(el('div', 'rb', t.conclusion || ''));
          box.appendChild(row);
        });
      }
      if (data.suggestion) {
        box.appendChild(el('div', 'sh', '下个月最值得改的一件事'));
        var g = el('div', 'rc next');
        g.appendChild(el('div', 'rb', data.suggestion));
        box.appendChild(g);
      }
    } else {
      [['good', '做得好'], ['bad', '要留意'], ['findings', '发现的规律']].forEach(function (p) {
        var arr = data[p[0]];
        if (!Array.isArray(arr) || !arr.length) return;
        box.appendChild(el('div', 'sh', p[1]));
        arr.forEach(function (x) {
          var row = el('div', 'rc');
          if (x.dim || (x.days && x.days.length)) {
            var meta = [];
            if (x.dim) meta.push(L.dimOf(x.dim) ? L.dimOf(x.dim).name : x.dim);
            if (x.days && x.days.length) meta.push('第 ' + x.days.join('、') + ' 天');
            if (meta.length) row.appendChild(el('div', 'rt', meta.join('　')));
          }
          row.appendChild(el('div', 'rb', x.conclusion || JSON.stringify(x)));
          box.appendChild(row);
        });
      });
    }

    if (Array.isArray(data.insufficient) && data.insufficient.length) {
      box.appendChild(el('div', 'sh', '数据不足、没下结论的地方'));
      data.insufficient.forEach(function (x) {
        box.appendChild(el('div', 'rr', '· ' + x));
      });
    }
    if (Array.isArray(data.invalidRefs) && data.invalidRefs.length) {
      // 防御性展示：AI 引用了不存在的编号，说明它编了 —— 让用户知道我们剔除了
      box.appendChild(el('p', 'hint',
        '⚠️ AI 引用了 ' + data.invalidRefs.length + ' 个不存在的编号，已自动剔除（防幻觉）。'));
    }

    if (keys.length > 1) {
      box.appendChild(el('p', 'hint', '共 ' + keys.length + ' 份报告，显示最新一份（' + latest + '）。'));
    }
  }

  /* ---------- 导出素材（改动 ②③：默认最近有记录的那一周）----------
   *
   * ⚠️ 这里解决的是一个很常见的坑：
   *   周一到周五记了一堆、周末忘了导出，下周一打开 App 点导出 ——
   *   原先写死取「当前日期所在的周」，于是导出的是**新一周的空档**。
   *   你的记录明明还在，但导出文件是空的，很容易以为是「要记满一周才能导」。
   *
   * 现在：
   *   · 默认导出**最近有记录的那一周**（只要记过就导得出东西）
   *   · 按钮上直接写明「哪一周 · 几天有记录」，不会误点
   *   · 如果当前这一周是空的，但更早有记录 → **先问一句**再导
   * ------------------------------------------------------------------------ */

  /** 算出"该导出哪一周"，并刷新按钮文案 */
  function resolveExportTarget() {
    var btn = $('btnExportWeek');
    var curWk = curWeek();
    var curW = L.weekSummary(state, curWk);
    var last = L.lastWeekWithRecords(state, curDate);

    if (!last) {
      if (btn) btn.textContent = '⬇️ 导出本周素材（还没有记录）';
      return null;
    }
    var curEmpty = !(curW && curW.daysWithRecords);
    if (btn) {
      btn.textContent = '⬇️ 导出素材：' + last.week + '（' + last.daysWithRecords + '/7 天）';
    }
    return {
      week: last.week,
      daysWithRecords: last.daysWithRecords,
      curWeek: curWk,
      curEmpty: curEmpty
    };
  }

  /** 点导出按钮 */
  function exportWeek() {
    var t = resolveExportTarget();
    if (!t) { toast('还没有任何记录，没什么可导出的'); return; }

    /*
     * 改动 ③：当前这一周是空的（但更早有记录）→ 先问一句。
     * 不弹这个确认的话，用户在"新的一周刚打开"时会不知不觉导出空档，
     * 还以为是 App 出问题了。
     */
    if (t.curEmpty && t.week !== t.curWeek) {
      var w2 = L.weekSummary(state, t.curWeek);
      openSheet(function (panel) {
        panel.appendChild(el('h3', null, '这一周还没记录'));
        panel.appendChild(el('p', 'hint',
          '当前这一周（' + t.curWeek + '）一条记录都没有。\n' +
          '最近有记录的是 ' + t.week + '（' + t.daysWithRecords + '/7 天）。'));

        var btns = el('div', 'btns');
        var b1 = el('button', 'btn p grow', '导出 ' + t.week);
        b1.onclick = function () { closeSheet(); doExportWeek(t.week); };
        var b2 = el('button', 'btn', '还是导出空的 ' + t.curWeek);
        b2.onclick = function () { closeSheet(); doExportWeek(t.curWeek); };
        var b3 = el('button', 'btn', '取消');
        b3.onclick = closeSheet;
        btns.appendChild(b1); btns.appendChild(b2); btns.appendChild(b3);
        panel.appendChild(btns);
      });
      return;
    }

    doExportWeek(t.week);
  }

  /** 真正导出某一周 */
  function doExportWeek(wk) {
    var md = L.exportWeekMarkdown(state, wk);
    if (md === null) { toast('周次算不出来'); return; }
    var w = L.weekSummary(state, wk);
    var days = w ? w.daysWithRecords : 0;

    downloadText('个人规划导出-' + wk + '.md', md, 'text/markdown');

    // 记一下导出时间，让备份提醒能感知
    state.settings.lastExportAt = Date.now();
    saveState(state);
    renderBanners();

    toast(days
      ? '已导出 ' + wk + '（' + days + '/7 天）→ 丢进 U 盘 我的生活\\素材\\'
      : '已导出 ' + wk + '（这一周没有记录，文件是空档）');
  }

  /* ==========================================================================
     渲染总入口
     ======================================================================== */
  function renderAll() {
    var d = L.fromDateKey(curDate);
    if (d) {
      $('dateText').textContent = curDate;
      var wk = '一二三四五六日'[L.isoDayOfWeek(curDate) - 1];
      $('dayLabel').textContent = '星期' + wk + (curDate === L.todayKey() ? ' · 今天' : '');
    }
    renderBanners();
    renderTimeline();
    renderSummary();
    renderReview();
  }

  /* ==========================================================================
     事件绑定
     ======================================================================== */
  function go(delta) {
    var n = delta === 'today' ? L.todayKey() : L.addDays(curDate, delta);
    if (!n) return;
    curDate = n;
    editingId = null;
    formVal = {};
    renderForm();
    renderAll();
  }

  $('btnPrev').onclick = function () { go(-1); };
  $('btnNext').onclick = function () { go(1); };
  $('btnToday').onclick = function () { go('today'); };

  $('btnSaveRaw').onclick = function () {
    var ta = $('quick');
    var txt = ta.value.trim();
    if (!txt) { toast('先写点什么'); return; }
    var ok = editingId
      ? (function () {
          var r = L.updateEntry(state, curDate, editingId, { raw: txt }, Date.now());
          if (r.error) { toast(r.error); return false; }
          state = r.state;
          if (!saveState(state)) { toast('保存失败：存储写不进去'); return false; }
          editingId = null; renderAll(); return true;
        })()
      : doSaveEntry({ raw: txt });
    if (ok) { ta.value = ''; toast('已保存'); }
  };

  $('btnClear').onclick = function () { $('quick').value = ''; $('quick').focus(); };
  $('btnAI').onclick = function () {
    var txt = $('quick').value.trim();
    if (!txt) { toast('先写点什么，比如「今天睡到9点，跑了3公里」'); $('quick').focus(); return; }
    runAIParse(txt);
  };
  $('btnReview').onclick = runReview;
  $('btnWeekReport').onclick = runWeekReport;
  $('btnMonthReport').onclick = runMonthReport;
  $('btnExportWeek').onclick = exportWeek;

  $('btnAddEntry').onclick = function () {
    if (!Object.keys(formVal).length) { toast('表单还是空的，先填一项'); return; }
    if (editingId) {
      var r = L.updateEntry(state, curDate, editingId, formVal, Date.now());
      if (r.error) { toast(r.error); return; }
      state = r.state;
      if (!saveState(state)) { toast('保存失败：存储写不进去'); return; }
      editingId = null; formVal = {}; renderForm(); renderAll(); toast('已更新');
      return;
    }
    if (doSaveEntry(formVal)) {
      formVal = {}; renderForm(); toast('已保存');
    }
  };

  $('btnResetForm').onclick = function () {
    formVal = {}; editingId = null; renderForm(); toast('表单已重置');
  };

  /*
   * ⚠️ 齿轮按钮只能有**一处**赋值。
   * 踩过的坑：这里原先还有一行占位 `toast('设置页在 M4/M6 做')`，
   * 它排在 M4 接线**之后**，于是把真正的 openSettings 覆盖掉了 ——
   * 表现是"点齿轮没反应 / 设置页打不开"，而且不报错，很难查。
   * 修的时候我第一次又把整行删了（连 openSettings 一起删了），设置页直接没入口。
   * 教训：接完线要 grep 确认同一个 id 只有一处 onclick。
   */
  $('btnSettings').onclick = openSettings;

  document.querySelectorAll('nav button').forEach(function (b) {
    b.onclick = function () {
      var v = b.getAttribute('data-view');
      if (v === 'history') { openHistory(); return; }
      if (v === 'settings') { openSettings(); return; }
      // today / dash 是"视图切换"，由 switchView 统一处理（含 aria-current）
      switchView(v);
    };
  });

  function openHistory() {
    openSheet(function (panel) {
      panel.appendChild(el('h3', null, '历史记录'));
      var dates = L.datesWithRecords(state);
      if (!dates.length) { panel.appendChild(el('div', 'empty', '还没有任何记录')); return; }
      dates.slice(0, 90).forEach(function (dk) {
        var day = L.getDay(state, dk);
        var t = L.dayTotals(state, dk);
        var row = el('div', 'entry');
        row.appendChild(el('div', 't', dk.slice(5)));
        var b = el('div', 'body');
        var bits = [];
        if (t.sleepMinutes !== null) bits.push('睡眠' + L.formatMinutes(t.sleepMinutes));
        if (t.expense !== null) bits.push('支出' + t.expense);
        b.appendChild(el('div', 'txt', bits.length ? bits.join(' · ') : (day.entries.length + ' 条记录')));
        b.appendChild(el('div', 'hint', '记了 ' + t.filled + '/' + t.total + ' 个维度 · ' + day.entries.length + ' 条'));
        row.appendChild(b);
        row.style.cursor = 'pointer';
        row.onclick = function () { curDate = dk; closeSheet(); formVal = {}; renderForm(); renderAll(); };
        panel.appendChild(row);
      });
      panel.appendChild(el('p', 'hint', '只显示最近 90 天。点某一天可以跳过去。'));
    });
  }

  function openSettings() {
    openSheet(function (panel) {
      panel.appendChild(el('h3', null, '设置'));

      /* ---------- AI 设置 ---------- */
      panel.appendChild(el('div', 'sh', 'AI（DeepSeek）'));

      var keyRow = el('div', 'row');
      keyRow.appendChild(el('label', null, 'API key'));
      var keyWrap = el('div', 'fi');
      var keyInput = document.createElement('input');
      keyInput.type = 'password';
      keyInput.placeholder = 'sk-...';
      keyInput.value = state.settings.apiKey || '';
      keyInput.autocomplete = 'off';
      keyInput.spellcheck = false;
      keyWrap.appendChild(keyInput);
      keyRow.appendChild(keyWrap);
      panel.appendChild(keyRow);

      var keyBtns = el('div', 'btns');
      var showBtn = el('button', 'btn', '👁 显示');
      showBtn.onclick = function () {
        var showing = keyInput.type === 'text';
        keyInput.type = showing ? 'password' : 'text';
        showBtn.textContent = showing ? '👁 显示' : '🙈 隐藏';
      };
      var saveKey = el('button', 'btn p', '保存 key');
      saveKey.onclick = function () {
        state.settings.apiKey = keyInput.value.trim();
        if (saveState(state)) toast('key 已保存到本机');
        else toast('保存失败：存储写不进去');
      };
      keyBtns.appendChild(showBtn); keyBtns.appendChild(saveKey);
      panel.appendChild(keyBtns);

      panel.appendChild(el('p', 'hint',
        'key 只存在你这台手机上，不会发到任何别的地方（除了 DeepSeek 官方接口）。' +
        '申请地址：platform.deepseek.com/api_keys'));

      /* 会话模式 */
      var sessRow = el('div', 'row');
      var sessCb = document.createElement('input');
      sessCb.type = 'checkbox';
      sessCb.checked = !!state.settings.apiKeySessionOnly;
      sessCb.style.width = 'auto';
      sessCb.onchange = function () {
        state.settings.apiKeySessionOnly = sessCb.checked;
        saveState(state);
        toast(sessCb.checked ? '已改为「仅本次会话」：关掉页面 key 就没了' : '已改为长期保存');
      };
      var sessWrap = el('div', 'fi');
      sessWrap.appendChild(sessCb);
      sessWrap.appendChild(el('span', null, ' 仅本次会话（不写进手机存储）'));
      sessRow.appendChild(sessWrap);
      panel.appendChild(sessRow);

      /* 模型 */
      var modelRow = el('div', 'row');
      modelRow.appendChild(el('label', null, '模型'));
      var modelSel = document.createElement('select');
      (A ? A.PROVIDERS.deepseek.models : ['deepseek-flash', 'deepseek-v4-pro']).forEach(function (m) {
        var o = document.createElement('option');
        o.value = m; o.textContent = m;
        if ((state.settings.model || 'deepseek-flash') === m) o.selected = true;
        modelSel.appendChild(o);
      });
      modelSel.onchange = function () { state.settings.model = modelSel.value; saveState(state); toast('模型改为 ' + modelSel.value); };
      var mw = el('div', 'fi'); mw.appendChild(modelSel); modelRow.appendChild(mw);
      panel.appendChild(modelRow);
      panel.appendChild(el('p', 'hint', 'deepseek-flash 便宜快；v4-pro 更聪明但贵几倍。日常用 flash 就够。'));

      /* 自定义地址 */
      var urlRow = el('div', 'row');
      urlRow.appendChild(el('label', null, '自定义地址'));
      var urlInput = document.createElement('input');
      urlInput.type = 'text';
      urlInput.placeholder = '留空 = 官方 api.deepseek.com';
      urlInput.value = state.settings.baseUrl || '';
      urlInput.oninput = function () { state.settings.baseUrl = urlInput.value.trim(); };
      urlInput.onblur = function () { saveState(state); };
      var uw = el('div', 'fi'); uw.appendChild(urlInput); urlRow.appendChild(uw);
      panel.appendChild(urlRow);
      panel.appendChild(el('p', 'hint', '只有用到自建代理时才填。⚠️ 填了别的域名会被 CSP 拦掉（安全设计）。'));

      /* 预算与用量 */
      panel.appendChild(el('div', 'sh', '用量与预算'));
      var budRow = el('div', 'row');
      budRow.appendChild(el('label', null, '月预算'));
      var budInput = document.createElement('input');
      budInput.type = 'number';
      budInput.min = '0';
      budInput.value = (typeof state.settings.monthlyBudget === 'number' ? state.settings.monthlyBudget : 5);
      budInput.onchange = function () {
        var v = Number(budInput.value);
        state.settings.monthlyBudget = (isFinite(v) && v >= 0) ? v : 5;
        saveState(state);
      };
      var bw = el('div', 'fi'); bw.appendChild(budInput); budRow.appendChild(bw);
      budRow.appendChild(el('label', null, '元/月'));
      panel.appendChild(budRow);

      if (A) {
        var mu = A.monthUsage(state.settings.ledger, Date.now());
        var warn = A.budgetWarning(state.settings.ledger, state.settings.monthlyBudget, Date.now());
        panel.appendChild(el('div', 'prev',
          '本月已用：' + mu.cost.toFixed(4) + ' 元（' + mu.calls + ' 次调用，' +
          mu.in + ' + ' + mu.out + ' token）\n' +
          '预算：' + warn.budget + ' 元　已用 ' + Math.round(warn.ratio * 100) + '%' +
          (warn.exceeded ? '\n⚠️ 已超预算，检查一下是不是有异常调用' :
           (warn.warn ? '\n⚠️ 快到预算了' : ''))));
        panel.appendChild(el('p', 'hint',
          '这是按接口返回的真实 token 数记的账，不是估算。' +
          '预算告警的目的不是省钱，是防异常（比如代码 bug 导致循环调用）。'));
      }

      /* ---------- 存储与数据 ---------- */
      panel.appendChild(el('div', 'sh', '存储与数据'));
      panel.appendChild(el('div', 'prev',
        '存储状态：' + (storageOK ? '✅ 可以保存' : '❌ 无法保存（浏览器拒绝了本地存储）') + '\n' +
        'AI：' + (aiReady() ? '✅ 已配置' : '⚠️ 还没填 API key')));

      var btns = el('div', 'btns');
      var b1 = el('button', 'btn p', '导出备份 (JSON)');
      b1.onclick = function () { exportBackup(); closeSheet(); };
      var b2 = el('button', 'btn', '导出纯文本（给 AI 网页版分析）');
      b2.onclick = function () {
        var dates = L.datesWithRecords(state);
        if (!dates.length) { toast('还没有记录'); return; }
        var from = dates[dates.length - 1], to = dates[0];
        var txt = L.exportPlainText(state, from, to);
        downloadText('个人规划-' + from + '_' + to + '.txt', txt, 'text/plain');
      };
      var b3 = el('button', 'btn', '导出今天的 Markdown');
      b3.onclick = function () {
        var md = L.exportMarkdown(state, curDate);
        if (!md) { toast('今天还没记录'); return; }
        downloadText('个人规划-' + curDate + '.md', md, 'text/markdown');
      };
      var b4 = el('button', 'btn', '导入备份');
      b4.onclick = function () { importBackup(); };
      btns.appendChild(b1); btns.appendChild(b2); btns.appendChild(b3); btns.appendChild(b4);
      panel.appendChild(btns);

      var cnt = L.datesWithRecords(state).length;
      var total = 0;
      Object.keys(state.days).forEach(function (k) { total += state.days[k].entries.length; });
      panel.appendChild(el('p', 'hint', '当前共 ' + cnt + ' 天、' + total + ' 条记录。'));
    });
  }

  function importBackup() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        var st = null;
        try { st = L.deserialize(String(fr.result)); } catch (e) { st = null; }
        if (!st) { toast('这个文件不是有效的备份'); return; }
        // 导入前自动快照，提供撤销
        try {
          localStorage.setItem(L.BACKUP_KEY, L.serialize(state));
          localStorage.setItem(L.BACKUP_AT_KEY, String(Date.now()));
        } catch (e2) {}
        // 保留当前 key（备份里不含 key）
        var keepKey = state.settings.apiKey;
        var keepSession = state.settings.apiKeySessionOnly;
        st.settings.apiKey = keepKey;
        st.settings.apiKeySessionOnly = keepSession;
        state = st;
        if (!saveState(state)) { toast('导入后写入失败'); return; }
        closeSheet();
        renderForm(); renderAll();
        toast('导入完成（可用「撤销上次导入」还原）');
      };
      fr.readAsText(f);
    };
    inp.click();
  }

  /* ==========================================================================
     启动
     ======================================================================== */
  storageOK = storageProbe();
  state = loadState();
  renderForm();
  renderAll();
  if (!storageOK) { /* banner 在 renderBanners 里会显示 */ }
})();
</script>
<!-- PWA 增强层：注册离线缓存、处理「安装到桌面」与系统提醒。
     它不读写 App 的业务数据；file:// 打开时整段直接跳过。 -->
<script>
/* ===========================================================================
 * 个人规划 —— PWA 增强层（由 pwa/build-pwa.js 注入到 index.html 末尾）
 *
 * 职责只有两件：
 *   ① 注册 Service Worker → 装到桌面后离线可用
 *   ② 处理「安装到桌面」提示
 *
 * 严格隔离：不读取、不修改 App 的任何业务数据。
 * 通过 file:// 打开时下面的判断会直接返回，App 行为与从前完全一致。
 *
 * ⚠️ 和课程表那份 hook 的三处差异（都是这个 App 特有的）：
 *
 *   ① **横幅挂载点是 #banners**（不是 #bannerHost）——
 *      个人规划里 #banners 是主容器顶部的横幅区，已经在用。
 *   ② **CSS 变量名不同**：这个 App 用 --brand / --brand-soft / --ink2 / --ink3，
 *      课程表用 --accent / --accent-soft / --ink-2 / --ink-3。
 *      写错了不会报错，只是样式全丢（横幅变成没样式的光秃秃一段）。
 *   ③ **文案必须提醒"AI 要联网"** —— 这是这个 App 和前三个最大的不同：
 *      它装到桌面后能离线看和手填，但**调 AI 必须联网**。
 *      不写清楚的话，用户断网时点 AI 没反应会以为 App 坏了。
 * =========================================================================== */
(function () {
  'use strict';
  try {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;

    /* 这个 App 的 CSS 变量名（写错不报错，只是样式全丢） */
    var STYLE_BOX = [
      'margin:0 0 10px', 'padding:12px 14px', 'border-radius:12px',
      'background:var(--brand-soft)', 'border:1px solid var(--brand)',
      'color:var(--ink)', 'font-size:13.5px', 'line-height:1.5',
      'display:flex', 'gap:10px', 'align-items:flex-start'
    ].join(';');

    var STYLE_GO = 'background:var(--brand);color:#fff;font-weight:600;font-size:13px;' +
                   'padding:8px 16px;border-radius:99px;border:0;min-height:34px';
    var STYLE_LATER = 'font-size:12.5px;color:var(--ink2);padding:8px 10px;border:0;' +
                      'background:transparent;min-height:34px';

    /* ---------- ① 离线缓存 ---------- */
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (e) {
        console.warn('离线缓存注册失败（不影响正常使用）：', e);
      });
    });

    /* ---------- ② 安装到桌面 ---------- */
    var installEvent = null;

    function showInstallBanner() {
      var host = document.getElementById('banners');
      if (!host || document.getElementById('pwa-install-banner')) return;

      var box = document.createElement('div');
      box.id = 'pwa-install-banner';
      box.setAttribute('style', STYLE_BOX);

      /*
       * ⚠️ 这里用 innerHTML 是**可以**的：内容全是本文件里的静态字面量，
       *    没有任何用户数据或 AI 输出。这个 App 的 XSS 底线是
       *    "AI 内容和用户数据绝不进 innerHTML"，不是"禁用 innerHTML"。
       */
      box.innerHTML =
        '<span style="font-size:16px">📲</span>' +
        '<div style="flex:1">' +
        '<b>装到桌面，用起来更像 App</b>' +
        '<div style="font-size:12px;color:var(--ink2);margin-top:2px">' +
        '装好后全屏打开、没有地址栏。<b>手填和查看断网也能用</b>；' +
        '只有调 AI（拆字段、日复盘、周报）需要联网。' +
        '</div>' +
        '<div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button id="pwa-install-go" style="' + STYLE_GO + '">立即安装</button>' +
        '<button id="pwa-install-hide" style="' + STYLE_LATER + '">以后再说</button>' +
        '</div></div>';

      host.appendChild(box);

      box.querySelector('#pwa-install-go').addEventListener('click', function () {
        if (!installEvent) return;
        installEvent.prompt();
        installEvent.userChoice.then(function () {
          installEvent = null;
          removeBanner();
        });
      });
      box.querySelector('#pwa-install-hide').addEventListener('click', removeBanner);
    }

    function removeBanner() {
      var b = document.getElementById('pwa-install-banner');
      if (b && b.parentNode) b.parentNode.removeChild(b);
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      installEvent = e;
      showInstallBanner();
    });

    window.addEventListener('appinstalled', removeBanner);
  } catch (e) {
    /* PWA 增强失败绝不能影响 App 本身 */
    try { console.warn('PWA 增强层跳过：', e); } catch (e2) {}
  }
})();
</script>
</body>
</html>
