<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="个人规划">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: 'self'; manifest-src 'self'; worker-src 'self'; connect-src https://api.deepseek.com; form-action 'none'; base-uri 'none'">
<!-- PWA 声明：由 pwa/build-pwa.js 注入。通过 file:// 打开时这些会被忽略。 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>个人规划</title>
<style>
/* ===========================================================================
   个人规划 —— 样式
   手机优先。宽度 > 900px 时切到双栏，但**是同一套 HTML + 媒体查询**，不是两套代码。
   =========================================================================== */
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1c1e21; --ink2:#606770; --ink3:#8a8f98;
  --line:#e4e6eb; --brand:#0f766e; --brand-soft:#e6f4f2;
  --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --ok:#15803d; --ok-soft:#dcfce7;
  --r:12px; --gap:10px;
  --growth:#2563eb; --life:#7c3aed;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:76px;                     /* 给底部导航留位 */
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:20;background:rgba(246,247,249,.94);
  backdrop-filter:saturate(1.6) blur(8px);border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:8px;padding:10px 0}
.hd h1{font-size:17px;margin:0;flex:1;font-weight:650}
.hd .sub{font-size:12px;color:var(--ink2);font-weight:400;margin-left:6px}
.iconbtn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.iconbtn:active{background:#eef0f3}
.datebar{display:flex;align-items:center;gap:6px;padding:0 0 10px}
.datebar .d{flex:1;font-size:13px;color:var(--ink2);text-align:center}
.mini{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:6px 11px;font-size:12px;color:var(--ink2);cursor:pointer;min-height:28px;
}
.mini:active{background:#eef0f3}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);border-radius:var(--r);padding:12px;
  margin:0 0 var(--gap);border:1px solid var(--line);
}
.card h2{font-size:13px;margin:0 0 8px;color:var(--ink2);font-weight:600;letter-spacing:.02em}
.card h2 .cnt{color:var(--ink3);font-weight:400}

/* ---------- 录入 ---------- */
#quick{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  font:inherit;resize:vertical;min-height:52px;background:#fbfcfd;color:var(--ink);
}
#quick:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.hint{font-size:12px;color:var(--ink3);margin:6px 0 0}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;
}
.btn:active{background:#eef0f3}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.btn.p:active{background:#0b5f59}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.grow{flex:1;justify-content:center}

/* ---------- 时间线 ---------- */
.tl{position:relative;padding-left:0}
.entry{
  display:flex;gap:9px;padding:9px 0;border-top:1px dashed var(--line);
}
.entry:first-child{border-top:0}
.entry .t{
  flex:0 0 44px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;
  padding-top:2px;
}
.entry .body{flex:1;min-width:0}
.entry .dims{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.chip{
  font-size:11px;padding:1px 7px;border-radius:999px;background:#f0f2f5;color:var(--ink2);
  white-space:nowrap;
}
.chip.g{background:#e8efff;color:var(--growth)}
.chip.l{background:#f1eaff;color:var(--life)}
.entry .txt{font-size:14px;word-break:break-word;color:var(--ink)}
.acts{margin-top:6px;display:flex;gap:6px}
/* ⚠️ 可点区域别低于 28px：手机上手指点不准。
   第一版是 padding 3px 8px + 11px 字号 = 24px 高，测量时被抓出来了。 */
.tiny{
  font-size:12px;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 11px;color:var(--ink2);cursor:pointer;min-height:28px;
}
.tiny:active{background:#eef0f3}
.empty{color:var(--ink3);font-size:13px;padding:10px 2px;text-align:center}

/* ---------- 汇总 ---------- */
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.sum .kv{display:flex;gap:4px;align-items:baseline}
.sum .k{color:var(--ink3);font-size:12px}
.sum .v{font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.miss{font-size:12px;color:var(--ink3);margin-top:6px}

/* ---------- 表单 ---------- */
.acc{border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc>summary{
  list-style:none;cursor:pointer;padding:11px 2px;display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:550;
}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .nm{flex:1}
.acc>summary .st{font-size:12px;color:var(--ink3);font-weight:400}
.acc>summary .arw{color:var(--ink3);font-size:12px;transition:transform .15s}
.acc[open]>summary .arw{transform:rotate(90deg)}
.acc .bd{padding:2px 2px 14px}
.row{display:flex;gap:8px;align-items:center;margin:7px 0}
.row>label{flex:0 0 74px;font-size:13px;color:var(--ink2)}
.row .fi{flex:1;min-width:0}
input[type=text],input[type=number],input[type=time],textarea,select{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  font:inherit;font-size:14px;background:#fbfcfd;color:var(--ink);
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
textarea{resize:vertical;min-height:60px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;
  font-size:13px;cursor:pointer;color:var(--ink2);
}
.tag[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.stars{display:flex;gap:5px}
.star{
  width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;
  font-size:13px;cursor:pointer;color:var(--ink2);font-variant-numeric:tabular-nums;
}
.star[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.sub{border:1px solid var(--line);border-radius:10px;padding:9px;margin:8px 0;background:#fbfcfd}
.sub h4{margin:0 0 6px;font-size:12px;color:var(--ink2);font-weight:600;display:flex;align-items:center}
.sub h4 .rm{margin-left:auto}
.mini2{
  font-size:11px;border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:2px 7px;color:var(--ink2);cursor:pointer;
}

/* ---------- 提示条 ---------- */
.banner{
  border-radius:var(--r);padding:10px 12px;margin:0 0 var(--gap);font-size:13px;
  display:flex;gap:8px;align-items:flex-start;border:1px solid transparent;
}
.banner.soft{background:var(--brand-soft);color:#0b5f59;border-color:#bfe3df}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:#fde68a}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:#fecaca}
.banner.ok{background:var(--ok-soft);color:var(--ok);border-color:#bbf7d0}
.banner .x{margin-left:auto;cursor:pointer;opacity:.6;flex:0 0 auto;padding:2px 4px;font-size:14px}
.banner button{
  font:inherit;font-size:12px;border:1px solid currentColor;background:transparent;
  color:inherit;border-radius:8px;padding:5px 10px;cursor:pointer;min-height:28px;flex:0 0 auto;
}

/* ---------- 底部导航 ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
}
nav .in{max-width:720px;margin:0 auto;display:flex}
nav button{
  flex:1;border:0;background:transparent;font:inherit;font-size:11px;color:var(--ink3);
  padding:5px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
}
nav button .ic{font-size:19px;line-height:1}
nav button[aria-current="true"]{color:var(--brand);font-weight:600}

/* ---------- 复盘三列 ---------- */
.review{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.rc{padding:8px 0}
.rc+.rc{border-top:1px dashed var(--line)}
.rt{font-size:11px;color:var(--ink3);margin-bottom:3px;letter-spacing:.03em}
.rb{font-size:14px;line-height:1.55;word-break:break-word}
.rc.next .rb{color:var(--brand);font-weight:550}

/* ---------- 仪表盘（M5）---------- */
.dash-actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.dash-actions .mini[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.heat-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.heat{display:flex;gap:3px;min-width:max-content}
.heat .wk{display:flex;flex-direction:column;gap:3px}
.heat .cell{width:12px;height:12px;border-radius:3px;background:#eceff3}
.heat .cell.l1{background:#a7e0d8}
.heat .cell.l2{background:#5cc4b6}
.heat .cell.l3{background:#1a9e8f}
.heat .cell.l4{background:var(--brand)}
.heat .cell.out{background:transparent}
.heat .mo{font-size:9px;color:var(--ink3);height:11px;line-height:11px;white-space:nowrap}
#chart{width:100%;height:auto;display:block;margin-top:4px;border-radius:8px}
.chart-stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin-top:6px}
.chart-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.pair-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.pair-row:first-child{border-top:0}
.pair-row .nm{flex:1;font-size:13px}
.pair-row .rt{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pair-row .rr{font-size:11px;color:var(--ink3)}

/* ---------- 报告卡片（M6）---------- */
.rep-head{font-size:14px;margin-bottom:6px}
.rep-head .rr{font-size:11px;color:var(--ink3);font-weight:400}
#reportBox code{background:#f0f2f5;padding:1px 5px;border-radius:5px;font-size:12px}

/* ---------- 弹层里的小标题 ---------- */
.sh{font-size:12px;color:var(--ink3);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);letter-spacing:.03em}
.sh:first-of-type{margin-top:4px}

/* ---------- 弹层 ---------- */
.sheet{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:none;
  align-items:flex-end;justify-content:center;
}
.sheet.on{display:flex}
.sheet .panel{
  background:var(--card);width:100%;max-width:720px;border-radius:16px 16px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;
}
.sheet h3{margin:0 0 10px;font-size:15px}
.sheet .prev{
  background:#fbfcfd;border:1px solid var(--line);border-radius:10px;padding:11px;
  font-size:13px;margin:8px 0;white-space:pre-wrap;word-break:break-word;
}
.sheet .prev .kk{color:var(--ink3);font-size:11px}
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:50;
  background:rgba(28,30,33,.92);color:#fff;padding:9px 15px;border-radius:999px;
  font-size:13px;max-width:88vw;text-align:center;opacity:0;transition:opacity .18s;
  pointer-events:none;
}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 宽屏：同一套 HTML，只是变双栏 ---------- */
@media (min-width:900px){
  .wrap{max-width:1080px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
  .cols>*{margin-bottom:0}
  #quick{min-height:72px}
  body{padding-bottom:24px}
  nav{position:sticky;bottom:0;border-radius:0}
}

/* 深色模式（系统跟随） */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181c; --card:#1e2126; --ink:#e8eaed; --ink2:#a8adb7; --ink3:#7d838d;
    --line:#2c3037; --brand:#2dd4bf; --brand-soft:#123b38;
    --warn-soft:#3b2f11; --bad-soft:#3b1616; --ok-soft:#12301c;
    --growth:#7aa2f7; --life:#bb9af7;
  }
  input,textarea,select,#quick,.sub,.sheet .prev{background:#23262c}
  .chip{background:#2a2e35}
  .chip.g{background:#1b2540;color:#9db8f5}
  .chip.l{background:#2a2140;color:#c4aef8}
  header{background:rgba(22,24,28,.94)}
  nav{background:rgba(30,33,38,.96)}
  .iconbtn,.btn,.mini,.tiny,.mini2,.tag,.star{background:var(--card);color:var(--ink)}
  .iconbtn:active,.btn:active,.mini:active,.tiny:active{background:#2a2e35}
  .btn.p{background:#0d9488;border-color:#0d9488;color:#fff}
  .tag[aria-pressed="true"],.star[aria-pressed="true"]{background:#0d9488;border-color:#0d9488;color:#fff}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <h1>个人规划<span class="sub" id="dayLabel"></span></h1>
      <button class="iconbtn" id="btnSettings" title="设置" aria-label="设置">⚙️</button>
    </div>
    <div class="datebar">
      <button class="mini" id="btnPrev">‹ 前一天</button>
      <button class="mini" id="btnToday">今天</button>
      <span class="d" id="dateText"></span>
      <button class="mini" id="btnNext">后一天 ›</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div id="banners"></div>

  <!-- ============ 视图：今天 ============ -->
  <div id="view-today" class="cols">
    <div>
      <!-- 录入 -->
      <section class="card">
        <h2>✍️ 记一条</h2>
        <textarea id="quick" placeholder="随口写一句，比如：今天睡到9点，下午有点困，晚上散步，没花钱"></textarea>
        <p class="hint" id="quickHint">随手记一句，AI 会帮你分好类。不联网也能用「直接保存」。</p>
        <div class="btns">
          <button class="btn p" id="btnAI">✨ AI 帮我整理</button>
          <button class="btn" id="btnSaveRaw">直接保存</button>
          <button class="btn" id="btnClear">清空</button>
        </div>
      </section>

      <!-- 时间线 -->
      <section class="card">
        <h2>今天的时间线 <span class="cnt" id="tlCount"></span></h2>
        <div class="tl" id="timeline"></div>
      </section>
    </div>

    <div>
      <!-- 汇总 -->
      <section class="card">
        <h2>今日汇总 <span class="cnt" id="sumNote"></span></h2>
        <div class="sum" id="summary"></div>
        <div class="bar"><i id="sumBar" style="width:0%"></i></div>
        <div class="miss" id="sumMiss"></div>
        <div class="btns" style="margin-top:10px">
          <button class="btn p grow" id="btnReview">🔄 生成今日复盘</button>
        </div>
        <div id="reviewBox"></div>
      </section>

      <!-- 手填表单 -->
      <section class="card">
        <h2>手填（不用 AI 也行）</h2>
        <div id="form"></div>
        <div class="btns">
          <button class="btn p grow" id="btnAddEntry">保存这条记录</button>
          <button class="btn" id="btnResetForm">重置</button>
        </div>
      </section>
    </div>
  </div>

  <!-- ============ 视图：仪表盘（M5）============ -->
  <div id="view-dash" style="display:none">
    <section class="card">
      <h2>概览 <span class="cnt" id="dashNote"></span></h2>
      <div class="sum" id="dashStats"></div>
      <div class="dash-actions">
        <button class="mini" data-range="7">近 7 天</button>
        <button class="mini" data-range="30">近 30 天</button>
        <button class="mini" data-range="90">近 90 天</button>
      </div>
    </section>

    <section class="card">
      <h2>记录日历</h2>
      <div class="heat-wrap"><div id="heat"></div></div>
      <p class="hint" id="heatHint">颜色越深 = 那天记的维度越多；空白 = 那天没记</p>
    </section>

    <section class="card">
      <h2>趋势 <span class="cnt" id="chartNote"></span></h2>
      <div class="dash-actions" id="chartPick"></div>
      <canvas id="chart" width="600" height="220"></canvas>
      <div class="chart-stats" id="chartStats"></div>
      <p class="hint" id="chartHint"></p>
    </section>

    <section class="card">
      <h2>报告</h2>
      <div class="btns">
        <button class="btn p grow" id="btnWeekReport">📄 生成本周报告</button>
        <button class="btn" id="btnMonthReport">📆 本月报告</button>
      </div>
      <div class="btns">
        <button class="btn grow" id="btnExportWeek">⬇️ 导出本周素材</button>
      </div>
      <div id="reportBox"></div>
      <p class="hint">
        导出的文件按天分段，丢进 U 盘 <code>我的生活\素材\</code> 就能用来写日报。
        月报用**分层压缩**：只喂周摘要，不喂 30 天原文（更快、更省，也更不容易跑偏）。
      </p>
    </section>

    <section class="card">
      <h2>两个指标一起看</h2>
      <div class="dash-actions" id="pairPick"></div>
      <div id="pairOut"></div>
      <p class="hint">
        只做**描述**：告诉你两个指标有多少天是同向变化。**不下因果结论** ——
        那需要 AI 分析，而且样本太少时必须说"数据不够"。
      </p>
    </section>
  </div>
</main>

<nav>
  <div class="in">
    <button data-view="today" aria-current="true"><span class="ic">📝</span>今天</button>
    <button data-view="dash"><span class="ic">📊</span>仪表盘</button>
    <button data-view="history"><span class="ic">📅</span>历史</button>
    <button data-view="settings"><span class="ic">⚙️</span>设置</button>
  </div>
</nav>

<div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===========================================================================
   注入点：构建时把 logic.js 与 ai.js 内联到这里。
   直接打开这个文件（没构建过）时，下面两个注入点为空，脚本会提示未构建。
   =========================================================================== */
/* ===========================================================================
 * 个人规划 —— 纯逻辑层
 *
 * 运行环境：既可被内联进单文件页面，也可在 Node 里 require（UMD）。
 *
 * ⚠️ 本文件会被原样内联进 HTML 的脚本块里，所以**绝对不能出现字面的
 *    script 开标签或闭标签**（哪怕写在注释里也不行）——浏览器的 HTML 解析器
 *    只看字节，不认识 JS 注释，会提前把脚本块截断，整个页面直接白屏。
 *    build.js 里有针对这一点的强制检查。
 *
 * 这个文件只做「数据」相关的事：日期、时长、维度、聚合、统计、序列化。
 * 不碰界面、不碰网络、不碰文件。
 *

    norm.id = old.id;
    if (typeof norm.createdAt !== 'number') norm.createdAt = old.createdAt || Date.now();
    norm.updatedAt = typeof now === 'number' ? now : Date.now();
    day.entries[idx] = norm;
    day.entries.sort(entryCompare);
    return { state: s, entry: norm };
  }

  function removeEntry(state, dateKey, entryId) {
    var s = normalizeState(state);
    var day = getDay(s, dateKey);
    if (!day) return { error: '这一天还没有记录' };
    var before = day.entries.length;
    day.entries = day.entries.filter(function (e) { return e.id !== entryId; });
    if (day.entries.length === before) return { error: '找不到这条记录' };
    if (!day.entries.length) delete s.days[dateKey];          // 空的一天不留垃圾
    return { state: s };
  }

  /** 找一条记录（跨天） */
  function findEntry(state, entryId) {
    if (!isObj(state) || !isObj(state.days)) return null;
    var keys = Object.keys(state.days);
    for (var i = 0; i < keys.length; i++) {
      var es = state.days[keys[i]].entries || [];
      for (var j = 0; j < es.length; j++) if (es[j].id === entryId) return { date: keys[i], entry: es[j] };
    }
    return null;
  }

  /* ==========================================================================
   * 五、聚合（一天多条的三条规则）
   *
   * 已用原型验证 24 项。
   * ======================================================================== */

  /**
   * 把一天的多个条目聚合成一个「虚拟条目」。
   * 用于：今日汇总显示、绘图取数、AI 输入。
   */
  function aggregateDay(day) {
    var out = {};
    if (!isObj(day) || !Array.isArray(day.entries)) return out;
    var entries = day.entries;

    DIMS.forEach(function (dim) {
      var selfKind = kindOf(dim.key, null);
      var spec = FIELD_KIND[dim.key] || {};

      if (selfKind === 'list') {
        // 整个维度是清单型：把各条目的数组拼起来
        var all = [];
        entries.forEach(function (e) {
          var v = e[dim.key];
          if (Array.isArray(v)) { for (var i = 0; i < v.length; i++) all.push(v[i]); }
          else if (hasValue(v)) all.push(v);
        });
        if (all.length) out[dim.key] = all;
        return;
      }

      var acc = {};
      Object.keys(spec).forEach(function (field) {
        var kind = spec[field];
        var vals = [];
        entries.forEach(function (e) {
          var dv = e[dim.key];
          if (isObj(dv) && !Array.isArray(dv) && hasValue(dv[field])) vals.push(dv[field]);
        });
        if (!vals.length) return;

        if (kind === 'sum') {
          var sum = 0, any = false;
          vals.forEach(function (x) { if (typeof x === 'number' && isFinite(x)) { sum += x; any = true; } });
          if (any) acc[field] = sum;
        } else if (kind === 'state') {
          acc[field] = vals[vals.length - 1];         // 最后一条有值的
        } else {
          var merged = [];
          vals.forEach(function (v) {
            if (Array.isArray(v)) { for (var i = 0; i < v.length; i++) merged.push(v[i]); }
            else merged.push(v);
          });
          acc[field] = merged;
        }
      });
      if (Object.keys(acc).length) out[dim.key] = acc;
    });
    return out;
  }

  /** 当天是否记了某维度（任一条目里有值即可） */
  function dayHasDim(day, dimKey) {
    if (!isObj(day) || !Array.isArray(day.entries)) return false;
    for (var i = 0; i < day.entries.length; i++) {
      if (hasValue(day.entries[i][dimKey])) return true;
    }
    return false;
  }

  /** 一天的完成度：{ filled, total, ratio, missing[] } */
  function dayCompletion(day) {
    var missing = [], filled = 0;
    DIMS.forEach(function (d) {
      if (dayHasDim(day, d.key)) filled++;
      else missing.push(d.key);
    });
    return {
      filled: filled,
      total: DIMS.length,
      ratio: DIMS.length ? filled / DIMS.length : 0,
      missing: missing
    };
  }

  /** 当天的睡眠时长（分钟），从聚合结果算。没有记录返回 null */
  function daySleepMinutes(day) {
    var agg = aggregateDay(day);
    var b = agg.body;
    if (!b) return null;
    return sleepMinutes(b.sleepStart, b.wake);
  }

  /* ==========================================================================
   * 六、统计（趋势图 + AI 相关性分析的输入）
   * ======================================================================== */

  /**
   * 取某维度某字段的「按天序列」。
   * 返回 [{ date, v }]，按日期升序。跳过缺失的天。
   */
  function seriesOf(state, dim, field) {
    var out = [];
    if (!isObj(state) || !isObj(state.days)) return out;
    var dates = Object.keys(state.days).sort();
    dates.forEach(function (dk) {
      var day = state.days[dk];
      var agg = aggregateDay(day);
      var dv = agg[dim];
      if (!isObj(dv)) return;
      var x = dv[field];
      if (typeof x === 'number' && isFinite(x)) out.push({ date: dk, v: x });
    });
    return out;
  }

  /** 睡眠时长的按天序列（分钟） */
  function sleepSeries(state) {
    var out = [];
    if (!isObj(state) || !isObj(state.days)) return out;
    Object.keys(state.days).sort().forEach(function (dk) {
      var m = daySleepMinutes(state.days[dk]);
      if (typeof m === 'number') out.push({ date: dk, v: m });
    });
    return out;
  }

  /** 描述性统计。只做描述，**相关性交给 AI**（它更擅长，也不需要我们造轮子） */
  function describe(nums) {
    var empty = { n: 0, mean: null, min: null, max: null, median: null };
    if (!Array.isArray(nums)) return empty;
    var a = [];
    for (var i = 0; i < nums.length; i++) {
      if (typeof nums[i] === 'number' && isFinite(nums[i])) a.push(nums[i]);
    }
    if (!a.length) return empty;
    var sorted = a.slice().sort(function (x, y) { return x - y; });
    var sum = 0;
    for (var j = 0; j < a.length; j++) sum += a[j];
    var mid = Math.floor(sorted.length / 2);
    var median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    return {
      n: a.length,
      mean: Math.round((sum / a.length) * 100) / 100,
      min: sorted[0],
      max: sorted[sorted.length - 1],
      median: Math.round(median * 100) / 100
    };
  }

  /** 滚动均值（趋势图平滑用）。窗口内含 null 时只对窗口内有效值求均值 */
  function rollingMean(nums, window) {
    if (!Array.isArray(nums)) return [];
    var w = Math.max(1, typeof window === 'number' ? window : 7);
    return nums.map(function (_, i) {
      var from = Math.max(0, i - w + 1);
      var slice = nums.slice(from, i + 1);
      var acc = [], k;
      for (k = 0; k < slice.length; k++) {
        if (typeof slice[k] === 'number' && isFinite(slice[k])) acc.push(slice[k]);
      }
      if (!acc.length) return null;
      var s = 0;
      for (k = 0; k < acc.length; k++) s += acc[k];
      return Math.round((s / acc.length) * 100) / 100;
    });
  }

  /** 某天的汇总数字（给首页汇总区用） */
  function dayTotals(state, dateKey) {
    var day = getDay(state, dateKey);
    if (!day) {
      return { entries: 0, filled: 0, total: DIMS.length, sleepMinutes: null,
               expense: null, income: null, studyCount: 0, ideaCount: 0, decisionCount: 0 };
    }
    var agg = aggregateDay(day);
    var fin = isObj(agg.finance) ? agg.finance : {};
    var plan = isObj(agg.plan) ? agg.plan : {};
    var study = Array.isArray(agg.study) ? agg.study : [];
    var comp = dayCompletion(day);
    return {
      entries: day.entries.length,
      filled: comp.filled,
      total: comp.total,
      sleepMinutes: daySleepMinutes(day),
      expense: typeof fin.expense === 'number' ? fin.expense : null,
      income: typeof fin.income === 'number' ? fin.income : null,
      studyCount: study.length,
      ideaCount: Array.isArray(plan.ideas) ? plan.ideas.length : (hasValue(plan.ideas) ? 1 : 0),
      decisionCount: Array.isArray(plan.decisions) ? plan.decisions.length : 0
    };
  }

  /** 一段日期范围（含两端）的汇总。周报用 */
  function rangeSummary(state, fromKey, toKey) {
    var n = daysBetween(fromKey, toKey);
    if (n === null || n < 0) return { days: 0 };
    var dates = [], cur = fromKey;
    for (var i = 0; i <= n; i++) { dates.push(cur); cur = addDays(cur, 1); }

    var withRecords = 0, filled = 0, slots = 0;
    var missingCount = {};
    dates.forEach(function (dk) {
      var day = getDay(state, dk);
      if (day && day.entries.length) withRecords++;
      var comp = dayCompletion(day);
      filled += comp.filled;
      slots += comp.total;
      comp.missing.forEach(function (m) { missingCount[m] = (missingCount[m] || 0) + 1; });
    });

    var mostMissed = Object.keys(missingCount)
      .sort(function (a, b) { return missingCount[b] - missingCount[a]; })
      .slice(0, 3)
      .map(function (k) { return { dim: k, missed: missingCount[k] }; });

    var sleeps = [];
    var expenses = 0, hasExpense = false;
    dates.forEach(function (dk) {
      var day = getDay(state, dk);
      if (!day) return;
      var m = daySleepMinutes(day);
      if (typeof m === 'number') sleeps.push(m);
      var agg = aggregateDay(day);
      if (isObj(agg.finance) && typeof agg.finance.expense === 'number') {
        expenses += agg.finance.expense; hasExpense = true;
      }
    });

    return {
      from: fromKey, to: toKey,
      days: dates.length,
      daysWithRecords: withRecords,
      ratio: slots ? Math.round((filled / slots) * 1000) / 1000 : 0,
      mostMissed: mostMissed,
      sleep: describe(sleeps),
      expenseTotal: hasExpense ? Math.round(expenses * 100) / 100 : null
    };
  }

  /* ==========================================================================
   * 七、AI 输入组装（分层压缩 + 编号清单）
   *
   * 方案 §7 / §2.2 教训 B：
   *   · 日复盘发「当天全部条目」，但**必须带记录时刻**，否则 AI 会把
   *     晚上补记的睡眠当成「睡了两次」
   *   · 周报发「编号清单」，要求 AI 只回编号 → 省 token + 防幻觉
   * ======================================================================== */

  /** 把某维度的一条值压成一行短文本（AI 输入用） */
  function compactDim(dimKey, val) {
    if (!hasValue(val)) return '';
    var parts = [];
    if (dimKey === 'body') {
      var m = sleepMinutes(val.sleepStart, val.wake);
      if (m !== null) parts.push('睡眠' + formatMinutes(m));
      if (typeof val.energy === 'number') parts.push('精力' + val.energy);
      if (hasValue(val.symptoms)) parts.push('症状:' + [].concat(val.symptoms).join('/'));
      if (hasValue(val.note)) parts.push('备注:' + [].concat(val.note).join('；'));
    } else if (dimKey === 'mind') {
      if (typeof val.mood === 'number') parts.push('情绪' + val.mood);
      if (hasValue(val.tags)) parts.push([].concat(val.tags).join('/'));
      if (hasValue(val.trigger)) parts.push('触发:' + val.trigger);
      if (hasValue(val.note)) parts.push('备注:' + [].concat(val.note).join('；'));
    } else if (dimKey === 'sport') {
      [].concat(val).forEach(function (x) {
        if (!isObj(x)) return;
        /*
         * ⚠️ 只有在**项目**存在时才输出。
         * 踩过的坑：第一版没判 type，于是 AI 若只给了距离（用户说"今天跑了5公里"
         * 而模型没识别出"跑步"），就会输出一个光秃秃的「5公里」——
         * 不知道是什么运动，这条记录基本没用。宁可提示缺失，也不要输出半条。
         */
        if (!hasValue(x.type)) return;
        var one = [x.type];
        if (typeof x.km === 'number') one.push(x.km + '公里');
        if (typeof x.feeling === 'number') one.push('感受' + x.feeling);
        if (hasValue(x.note)) one.push(x.note);
        parts.push(one.join(' '));
      });
    } else if (dimKey === 'study') {
      [].concat(val).forEach(function (s) {
        if (!isObj(s)) return;
        var one = [];
        if (hasValue(s.subject)) one.push(s.subject);
        if (hasValue(s.what)) one.push(s.what);
        if (typeof s.minutes === 'number') one.push(s.minutes + '分');
        if (typeof s.mastery === 'number') one.push('掌握' + s.mastery);
        if (hasValue(s.gap)) one.push('漏点:' + s.gap);
        if (one.length) parts.push(one.join(' '));
      });
    } else if (dimKey === 'work') {
      if (hasValue(val.progress)) parts.push([].concat(val.progress).join('；'));
      if (Array.isArray(val.apps)) {
        val.apps.forEach(function (a) {
          if (!isObj(a)) return;
          parts.push([a.company, a.role, a.status].filter(hasValue).join('/'));
        });
      }
      if (hasValue(val.next)) parts.push('下一步:' + val.next);
    } else if (dimKey === 'social') {
      [].concat(val).forEach(function (s) {
        if (!isObj(s)) return;
        parts.push([s.who, s.what, typeof s.feeling === 'number' ? '感受' + s.feeling : ''].filter(hasValue).join(' '));
      });
    } else if (dimKey === 'finance') {
      if (typeof val.income === 'number') parts.push('收入' + val.income);
      if (typeof val.expense === 'number') parts.push('支出' + val.expense);
      if (typeof val.balance === 'number') parts.push('余额' + val.balance);
      if (hasValue(val.expenseTags)) parts.push([].concat(val.expenseTags).join('/'));
    } else if (dimKey === 'plan') {
      if (hasValue(val.ideas)) parts.push('想法:' + [].concat(val.ideas).join('；'));
      if (Array.isArray(val.decisions)) {
        val.decisions.forEach(function (d) {
          if (!isObj(d)) return;
          parts.push('决定:' + (d.what || '') + (d.why ? '（原因:' + d.why + '）' : ''));
        });
      }
      if (hasValue(val.note)) parts.push('备注:' + [].concat(val.note).join('；'));
    }
    return parts.filter(function (x) { return x && String(x).trim(); }).join(' ');
  }

  /**
   * 组装「当天全部条目」的 AI 输入文本。
   * ⚠️ 每条**必须带记录时刻** —— 否则 AI 会把晚上补记的睡眠当成睡了两次。
   */
  function dayDigest(state, dateKey, opts) {
    var day = getDay(state, dateKey);
    if (!day || !day.entries.length) return '';
    var withTime = !(isObj(opts) && opts.withTime === false);
    var lines = [];
    lines.push('日期：' + dateKey + '（星期' + '一二三四五六日'[isoDayOfWeek(dateKey) - 1] + '）');
    lines.push('当天共 ' + day.entries.length + ' 条记录：');
    day.entries.forEach(function (e, i) {
      var bits = [];
      DIMS.forEach(function (d) {
        var s = compactDim(d.key, e[d.key]);
        if (s) bits.push(d.name + '：' + s);
      });
      lines.push((i + 1) + '. ' + (withTime && e.at ? '[' + e.at + '] ' : '') + bits.join(' ｜ '));
    });
    // 汇总（明确标注是聚合结果，避免 AI 误当成又一条记录）
    var agg = aggregateDay(day);
    var aggBits = [];
    DIMS.forEach(function (d) {
      var s = compactDim(d.key, agg[d.key]);
      if (s) aggBits.push(d.name + '：' + s);
    });
    if (aggBits.length) {
      lines.push('');
      lines.push('（以下是按规则聚合后的当日合计，不是额外记录：');
      lines.push('  ' + aggBits.join(' ｜ '));
      lines.push('  规则：支出/收入/时长类相加；睡眠/精力/情绪/余额类取当天最后一次；清单类合并。）');
    }
    return lines.join('\n');
  }

  /**
   * 组装「编号清单」用于周报/月报。
   * 方案 §2.2 教训 B：发编号 + 要求 AI 只回编号 → 省 token + **防幻觉**
   * （AI 只能引用真实存在的编号，编不出不存在的日子）。
   */
  function rangeDigest(state, fromKey, toKey) {
    var n = daysBetween(fromKey, toKey);
    if (n === null || n < 0) return { text: '', count: 0, dates: [] };
    var lines = [], dates = [], cur = fromKey;
    for (var i = 0; i <= n; i++) {
      var summ = rangeOneDayLine(state, cur);
      if (summ) { lines.push(lines.length + 1 + '. ' + summ); dates.push(cur); }
      cur = addDays(cur, 1);
    }
    return { text: lines.join('\n'), count: dates.length, dates: dates };
  }

  function rangeOneDayLine(state, dateKey) {
    var day = getDay(state, dateKey);
    if (!day || !day.entries.length) return '';
    var agg = aggregateDay(day);
    var bits = [];
    DIMS.forEach(function (d) {
      var s = compactDim(d.key, agg[d.key]);
      if (s) bits.push(s);
    });
    return dateKey + ' ' + bits.join(' ｜ ');
  }

  /* ==========================================================================
   * 七之二、仪表盘数据（M5）
   *
   * 分工：**"算什么"在这里（纯函数、可测试）**，"怎么画"在界面层（Canvas）。
   * 这样图表数据不会算错 —— 算错和画错是两类问题，混在一起最难查。
   * ======================================================================== */

  /**
   * 连续 N 天的完整日期序列（含没有记录的天）。
   * ⚠️ 必须**补齐空天**，否则图表会把"没记的日子"压缩掉，
   *    看起来像天天都在记，趋势也被扭曲。
   */
  function lastNDays(n, endKey) {
    var end = fromDateKey(endKey) ? endKey : todayKey();
    var cnt = (typeof n === 'number' && n > 0) ? Math.floor(n) : 30;
    var out = [];
    for (var i = cnt - 1; i >= 0; i--) out.push(addDays(end, -i));
    return out.filter(function (x) { return x; });
  }

  /** 仪表盘汇总（近 N 天） */
  function dashSummary(state, days, endKey) {
    var dates = lastNDays(days || 30, endKey);
    var withRecords = 0, filled = 0, slots = 0;
    var missingCount = {};

    dates.forEach(function (dk) {
      var day = getDay(state, dk);
      if (day && day.entries && day.entries.length) withRecords++;
      var comp = dayCompletion(day);
      filled += comp.filled;
      slots += comp.total;
      comp.missing.forEach(function (m) { missingCount[m] = (missingCount[m] || 0) + 1; });
    });

    var mostMissed = Object.keys(missingCount)
      .sort(function (a, b) { return missingCount[b] - missingCount[a]; })
      .slice(0, 3)
      .map(function (k) { return { dim: k, missed: missingCount[k], name: (dimOf(k) || {}).name || k }; });

    return {
      from: dates[0], to: dates[dates.length - 1], days: dates.length,
      daysWithRecords: withRecords,
      recordRate: dates.length ? Math.round((withRecords / dates.length) * 100) / 100 : 0,
      ratio: slots ? Math.round((filled / slots) * 1000) / 1000 : 0,
      mostMissed: mostMissed
    };
  }

  /**
   * 日历热力图：按周排列的格子。
   * level: 0=没记　1~4=记了 1/2/3/4+ 个维度（用来上色）
   */
  function calendarHeat(state, days, endKey) {
    var dates = lastNDays(days || 91, endKey);
    if (!dates.length) return { weeks: [], months: [] };
    var byDate = {};
    dates.forEach(function (dk) {
      var day = getDay(state, dk);
      var comp = dayCompletion(day);
      var count = (day && day.entries) ? day.entries.length : 0;
      byDate[dk] = {
        date: dk, count: count, filled: comp.filled, inRange: true,
        level: count === 0 ? 0 : Math.min(4, Math.max(1, comp.filled))
      };
    });

    var first = dates[0];
    var wd = isoDayOfWeek(first);                       // 1=周一
    var cursor = addDays(first, -(wd - 1));              // 从该周周一开始
    var weeks = [], months = [];
    var guard = 0;
    while (guard++ < 60) {
      var week = [], started = false;
      for (var i = 0; i < 7; i++) {
        var cell = byDate[cursor];
        if (cell) { week.push(cell); started = true; }
        else week.push({ date: cursor, count: 0, filled: 0, level: 0, inRange: false });
        cursor = addDays(cursor, 1);
      }
      if (!started) break;
      weeks.push(week);
      var m = week[0].date.slice(0, 7);
      if (!months.length || months[months.length - 1].m !== m) {
        months.push({ m: m, weekIndex: weeks.length - 1 });
      }
      if (daysBetween(cursor, dates[dates.length - 1]) < 0) break;
    }
    return { weeks: weeks, months: months, from: dates[0], to: dates[dates.length - 1] };
  }

  /**
   * 图表序列：**补齐 N 天**，没记录的天是 null（画成空档，不是 0）。
   *
   * ⚠️ 绝不能把缺失当 0 —— 那会让"没记"看起来像"睡了 0 小时"。
   */
  function chartSeries(state, days, endKey) {
    var dates = lastNDays(days || 30, endKey);
    var defs = [
      { key: 'sleep', name: '睡眠', unit: '小时', scale: 1 / 60, get: function (day) {
          var m = daySleepMinutes(day); return typeof m === 'number' ? m : null;
        } },
      { key: 'energy', name: '精力', unit: '分', get: function (day) {
          var a = aggregateDay(day); return (a.body && typeof a.body.energy === 'number') ? a.body.energy : null;
        } },
      { key: 'mood', name: '情绪', unit: '分', get: function (day) {
          var a = aggregateDay(day); return (a.mind && typeof a.mind.mood === 'number') ? a.mind.mood : null;
        } },
      { key: 'expense', name: '支出', unit: '元', get: function (day) {
          var a = aggregateDay(day); return (a.finance && typeof a.finance.expense === 'number') ? a.finance.expense : null;
        } },
      { key: 'sport', name: '运动', unit: '次', get: function (day) {
          var a = aggregateDay(day); return Array.isArray(a.sport) ? a.sport.length : 0;
        } }
    ];

    return defs.map(function (def) {
      var values = dates.map(function (dk) {

        if (!day || !day.entries || !day.entries.length) return null;   // 没记录 → 空档

        if (typeof v !== 'number' || !isFinite(v)) return null;

      var valid = values.filter(function (v) { return typeof v === 'number'; });

      for (var i = values.length - 1; i >= 0; i--) if (typeof values[i] === 'number') { last = values[i]; break; }

  /** 两个序列点对点配对（只取两边都有值的那天） */
  function pairSeries(seriesA, seriesB) {

    if (!seriesA || !seriesB || !Array.isArray(seriesA.dates)) return out;
    var idx = {};
    seriesB.dates.forEach(function (d, i) { idx[d] = i; });
    seriesA.dates.forEach(function (d, i) {
      var j = idx[d];
      if (j === undefined) return;
      var a = seriesA.values[i], b = seriesB.values[j];
      if (typeof a === 'number' && typeof b === 'number') out.push({ date: d, a: a, b: b });

    return out;
  }

  /**
   * 两个序列"同向变化"的比例。
   * ⚠️ 只做描述，**不下因果结论** —— 那是 AI 的活，而且必须带样本量。
   */

    if (pairs.length < 3) return { n: pairs.length, same: 0, rate: null };

      var da = pairs[i].a - pairs[i - 1].a;

  /* ==========================================================================
   * 八、序列化与备份
   * ======================================================================== */

  function serialize(state) {

  }

  /** 反序列化：坏数据不抛异常，返回 null 让上层提示 */

    if (!isObj(parsed.days) && !isObj(parsed.settings)) return null;
    var st = normalizeState(parsed);
    if (!Object.keys(st.days).length && !st.settings.apiKey && !Object.keys(st.reports).length) {
      // 看起来是空壳：可能是别人的 JSON，也可能是真的空
      if (!isObj(parsed.days)) return null;
    }
    return st;
  }

  /**
   * 导出备份用的对象。
   * ⚠️ **必须剔除 apiKey** —— 用户会把备份发到微信/网盘，key 跟着泄露就完了。
   */

    var s = normalizeState(state);
    var out = {
      version: 1,
      exportedAt: typeof now === 'number' ? now : Date.now(),
      settings: {
        model: s.settings.model,
        remindTime: s.settings.remindTime,
        monthlyBudget: s.settings.monthlyBudget
      },
      days: s.days,
      reports: s.reports
    };
    return out;
  }

  /** 导出给 AI 网页版分析用的纯文本（零成本深度分析通道） */
  function exportPlainText(state, fromKey, toKey) {
    var d = rangeDigest(state, fromKey, toKey);
    if (!d.count) return '';
    var head = [
      '以下是我 ' + fromKey + ' 到 ' + toKey + ' 的个人记录（共 ' + d.count + ' 天有记录）。',
      '请帮我分析：哪些维度在改善、哪些在退步？有没有值得注意的规律（请注明样本量）？',
      '数据不足的地方请直接说"数据不够"，不要勉强下结论。',
      ''

    return head.join('\n') + d.text;
  }

  /**
   * 按周导出（M6）。
   *
   * 用途：**这是接桌面「我的生活」文件夹那套的格式** ——
   * 生成 `素材/2026-W42 个人规划导出.md`，写日报时读它，能标出"来源：素材/…"。
   *
   * 为什么按周一个文件：一周一个文件数量少、好找，

    var dates = [], cur = r.from;
    for (var i = 0; i < 7; i++) { dates.push(cur); cur = addDays(cur, 1); }

    var days = dates.map(function (dk) {
      var day = getDay(state, dk);
      var agg = aggregateDay(day);
      var comp = dayCompletion(day);
      var bits = [];
      DIMS.forEach(function (d) {
        var s = compactDim(d.key, agg[d.key]);
        if (s) bits.push(s);
      });
      return {
        date: dk, weekday: isoDayOfWeek(dk),
        count: (day && day.entries) ? day.entries.length : 0,
        filled: comp.filled, missing: comp.missing,
        line: bits.join(' ｜ '),
        agg: agg

    });

    var s2 = rangeSummary(state, r.from, r.to);

      week: weekKey, from: r.from, to: r.to, days: days,
      daysWithRecords: days.filter(function (d) { return d.count > 0; }).length,

  }

  /**
   * 把一周导出成 Markdown（按天分段）—— 直接丢进「素材」文件夹的东西。
   */
  function exportWeekMarkdown(state, weekKey) {
    var w = weekSummary(state, weekKey);
    if (!w) return null;
    if (!w.daysWithRecords) {
      // 没有记录也生成（留个空档，让"这周我确实没记"有痕迹）
      return '# ' + weekKey + ' 个人规划导出\n\n' +
             '期间：' + w.from + ' ~ ' + w.to + '\n\n本期没有记录。\n';
    }

    var L2 = [];
    L2.push('# ' + weekKey + ' 个人规划导出');
    L2.push('');
    L2.push('> 期间：' + w.from + ' ~ ' + w.to + '（' + w.daysWithRecords + '/7 天有记录）');
    L2.push('> 来源：个人规划 App 导出。按天分段，可直接对照写日报。');

      var wk = '一二三四五六日'[d.weekday - 1];
      if (!d.count) {
        L2.push('## ' + d.date + ' 星期' + wk);
        L2.push('');
        L2.push('（这天没有记录）');
        L2.push('');
        return;
      }
      L2.push('## ' + d.date + ' 星期' + wk + '（' + d.count + ' 条）');
      L2.push('');
      L2.push(d.line || '（有记录但没填字段）');
      L2.push('');
    });

    L2.push('---');
    L2.push('');
    L2.push('## 本周合计');
    L2.push('');

      L2.push('- 睡眠：平均 ' + formatMinutes(s.sleep.mean) + '（' + s.sleep.n + ' 天有数据，' +

      if (!Array.isArray(d.agg.sport)) return;
      d.agg.sport.forEach(function (x) {

      var p = d.agg.plan;

      if (Array.isArray(p.ideas)) p.ideas.forEach(function (x) { if (x) ideas.push(x); });

    if (ideas.length) {

      L2.push('### 本周的想法');
      L2.push('');
      ideas.forEach(function (x) { L2.push('- ' + x); });

      L2.push('');
      L2.push('### 本周的决策');
      L2.push('');
      decs.forEach(function (d2) {

      L2.push('### 最常漏记的维度');
      L2.push('');
      s.mostMissed.forEach(function (m) {

        L2.push('- ' + (dd ? dd.name : m.dim) + '：缺 ' + m.missed + ' 天');

  /**

    if (typeof s.expenseTotal === 'number') bits.push('支出 ' + s.expenseTotal);

    var sportCount = 0;
    var studyCount = 0, ideaCount = 0;
    w.days.forEach(function (d) {
      if (Array.isArray(d.agg.sport)) sportCount += d.agg.sport.length;
      if (Array.isArray(d.agg.study)) studyCount += d.agg.study.length;
      var p = d.agg.plan;
      if (p && Array.isArray(p.ideas)) ideaCount += p.ideas.length;

    bits.push('运动 ' + sportCount + ' 次');
    if (studyCount) bits.push('学习 ' + studyCount + ' 条');
    if (ideaCount) bits.push('想法 ' + ideaCount + ' 条');

  /**

   * 于是出现一种很常见又很坑的情况 ——
   *   周一到周五记了一堆，周末忘了导出；下周一打开 App，
   *   「导出本周素材」导出的是**新一周的空档**，而你的记录明明还在。

  }

  /** 导出 Markdown（人类可读，可贴进任何编辑器） */

    var lines = ['# ' + dateKey + ' 记录', ''];
    var agg = aggregateDay(day);
    DIMS.forEach(function (d) {
      var s = compactDim(d.key, agg[d.key]);
      if (s) lines.push('- **' + d.name + '**：' + s);
    });
    lines.push('');
    lines.push('## 原始条目（' + day.entries.length + ' 条）');
    day.entries.forEach(function (e) {
      var bits = [];
      DIMS.forEach(function (d) {
        var s = compactDim(d.key, e[d.key]);
        if (s) bits.push(d.name + '：' + s);
      });
      lines.push('- `' + (e.at || '') + '` ' + bits.join(' ｜ '));

   * 九、提醒 / 杂项

  /* ==========================================================================
   * 二、错误分类
   *
   * ⚠️ 关键结论（我方实测）：**错误响应也带 CORS 头**，
   *    所以前端能读到 status 和响应体 —— 可以把「key 填错」和「网络断了」区分开。
   *    如果这个前提不成立，就只能给一个含糊的"失败了"，体验会差很多。
   * ======================================================================== */
  function classifyError(status, bodyText, thrown) {
    if (thrown) {
      var msg = String(thrown && thrown.message || thrown || '');
      if (/abort/i.test(msg)) return { kind: 'timeout', icon: '⏱', text: '等太久了，可能网络慢' };
      // fetch 抛异常基本都是网络层（DNS/断网/CORS 被拦）
      return { kind: 'network', icon: '📡', text: '连不上网，AI 功能要先联网' };
    }
    var detail = extractApiMessage(bodyText);
    switch (status) {
      case 400: return { kind: 'bad_request', icon: '⚠️', text: '请求被拒绝' + (detail ? '：' + detail : ''), detail: detail };
      case 401: return { kind: 'bad_key', icon: '🔑', text: 'API key 不对，检查一下有没有复制完整', detail: detail };
      case 402: return { kind: 'no_balance', icon: '💰', text: '账户余额不足，去 DeepSeek 官网充值', detail: detail };
      case 403: return { kind: 'forbidden', icon: '🚫', text: '没有权限' + (detail ? '：' + detail : ''), detail: detail };
      case 404: return { kind: 'not_found', icon: '❓', text: '这个接口地址不对（可能是自定义地址填错了）', detail: detail };
      case 429: return { kind: 'rate_limit', icon: '🚦', text: '调用太频繁，等几秒再试', detail: detail, retryable: true };
      case 500: case 502: case 503: case 504:
        return { kind: 'server', icon: '🔧', text: 'AI 服务暂时出问题（' + status + '），稍后再试', detail: detail, retryable: true };
      default:
        return { kind: 'http_' + status, icon: '⚠️', text: '请求失败（' + status + '）' + (detail ? '：' + detail : ''), detail: detail };
    }
  }

  /** 从错误响应里抠出可读信息（绝不回显 key） */
  function extractApiMessage(bodyText) {
    if (!bodyText || typeof bodyText !== 'string') return '';
    var t = bodyText.trim();
    if (!t) return '';
    try {
      var j = JSON.parse(t);
      if (j && typeof j === 'object') {
        if (j.error) {
          if (typeof j.error === 'string') return clip(j.error);
          if (typeof j.error.message === 'string') return clip(j.error.message);
        }
        if (typeof j.message === 'string') return clip(j.message);
      }
    } catch (e) { /* 不是 JSON，按纯文本处理 */ }
    // 不是 JSON 时只取第一行、限长，避免把整页 HTML 塞进界面
    return clip(t.split('\n')[0]);
  }

  function clip(s, n) {
    var lim = n || 160;
    s = String(s).replace(/\s+/g, ' ').trim();
    return s.length > lim ? s.slice(0, lim) + '…' : s;
  }

  /* ==========================================================================
   * 三、JSON 兜底解析
   *
   * 已用原型验证 17 个用例 + 14 种异常输入。
   * ⚠️ 最后一段的「平衡括号扫描」是必需的吗？不是 ——
   *    但它是**唯一能救回被截断 JSON** 的手段，而官方承认 JSON 模式可能返回空/被截断。
   *    注意它只做"尽力而为"，失败就返回 ok:false，绝不让上层以为成功。
   * ======================================================================== */

  function isPlainObj(v) {
    // ⚠️ 必须排除数组：typeof [] === 'object' 曾让数组冒充合法结果，
    // 上层取字段全崩（原型阶段抓到的真实漏洞）
    return !!v && typeof v === 'object' && !Array.isArray(v);
  }

  /** 剥掉 markdown 代码块围栏（AI 很爱加） */
  function stripFence(s) {
    var t = String(s).trim();
    // ```json ... ``` 或 ``` ... ```
    var m = /^```[ \t]*[A-Za-z0-9_-]*[ \t]*\r?\n([\s\S]*?)\r?\n?```$/.exec(t);
    if (m) return m[1].trim();
    // 只有开头围栏（结尾被截断）
    var m2 = /^```[ \t]*[A-Za-z0-9_-]*[ \t]*\r?\n([\s\S]*)$/.exec(t);
    if (m2) return m2[1].trim();
    return t;
  }

  /** 取第一个 { 到最后一个 } 之间 */
  function sliceBraces(s) {
    var a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    return s.slice(a, b + 1);
  }

  /**
   * 平衡括号扫描：从第一个 { 开始，配平后就停。
   * 用途：前后都有废话，且结尾后面还跟着别的 { } 时，sliceBraces 会取多，
   *       这个能精确取到第一个完整对象。
   * 也被用于尝试修复被截断的 JSON（自动补齐未闭合的括号）。
   */
  function balancedObject(s) {
    var start = s.indexOf('{');
    if (start < 0) return null;
    var depth = 0, inStr = false, esc = false, end = -1;
    for (var i = start; i < s.length; i++) {
      var c = s[i];
      if (esc) { esc = false; continue; }
      if (c === '\\') { esc = true; continue; }
      if (c === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (c === '{') depth++;
      else if (c === '}') {
        depth--;
        if (depth === 0) { end = i; break; }
      }
    }
    if (end > start) return { text: s.slice(start, end + 1), closed: true };
    // 没配平 → 返回剩余部分 + 需要补的括号数（尽力修复被截断的情况）
    return { text: s.slice(start), closed: false, missing: depth };
  }

  /** 尽力补齐被截断的 JSON 的括号和引号 */
  function repairTruncated(frag) {
    var text = String(frag);
    // 截断在字符串中间：补一个引号
    var inStr = false, esc = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (esc) { esc = false; continue; }
      if (c === '\\') { esc = true; continue; }
      if (c === '"') inStr = !inStr;
    }
    if (inStr) text += '"';
    // 去掉尾部悬空的 , : 之类
    text = text.replace(/[,:\s]+$/, '');
    // 配平括号
    var depth = 0;
    var s2 = false, e2 = false;
    for (var j = 0; j < text.length; j++) {
      var ch = text[j];
      if (e2) { e2 = false; continue; }
      if (ch === '\\') { e2 = true; continue; }
      if (ch === '"') { s2 = !s2; continue; }
      if (s2) continue;
      if (ch === '{') depth++;
      else if (ch === '}') depth--;
    }
    // 负 depth 说明多了，先截断到配平
    while (depth < 0) { text = text.replace(/\}[^}]*$/, ''); depth++; }
    for (var k = 0; k < depth; k++) text += '}';
    return text;
  }

  /**
   * 从 AI 的文本里抠出 JSON 对象。
   * 返回 { ok, data, strategy, error, raw }
   *
   * 逐级降级：
   *   ① 直接 parse（干净）
   *   ② 剥 markdown 围栏
   *   ③ 取首尾大括号
   *   ④ 平衡括号扫描
   *   ⑤ 尝试修复被截断的
   *   ⑥ 全失败 → ok:false（**绝不假装成功**）
   */
  function parseAIJson(text) {
    var raw = text;
    var out = { ok: false, data: null, strategy: null, error: null, raw: raw };
    if (typeof text !== 'string' || !text.trim()) {
      out.error = 'AI 返回了空内容';
      return out;
    }
    var t = text.trim();

    // ① 直接 parse
    try {
      var a = JSON.parse(t);
      if (isPlainObj(a)) return { ok: true, data: a, strategy: 'direct', error: null, raw: raw };
    } catch (e) { /* 继续降级 */ }

    // ② 剥围栏
    var stripped = stripFence(t);
    if (stripped !== t) {
      try {
        var b = JSON.parse(stripped);
        if (isPlainObj(b)) return { ok: true, data: b, strategy: 'fence', error: null, raw: raw };
      } catch (e2) { /* 继续 */ }
    }

    // ③ 取首尾大括号
    var sliced = sliceBraces(stripped);
    if (sliced) {
      try {
        var c = JSON.parse(sliced);
        if (isPlainObj(c)) return { ok: true, data: c, strategy: 'braces', error: null, raw: raw };
      } catch (e3) { /* 继续 */ }
    }

    // ④ 平衡括号扫描（应对前后废话 + 后面还跟着别的 JSON）
    var bal = balancedObject(stripped);
    if (bal) {
      if (bal.closed) {
        try {
          var d = JSON.parse(bal.text);
          if (isPlainObj(d)) return { ok: true, data: d, strategy: 'balanced', error: null, raw: raw };
        } catch (e4) { /* 继续 */ }
      }
      // ⑤ 尝试修复被截断的
      var fixed = repairTruncated(bal.text);
      try {
        var f = JSON.parse(fixed);
        // ⚠️ 修复后**必须非空**才算成功。
        // 踩过的坑：输入 "{" 会被 repairTruncated 补成 "{}"，parse 通过，
        // 于是返回 ok:true + 空对象 —— 上层会以为"AI 给了内容"，
        // 然后 cleanParsed 发现里面没维度，报出莫名其妙的"没拆出任何维度"。
        // 实际原因明明是"AI 根本没返回内容"，提示语应该是另一套。
        if (isPlainObj(f) && Object.keys(f).length) {
          return { ok: true, data: f, strategy: 'repaired', error: null, raw: raw };
        }
      } catch (e5) { /* 落到失败 */ }
    }

    // ⑥ 失败：把原始文本带回去，让界面能显示给用户看
    out.error = 'AI 返回的内容不是合法 JSON';
    return out;
  }

   *      原始层（用户原话）→ 日摘要（约 40 字/天）→ 周摘要（约 60 字/周）→ 月报
   *    好处：输入 token 基本不随月份增长而膨胀，还更快。

  function buildMonthPrompt(weekDigests, monthLabel, weekCount) {
