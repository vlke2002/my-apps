    lines.push('【重要：这些是**周摘要**，不是原始记录】');
    lines.push('明细已经被压缩过了，所以：');
    lines.push('  · 不要假装知道某一天的细节，你手上只有每周的汇总');
    lines.push('  · 结论要基于「周与周之间的变化」，而不是某一天');
    lines.push('');
    lines.push('【硬要求】');
    lines.push('1. 只输出 JSON，不要解释、不要 markdown 代码块');
    lines.push('2. **引用具体周时必须用编号**（例如 weeks:[1,3]），不要自己编周次');
    lines.push('3. **必须给出样本量**：你看到了 ' + weekCount + ' 周，就写进 sampleSize');
    lines.push('4. **周数少于 3 就不要下"趋势"结论**，放进 insufficient');
    lines.push('5. 不要恭维、不要打鸡血。指出趋势和问题即可');
    lines.push('6. 每条 conclusion 40 字以内');
    lines.push('');
    lines.push('【输出格式】');
    lines.push('{"sampleSize":' + weekCount + ',');
    lines.push(' "trend":[{"dim":"body","weeks":[1,2,3],"conclusion":"睡眠在变短"}],');
    lines.push(' "good":["..."],');
    lines.push(' "bad":["..."],');
    lines.push(' "suggestion":"下个月最值得改的一件事（只给一件）",');
    lines.push(' "insufficient":["财务样本不足"]}');
    lines.push('');
    lines.push('期间：' + monthLabel + '（有摘要 ' + weekCount + ' 周）');
    lines.push('周摘要：');
    (Array.isArray(weekDigests) ? weekDigests : []).forEach(function (t, i) {
      lines.push((i + 1) + '. ' + t);
    });
    lines.push('');
    lines.push('输出：');
    return lines.join('\n');
  }

  /**
   * ④ 趋势相关性提示词。
   *
   * 设计要点：**只发数值序列，不发文字** —— 文字对找相关性没用，还费 token。
   * 并且**必须要求样本量**（方案 §8.3）。
   */
  function buildTrendPrompt(seriesList, days) {
    var lines = ['下面是用户过去若干天的每日数值序列（数字，按日期升序）：', ''];
    // ⚠️ 又是那个坑：`(seriesList || []).forEach` 挡不住"truthy 但非数组"的值。
    // 同一个错我在这个项目里已经犯了 4 次，所以一律 Array.isArray 判。
    var list = Array.isArray(seriesList) ? seriesList : [];
    list.forEach(function (s) {
      if (!s || !s.name || !Array.isArray(s.values) || !s.values.length) return;
      lines.push(s.name + '（n=' + s.values.length + '）：' + s.values.join(', '));
    });
    lines.push('');
    lines.push('【硬要求】');
    lines.push('1. 只输出 JSON，不要解释、不要 markdown 代码块');
    lines.push('2. **每个结论必须带样本量**，样本量写进 n');
    lines.push('3. **样本量少于 7 的不要下结论**，放进 insufficient');
    lines.push('4. 区分「相关」和「因果」—— 不要说「因为A所以B」，只说「两者同步变化」');
    lines.push('5. 这是个人数据，不是实验数据，结论要保守');
    lines.push('');
    lines.push('【输出格式】');
    lines.push('{"n":' + (days || 0) + ',');
    lines.push(' "correlations":[{"a":"睡眠时长","b":"精力","n":12,"direction":"正相关","strength":"中等","note":"..."}],');
    lines.push(' "insufficient":["财务数据只有3天，无法分析"]}');
    lines.push('');
    lines.push('输出：');
    return lines.join('\n');
  }

  /* ==========================================================================
   * 五、请求体构造
   *
   * ⚠️ 两个最容易错的点：
   *   ① `thinking` 必须放在**请求体顶层**。
   *      官方 Python 示例写的是 `extra_body={"thinking":...}`，
   *      但 extra_body 是 OpenAI SDK 的包装层 —— 我们是 fetch 直连，没有这一层。
   *      照抄会变成"参数被静默忽略"，模型照旧思考、照旧贵 4 倍，而且不报错。
   *   ② 思考模式下 `temperature` **被静默忽略**（官方明文：设了不报错但也不生效）。
   *      所以要拿确定性输出，必须**先关思考**再设 temperature。
   * ======================================================================== */

  /**
   * 构造请求体。
   * opts: { model, json, thinking, temperature, maxTokens, system }
   */
  function buildRequestBody(prompt, opts) {
    var o = opts || {};
    var body = {
      model: o.model || PROVIDERS[DEFAULT_PROVIDER].defaultModel,
      messages: [
        { role: 'user', content: String(prompt) }
      ]
    };
    if (o.system) body.messages.unshift({ role: 'system', content: String(o.system) });

    // JSON 模式（官方四条硬要求之一：必须设 max_tokens，否则可能被截断）
    if (o.json) {
      body.response_format = { type: 'json_object' };
      body.max_tokens = typeof o.maxTokens === 'number' ? o.maxTokens : 2000;
    } else if (typeof o.maxTokens === 'number') {
      body.max_tokens = o.maxTokens;
    }

    // 思考模式开关（顶层！）
    if (typeof o.thinking === 'boolean') {
      body.thinking = { type: o.thinking ? 'enabled' : 'disabled' };
      if (o.thinking && typeof o.reasoningEffort === 'string') {
        // 注意：medium 实际映射到 high，所以只用 low/high/max
        body.reasoning_effort = o.reasoningEffort;
      }
    }
    // temperature 只在关思考时才有意义
    if (typeof o.temperature === 'number' && o.thinking !== true) {
      body.temperature = o.temperature;
    }
    return body;
  }

  /** 拼完整 URL（处理自定义 Base URL） */
  function resolveUrl(providerKey, baseUrlOverride) {
    var p = PROVIDERS[providerKey] || PROVIDERS[DEFAULT_PROVIDER];
    var base = (baseUrlOverride && String(baseUrlOverride).trim()) || p.baseUrl;
    base = String(base).replace(/\/+$/, '');
    // 用户可能填了带 /v1 的地址
    if (/\/chat\/completions$/.test(base)) return base;
    if (/\/v\d+$/.test(base)) return base + '/chat/completions';
    return base + p.path;
  }

  /* ==========================================================================
   * 六、调用
   * ======================================================================== */

  /** 环境是否可调用（有 key 即可；不联网也能构造） */
  function isReady(settings) {
    return !!(settings && typeof settings.apiKey === 'string' && settings.apiKey.trim());
  }

  /**
   * 带超时的 fetch。
   * ⚠️ 必须能取消 —— 否则用户点了取消界面还在等，或者超时后 promise 还在挂着。
   */
  function fetchWithTimeout(fetchImpl, url, init, timeoutMs, externalSignal) {
    var ms = typeof timeoutMs === 'number' ? timeoutMs : TIMEOUT_MS;
    if (typeof AbortController === 'undefined') {
      return fetchImpl(url, init);                       // 老环境降级：不设超时
    }
    var ctl = new AbortController();
    var timer = setTimeout(function () { try { ctl.abort(); } catch (e) {} }, ms);
    var init2 = {};
    Object.keys(init || {}).forEach(function (k) { init2[k] = init[k]; });
    init2.signal = ctl.signal;
    if (externalSignal && typeof externalSignal.addEventListener === 'function') {
      try { externalSignal.addEventListener('abort', function () { ctl.abort(); }); } catch (e) {}
    }
    return fetchImpl(url, init2).then(function (r) {
      clearTimeout(timer);
      return r;
    }, function (e) {
      clearTimeout(timer);
      throw e;
    });
  }

  function sleep(ms) {
    return new Promise(function (res) { setTimeout(res, ms); });
  }

  /**
   * 核心调用。返回 **永不 reject** 的结果对象：
   *   { ok, data, raw, usage, strategy, error:{kind,icon,text,detail}, retried }
   *
   * 为什么永不 reject：调用方是界面事件处理器，
   * reject 没接住就是白屏。所有失败都变成 ok:false + error。
   */
  function call(prompt, opts) {
    var o = opts || {};
    var settings = o.settings || {};
    var fetchImpl = o.fetchImpl ||
      (typeof fetch !== 'undefined' ? fetch.bind(typeof globalThis !== 'undefined' ? globalThis : null) : null);

    if (!fetchImpl) {
      return Promise.resolve(fail('no_fetch', '🛠', '这个环境不支持联网（浏览器太旧？）'));
    }
    if (!isReady(settings)) {
      return Promise.resolve(fail('no_key', '🔑', '还没设置 API key，去设置里填一下'));
    }

    var model = (settings.model && String(settings.model).trim()) || PROVIDERS[DEFAULT_PROVIDER].defaultModel;
    var url = resolveUrl(DEFAULT_PROVIDER, settings.baseUrl);
    var wantJson = o.json !== false;

    // 关键：要 JSON 就关思考（才能用 temperature 拿确定性输出，且便宜 4 倍）
    //       做复盘/趋势时开思考（要它推理）
    var thinking = typeof o.thinking === 'boolean' ? o.thinking : (wantJson ? false : true);
    var body = buildRequestBody(prompt, {
      model: model,
      json: wantJson,
      thinking: thinking,
      temperature: thinking ? undefined : (typeof o.temperature === 'number' ? o.temperature : 0),
      maxTokens: o.maxTokens
    });

    function doFetch(b) {
      return fetchWithTimeout(fetchImpl, url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + settings.apiKey.trim()
        },
        body: JSON.stringify(b)
      }, o.timeoutMs, o.signal);
    }

    function readResult(res) {
      // ⚠️ 我方实测：错误响应也带 CORS 头，所以这里能读到状态和正文
      return res.text().then(function (txt) {
        return { status: res.status, text: txt };
      });
    }

    var attempts = 0;
    var lastRaw = '';

    function attempt(b) {
      attempts++;
      /*
       * ⚠️ 必须用 Promise.resolve().then(() => doFetch(b)) 包一层。
       * 踩过的坑：直接 `doFetch(b).then(...)` 时，如果 fetch 实现**同步**抛异常
       * （测试里的假 fetch、某些 polyfill、或者参数构造出错），
       * 异常会在 `.then` 链建立之前就飞出去 —— 后面的 `.catch` 根本接不到，
       * 最终 reject 到调用方，界面白屏。
       * 包一层之后，同步异常也变成"链上的拒绝"，被下面的 catch 接住。
       */
      return Promise.resolve()
        .then(function () { return doFetch(b); })
        .then(readResult)
        .catch(function (e) {
          // 网络层异常（含超时 abort、以及同步抛出）
          throw { __thrown: e };
        })
        .then(function (r) {
          if (!r) return null;
          if (r.status < 200 || r.status >= 300) {
            var err = classifyError(r.status, r.text, null);
            // 429 / 5xx 自动重试一次
            if (err.retryable && attempts < 2) {
              return sleep(1200).then(function () { return attempt(b); });
            }
            return { ok: false, error: err, raw: r.text, retried: attempts > 1 };
          }
          var parsed;
          try { parsed = JSON.parse(r.text); } catch (e) { parsed = null; }
          // 结构不对（连 choices 都没有）或者 choices 是空数组 → 这是"结构看不懂"，
          // 和"content 不合法 JSON"是两回事，提示语也不同
          if (!parsed || !Array.isArray(parsed.choices) || !parsed.choices.length) {
            return { ok: false, error: { kind: 'bad_response', icon: '⚠️', text: 'AI 返回的结构看不懂' }, raw: r.text, retried: attempts > 1 };
          }
          var msg = (parsed.choices[0] && parsed.choices[0].message) || {};
          /*
           * ⚠️ content 可能是 null（模型有时把 content 发成 null，而不是空串），
           * 也可能整个 message 缺失。必须先落到字符串再处理，否则 `.trim()` 会抛异常。
           */
          var content = (typeof msg.content === 'string') ? msg.content
                      : (msg.content === null || msg.content === undefined) ? ''
                      : (typeof msg.content === 'object' ? JSON.stringify(msg.content) : String(msg.content));
          lastRaw = content;

          var usage = null;
          if (parsed.usage && typeof parsed.usage === 'object') {
            usage = {
              in: num(parsed.usage.prompt_tokens),
              out: num(parsed.usage.completion_tokens),
              total: num(parsed.usage.total_tokens),
              cached: parsed.usage.prompt_cache_hit_tokens !== undefined ? num(parsed.usage.prompt_cache_hit_tokens) : undefined
            };
          }

          // ⚠️ 官方明确：JSON 模式「有概率返回空的 content」→ 必须重试
          if (!content.trim()) {
            if (attempts < MAX_EMPTY_RETRY) {
              /*
               * 第二次尝试**提高 max_tokens**（空 content 有时是被截断的极端情况）。
               * 踩过的坑：条件原先写成 `attempts === 2`，但此刻 attempts 才 1
               * （第二次还没发出去），所以永远不提升 = 这段逻辑形同不存在。
               * 正确条件是「当前是第 1 次，且还有重试余地」。
               */
              if (attempts === 1 && b.max_tokens) {
                var b2 = JSON.parse(JSON.stringify(b));
                b2.max_tokens = Math.min(8000, Math.round(b.max_tokens * 2));
                return sleep(800).then(function () { return attempt(b2); });
              }
              return sleep(800).then(function () { return attempt(b); });
            }
            return {
              ok: false,
              error: { kind: 'empty', icon: '💭', text: 'AI 这次没给出结果，请再点一次' },
              raw: '',
              usage: usage,
              retried: true,
              attempts: attempts
            };
          }

          if (!wantJson) {
            return { ok: true, data: null, text: content, raw: content, usage: usage, attempts: attempts, retried: attempts > 1 };
          }

          var pj = parseAIJson(content);
          if (!pj.ok) {
            return {
              ok: false,
              error: { kind: 'bad_json', icon: '📄', text: 'AI 返回的内容读不懂（已保留原文）', detail: pj.error },
              raw: content,
              usage: usage,
              attempts: attempts,
              retried: attempts > 1
            };
          }
          return { ok: true, data: pj.data, strategy: pj.strategy, raw: content, usage: usage, attempts: attempts, retried: attempts > 1 };
        })
        .catch(function (e) {
          if (e && e.__thrown) {
            var err = classifyError(0, '', e.__thrown);
            if (err.kind === 'network' && attempts < 2 && o.retryNetwork !== false) {
              return sleep(1200).then(function () { return attempt(b); });
            }
            return { ok: false, error: err, raw: '', retried: attempts > 1 };
          }
          // 兜底：任何未预期异常都变成 ok:false（绝不 reject）
          return { ok: false, error: { kind: 'unknown', icon: '⚠️', text: '出错了：' + clip(e && e.message || e, 100) }, raw: '' };
        });
    }

    return attempt(body);
  }

  function num(v) { return typeof v === 'number' && isFinite(v) ? v : (typeof v === 'string' && v.trim() && isFinite(+v) ? +v : 0); }

  function fail(kind, icon, text) {
    return { ok: false, error: { kind: kind, icon: icon, text: text }, raw: '' };
  }

  /* ==========================================================================
   * 七、四个业务动作（界面只调这四个）
   * ======================================================================== */

  /** ① 一句话拆字段。返回 ok:true 时 data 是归一化后的维度对象 */
  function parseNote(text, settings, opts) {
    if (typeof text !== 'string' || !text.trim()) {
      return Promise.resolve(fail('empty_input', '✍️', '还没写内容'));
    }
    var o = opts || {};
    var L = Logic();
    var nowHint = o.nowHint || '';
    var prompt = buildParsePrompt(text.trim(), nowHint);
    return call(prompt, {
      settings: settings, json: true,
      thinking: false,            // 关思考：更快更便宜，且 temperature 才生效
      temperature: 0,             // 拆字段要确定性
      maxTokens: L ? 1200 : 1200,
      fetchImpl: o.fetchImpl, timeoutMs: o.timeoutMs, signal: o.signal
    }).then(function (r) {
      if (!r.ok) return r;
      var cleaned = cleanParsed(r.data);
      if (cleaned.none) {
        return { ok: false, error: { kind: 'nothing', icon: '🤔', text: '这句话里没找出可记录的内容，可以写详细一点' }, raw: r.raw, usage: r.usage };
      }
      if (!Object.keys(cleaned.dims).length) {
        return { ok: false, error: { kind: 'nothing', icon: '🤔', text: '没拆出任何维度，可以写详细一点' }, raw: r.raw, usage: r.usage };
      }
      r.data = cleaned.dims;
      return r;
    });
  }

  /**
   * 清洗 AI 拆出来的字段。
   * ⚠️ 这一步是**必须的**：AI 有时会返回字段名写错、类型不对、多出无关键的内容。
   *    直接入库会污染数据，而且很难查。
   */
  /**
   * AI 输出的**字段类型白名单**。
   * ⚠️ 为什么必须要有：`normalizeEntry` 是通用清洗，它只做 trim / 去空，
   *    **不校验类型** —— AI 给出 `energy:"abc"`、`minutes:"一会儿"` 都会原样通过，
   *    然后一路存进 state。之后算平均、画图、喂给下一次 AI 全是脏数据，
   *    而且这种错误很晚才会被发现。
   *    所以在这里按字段逐一校验：类型不符就丢掉这个字段（宁可少记，不可记错）。
   */
  var FIELD_TYPE = {
    body: { sleepStart: 'time', wake: 'time', energy: 'num15', symptoms: 'strArray',
            note: 'str' },
    mind: { mood: 'num15', tags: 'strArray', trigger: 'str', note: 'str' },
    finance: { income: 'num', expense: 'num', balance: 'num', expenseTags: 'strArray' },
    plan: { ideas: 'strArray', decisions: 'decisionArray', note: 'str' }
  };

  function checkFieldType(kind, v) {
    if (v === undefined || v === null) return false;
    switch (kind) {
      case 'time': return typeof v === 'string' && /^\d{1,2}:\d{2}$/.test(v.trim());
      case 'num': return typeof v === 'number' && isFinite(v);
      case 'num15': return typeof v === 'number' && isFinite(v) && v >= 1 && v <= 5;
      case 'str': return typeof v === 'string' && !!v.trim();
      case 'strArray':
        if (typeof v === 'string') return !!v.trim();
        if (!Array.isArray(v)) return false;
        return v.length > 0 && v.every(function (x) { return typeof x === 'string' && !!x.trim(); });
      case 'obj': return isPlainObj(v);
      default: return true;
    }
  }

  /** 校验并清洗数组型维度的每个元素（study / social） */
  function cleanStudyItem(it) {
    if (!isPlainObj(it)) return null;
    var o = {};
    if (checkFieldType('str', it.subject)) o.subject = String(it.subject).trim();
    if (checkFieldType('str', it.what)) o.what = String(it.what).trim();
    if (checkFieldType('num', it.minutes) && it.minutes >= 0) o.minutes = it.minutes;
    if (checkFieldType('num15', it.mastery)) o.mastery = it.mastery;
    if (checkFieldType('str', it.gap)) o.gap = String(it.gap).trim();
    return Object.keys(o).length ? o : null;
  }

  function cleanSocialItem(it) {
    if (!isPlainObj(it)) return null;
    var o = {};
    if (checkFieldType('str', it.who)) o.who = String(it.who).trim();
    if (checkFieldType('str', it.what)) o.what = String(it.what).trim();
    if (checkFieldType('num15', it.feeling)) o.feeling = it.feeling;
    return Object.keys(o).length ? o : null;
  }

  /**
   * 运动一条：项目（必填）+ 距离 + 感受 + 备注。
   * **项目必填** —— 只有距离没有项目的记录没意义（不知道是什么运动）。
   */
  function cleanSportItem(it) {
    if (!isPlainObj(it)) return null;
    if (!checkFieldType('str', it.type)) return null;
    var o = { type: String(it.type).trim() };
    if (checkFieldType('num', it.km) && it.km >= 0) o.km = it.km;
    if (checkFieldType('num15', it.feeling)) o.feeling = it.feeling;
    if (checkFieldType('str', it.note)) o.note = String(it.note).trim();
    return o;
  }

  /**
   * 决策记录：**why（原因）是必填**。
   * 用户确认的字段定义里写明了这条 —— 只记结论不记原因，两周后回看毫无信息量。
   * AI 偶尔只给 what，这种半条记录直接丢掉。
   */
  function cleanDecision(d) {
    if (!isPlainObj(d)) return null;
    if (!checkFieldType('str', d.what) || !checkFieldType('str', d.why)) return null;
    var o = { what: String(d.what).trim(), why: String(d.why).trim() };
    if (checkFieldType('str', d.alt)) o.alt = String(d.alt).trim();
    if (checkFieldType('str', d.expect)) o.expect = String(d.expect).trim();
    return o;
  }

  function cleanParsed(data) {
    var L = Logic();
    var out = { dims: {}, none: false };
    if (!isPlainObj(data)) return out;
    if (data.none === true) { out.none = true; return out; }

    var known = {};
    L.DIMS.forEach(function (d) { known[d.key] = true; });

    Object.keys(data).forEach(function (k) {
      if (!known[k]) return;                       // 丢掉 AI 编出来的维度
      var v = data[k];
      if (v === null || v === undefined) return;

      // --- 清单型维度：逐元素清洗 ---
      if (k === 'study' || k === 'social' || k === 'sport') {
        var arr = Array.isArray(v) ? v : [v];
        var pick = k === 'study' ? cleanStudyItem : (k === 'social' ? cleanSocialItem : cleanSportItem);
        var items = arr.map(pick).filter(function (x) { return x !== null; });
        if (items.length) out.dims[k] = items;
        return;
      }

      if (!isPlainObj(v)) return;                  // 对象型维度：不是对象就丢

      // --- 对象型维度：逐字段校验类型 ---
      var spec = FIELD_TYPE[k] || {};
      var acc = {};
      Object.keys(v).forEach(function (f) {
        var val = v[f];
        if (f === 'decisions') {
          var ds = Array.isArray(val) ? val : [val];
          var okD = ds.map(cleanDecision).filter(function (x) { return x !== null; });
          if (okD.length) acc.decisions = okD;
          return;
        }
        if (f === 'apps') {
          var as = Array.isArray(val) ? val : [val];
          var okA = as.map(function (a) {
            if (!isPlainObj(a)) return null;
            var o = {};
            ['company', 'role', 'status', 'next'].forEach(function (f2) {
              if (checkFieldType('str', a[f2])) o[f2] = String(a[f2]).trim();
            });
            return Object.keys(o).length ? o : null;
          }).filter(function (x) { return x !== null; });
          if (okA.length) acc.apps = okA;
          return;
        }
        if (f === 'progress') {
          if (checkFieldType('strArray', val)) {
            acc.progress = Array.isArray(val) ? val.map(function (x) { return String(x).trim(); })
                                              : [String(val).trim()];
          }
          return;
        }
        var kind = spec[f];
        if (!kind) return;                         // 未知字段丢掉（AI 会编字段名）
        if (!checkFieldType(kind, val)) return;    // 类型不符丢掉（宁可少记，不可记错）
        acc[f] = (kind === 'str' || kind === 'time') ? String(val).trim() : val;
      });

      if (Object.keys(acc).length) out.dims[k] = acc;
    });

    return out;
  }

  /** ② 日复盘：汇总当天全部条目（方案 §6.1 + §2.2 教训） */
  function dailyReview(state, dateKey, settings, opts) {
    var o = opts || {};
    var L = Logic();
    var digest = L.dayDigest(state, dateKey);
    if (!digest) {
      return Promise.resolve(fail('no_data', '📭', '这一天还没有记录'));
    }
    var prompt = buildReviewPrompt(digest, dateKey);
    return call(prompt, {
      settings: settings, json: true,
      thinking: true,             // 复盘要它推理
      reasoningEffort: 'high',
      maxTokens: 2000,
      fetchImpl: o.fetchImpl, timeoutMs: o.timeoutMs, signal: o.signal
    }).then(function (r) {
      if (!r.ok) return r;
      r.data = cleanReview(r.data);
      return r;
    });
  }

  function cleanReview(data) {
    var out = { fact: '', contribution: '', next: '', insufficient: false };
    if (!data || typeof data !== 'object') return out;
    ['fact', 'contribution', 'next'].forEach(function (k) {
      if (typeof data[k] === 'string') out[k] = data[k].trim();
    });
    out.insufficient = data.insufficient === true;
    return out;
  }

  /** ③ 周报/月报（编号清单，只回编号） */
  function rangeReport(state, fromKey, toKey, settings, opts) {
    var o = opts || {};
    var L = Logic();
    var d = L.rangeDigest(state, fromKey, toKey);
    if (!d.count) {
      return Promise.resolve(fail('no_data', '📭', '这段时间还没有记录'));
    }
    var label = fromKey + ' ~ ' + toKey;
    var prompt = buildReportPrompt(d.text, label, d.count);
    return call(prompt, {
      settings: settings, json: true,
      thinking: true,
      reasoningEffort: 'high',
      maxTokens: 2500,
      fetchImpl: o.fetchImpl, timeoutMs: o.timeoutMs, signal: o.signal
    }).then(function (r) {
      if (!r.ok) return r;
      r.data = cleanReport(r.data, d);
      return r;
    });
  }

  /**
   * 校验报告里引用的编号是否真实存在 —— **这是防幻觉的关键一步**。
   * AI 可能编出 days:[99]，我们把它剔掉并标记。
   */
  function cleanReport(data, digest) {
    var dg = isPlainObj(digest) ? digest : {};
    var fallbackCount = typeof dg.count === 'number' ? dg.count : 0;
    var out = { sampleSize: fallbackCount, good: [], bad: [], findings: [], insufficient: [], invalidRefs: [] };
    // ⚠️ data 为 null 时不能直接 return out 之前就把 sampleSize 定成 0 ——
    // 那样"AI 没给 sampleSize"和"AI 给了 0"就分不清了，兜底也就失效了。
    if (!isPlainObj(data)) return out;
    out.sampleSize = typeof data.sampleSize === 'number' ? data.sampleSize : fallbackCount;
    if (Array.isArray(data.insufficient)) {
      out.insufficient = data.insufficient.filter(function (x) { return typeof x === 'string' && x.trim(); });
    }
    ['good', 'bad', 'findings'].forEach(function (k) {
      var arr = Array.isArray(data[k]) ? data[k] : [];
      arr.forEach(function (item) {
        if (!isPlainObj(item)) return;
        var days = Array.isArray(item.days) ? item.days : [];
        var valid = [], invalid = [];
        days.forEach(function (n) {
          if (typeof n === 'number' && n >= 1 && n <= fallbackCount) valid.push(n);
          else invalid.push(n);
        });
        if (invalid.length) out.invalidRefs = out.invalidRefs.concat(invalid);
        var one = { days: valid };
        if (typeof item.dim === 'string') one.dim = item.dim;
        if (typeof item.conclusion === 'string') one.conclusion = item.conclusion.trim();
        if (one.conclusion) out[k].push(one);
      });
    });
    return out;
  }

  /* ==========================================================================
   * ③b 月报（分层压缩：喂周摘要，不喂 30 天原文）
   * ======================================================================== */

  /**
   * 生成月报。
   * 输入是**周摘要**（由 logic.monthWeekDigests 生成），不是原始记录。
   */
  function monthReport(state, year, month, settings, opts) {
    var o = opts || {};
    var L = Logic();
    var digests = L.monthWeekDigests(state, year, month);
    if (!digests.length) {
      return Promise.resolve(fail('no_data', '📭', '这个月还没有记录'));
    }
    // ⚠️ 周数太少时**不发请求**：省一次调用，也避免 AI 硬凑结论
    if (digests.length < 2) {
      return Promise.resolve(fail('too_few', '📉',
        '这个月只有 ' + digests.length + ' 周有记录，太少，看不出趋势。先多记几周。'));
    }

    var label = year + ' 年 ' + month + ' 月';
    var prompt = buildMonthPrompt(digests, label, digests.length);
    return call(prompt, {
      settings: settings, json: true,
      thinking: true,                       // 看趋势要推理
      reasoningEffort: 'high',
      maxTokens: 2500,
      fetchImpl: o.fetchImpl, timeoutMs: o.timeoutMs, signal: o.signal
    }).then(function (r) {
      if (!r.ok) return r;
      r.data = cleanMonth(r.data, digests.length);
      r.weekCount = digests.length;         // 带给界面显示
      return r;
    });
  }

  /**
   * 清洗月报结果。
   * ⚠️ 校验 `weeks:[...]` 里的编号是否真实存在 —— 和日/周报的 days 校验同一个道理（防幻觉）。
   */
  function cleanMonth(data, weekCount) {
    var n = typeof weekCount === 'number' ? weekCount : 0;
    var out = {
      sampleSize: n, trend: [], good: [], bad: [],
      suggestion: '', insufficient: [], invalidRefs: []
    };
    if (!isPlainObj(data)) return out;
    out.sampleSize = typeof data.sampleSize === 'number' ? data.sampleSize : n;

    if (Array.isArray(data.insufficient)) {
      out.insufficient = data.insufficient.filter(function (x) { return typeof x === 'string' && x.trim(); });
    }
    ['good', 'bad'].forEach(function (k) {
      if (Array.isArray(data[k])) {
        out[k] = data[k].filter(function (x) { return typeof x === 'string' && x.trim(); })
                       .map(function (x) { return x.trim(); });
      }
    });
    if (typeof data.suggestion === 'string') out.suggestion = data.suggestion.trim();

    var arr = Array.isArray(data.trend) ? data.trend : [];
    arr.forEach(function (t) {
      if (!isPlainObj(t)) return;
      var weeks = Array.isArray(t.weeks) ? t.weeks : [];
      var valid = [], invalid = [];
      weeks.forEach(function (w) {
        if (typeof w === 'number' && w >= 1 && w <= n) valid.push(w);
        else invalid.push(w);
      });
      if (invalid.length) out.invalidRefs = out.invalidRefs.concat(invalid);
      var one = { weeks: valid };
      if (typeof t.dim === 'string') one.dim = t.dim;
      if (typeof t.conclusion === 'string') one.conclusion = t.conclusion.trim();
      if (one.conclusion) out.trend.push(one);
    });
    return out;
  }

  /** ④ 趋势相关性（只发数值序列） */
  function trends(state, days, settings, opts) {
    var o = opts || {};
    var L = Logic();
    var specs = [
      { name: '睡眠时长(分钟)', series: L.sleepSeries(state) },
      { name: '精力(1-5)', series: L.seriesOf(state, 'body', 'energy') },
      { name: '情绪(1-5)', series: L.seriesOf(state, 'mind', 'mood') },
      { name: '支出(元)', series: L.seriesOf(state, 'finance', 'expense') },
      { name: '是否有运动(1=有)', series: (function () {
        var out = [], ds = Object.keys(state.days || {}).sort();
        ds.forEach(function (dk) {
          var agg = L.aggregateDay(state.days[dk]);
          if (Array.isArray(agg.sport) && agg.sport.length) out.push({ date: dk, v: 1 });
        });
        return out;
      })() }
    ];
    var list = specs.map(function (s) {
      var tail = s.series.slice(-(days || 30));
      return { name: s.name, values: tail.map(function (x) { return x.v; }) };
    }).filter(function (s) { return s.values.length; });

    if (!list.length) {
      return Promise.resolve(fail('no_data', '📭', '数值数据还不够，先记几天'));
    }
    var prompt = buildTrendPrompt(list, days || 30);
    return call(prompt, {
      settings: settings, json: true,
      thinking: true,
      reasoningEffort: 'high',
      maxTokens: 2000,
      fetchImpl: o.fetchImpl, timeoutMs: o.timeoutMs, signal: o.signal
    }).then(function (r) {
      if (!r.ok) return r;
      r.data = cleanTrends(r.data);
      return r;
    });
  }

  function cleanTrends(data) {
    var out = { n: 0, correlations: [], insufficient: [] };
    if (!data || typeof data !== 'object') return out;
    if (typeof data.n === 'number') out.n = data.n;
    if (Array.isArray(data.insufficient)) {
      out.insufficient = data.insufficient.filter(function (x) { return typeof x === 'string' && x.trim(); });
    }
    var arr = Array.isArray(data.correlations) ? data.correlations : [];
    arr.forEach(function (c) {
      if (!c || typeof c !== 'object') return;
      var one = {};
      ['a', 'b', 'direction', 'strength', 'note'].forEach(function (k) {
        if (typeof c[k] === 'string') one[k] = c[k].trim();
      });
      if (typeof c.n === 'number') one.n = c.n;
      // ⚠️ 样本量太小的结论直接丢掉（方案 §8.3：3 天数据说明不了趋势）
      if (typeof one.n === 'number' && one.n < 7) return;
      if (one.a || one.b) out.correlations.push(one);
    });
    return out;
  }

  /* ==========================================================================
   * 八、成本记账
   *
   * ⚠️ 官方明确：估算只是预检，**实际以返回结果的 usage 为准**。
   *    所以每次调用都要把 usage 记下来，按真实用量算钱。
   * ======================================================================== */

  // 元 / 百万 token。peak = 周一~周五（不含节假日）09:00-12:00 与 14:00-18:00（北京时间）
  var PRICE = {
    deepseek: {
      'deepseek-flash': { inOff: 1, inPeak: 2, outOff: 4, outPeak: 8, hitOff: 0.02, hitPeak: 0.04 },
      'deepseek-v4-pro': { inOff: 4.5, inPeak: 9, outOff: 13.5, outPeak: 27, hitOff: 0.09, hitPeak: 0.18 }
    }
  };

  /** 某个时间点是否高峰时段（北京时间） */
  function isPeak(ts) {
    var d = ts instanceof Date ? ts : new Date(ts === undefined ? Date.now() : ts);
    if (isNaN(d.getTime())) return false;
    // 用北京时间判断（UTC+8），不依赖运行环境时区
    var bj = new Date(d.getTime() + 8 * 3600 * 1000);
    var wd = bj.getUTCDay();                        // 用 UTC 取值 = 北京时间的星期几
    if (wd === 0 || wd === 6) return false;         // 周末
    var mins = bj.getUTCHours() * 60 + bj.getUTCMinutes();
    var inMorning = mins >= 9 * 60 && mins < 12 * 60;
    var inAfternoon = mins >= 14 * 60 && mins < 18 * 60;
    return inMorning || inAfternoon;
    // 注：法定节假日也算非高峰，但这里不查日历（会引入依赖）。
    //     节假日少算一点钱，属于保守方向。
  }

  /** 算这次调用花了多少钱（元） */
  function usageCost(usage, model, ts) {
    if (!usage) return 0;
    var table = PRICE.deepseek[model] || PRICE.deepseek['deepseek-flash'];
    var peak = isPeak(ts);
    var inTok = (usage.in || 0) - (usage.cached || 0);
    if (inTok < 0) inTok = 0;
    var cached = usage.cached || 0;
    var rate = {
      in: peak ? table.inPeak : table.inOff,
      out: peak ? table.outPeak : table.outOff,
      hit: peak ? table.hitPeak : table.hitOff
    };
    return (inTok / 1e6) * rate.in + (cached / 1e6) * rate.hit + ((usage.out || 0) / 1e6) * rate.out;
  }

  /** 按官方换算比例估算 token（用于调用前预检，不能当账单） */
  function estimateTokens(text) {
    if (typeof text !== 'string' || !text) return 0;
    var cjk = 0, other = 0;
    for (var i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      if ((c >= 0x4e00 && c <= 0x9fff) || (c >= 0x3000 && c <= 0x303f) || (c >= 0xff00 && c <= 0xffef)) cjk++;
      else other++;
    }
    return Math.ceil(cjk * 0.6 + other * 0.3);
  }

  /* ==========================================================================
   * 九、月度用量账本
   * ======================================================================== */

  function monthKey(ts) {
    var d = ts instanceof Date ? ts : new Date(ts === undefined ? Date.now() : ts);
    if (isNaN(d.getTime())) return null;
    var bj = new Date(d.getTime() + 8 * 3600 * 1000);
    return bj.getUTCFullYear() + '-' + (bj.getUTCMonth() + 1 < 10 ? '0' : '') + (bj.getUTCMonth() + 1);
  }

  /**
   * 把一次调用的用量记进账本。
   * ledger 形如 { '2026-10': { calls: 3, in: 1234, out: 567, cost: 0.0012 } }
   */
  function recordUsage(ledger, usage, model, ts) {
    var out = {};
    if (ledger && typeof ledger === 'object') {
      Object.keys(ledger).forEach(function (k) { out[k] = ledger[k]; });
    }
    var mk = monthKey(ts);
    if (!mk) return out;
    var cur = out[mk] && typeof out[mk] === 'object'
      ? { calls: num(out[mk].calls), in: num(out[mk].in), out: num(out[mk].out), cost: num(out[mk].cost) }
      : { calls: 0, in: 0, out: 0, cost: 0 };
    cur.calls += 1;
    if (usage) {
      cur.in += num(usage.in);
      cur.out += num(usage.out);
    }
    cur.cost = Math.round((cur.cost + usageCost(usage, model, ts)) * 1e6) / 1e6;
    out[mk] = cur;
    return out;
  }

  /** 本月账单 */
  function monthUsage(ledger, ts) {
    var mk = monthKey(ts);
    var zero = { calls: 0, in: 0, out: 0, cost: 0 };
    if (!mk || !ledger || typeof ledger !== 'object' || !ledger[mk]) return zero;
    var m = ledger[mk];
    return { calls: num(m.calls), in: num(m.in), out: num(m.out), cost: num(m.cost) };
  }

  /** 是否该提醒预算（超过 80%）。目的**不是省钱，是防异常**（循环调用 / key 被他人使用） */
  function budgetWarning(ledger, budget, ts) {
    var used = monthUsage(ledger, ts).cost;
    var b = typeof budget === 'number' && budget > 0 ? budget : 5;
    return {
      used: Math.round(used * 1000) / 1000,
      budget: b,
      ratio: Math.round((used / b) * 1000) / 1000,
      warn: used >= b * 0.8,
      exceeded: used >= b
    };
  }

  return {
    // 常量
    PROVIDERS: PROVIDERS,
    DEFAULT_PROVIDER: DEFAULT_PROVIDER,
    PRICE: PRICE,
    TIMEOUT_MS: TIMEOUT_MS,
    MAX_EMPTY_RETRY: MAX_EMPTY_RETRY,

    // 提示词
    buildParsePrompt: buildParsePrompt,
    buildReviewPrompt: buildReviewPrompt,
    buildReportPrompt: buildReportPrompt,
    buildMonthPrompt: buildMonthPrompt,
    buildTrendPrompt: buildTrendPrompt,

    // 请求
    buildRequestBody: buildRequestBody,
    resolveUrl: resolveUrl,
    classifyError: classifyError,
    extractApiMessage: extractApiMessage,
    isReady: isReady,

    // JSON 兜底（单独导出便于测试）
    parseAIJson: parseAIJson,
    isPlainObj: isPlainObj,
    stripFence: stripFence,
    balancedObject: balancedObject,
    repairTruncated: repairTruncated,

    // 调用
    call: call,
    parseNote: parseNote,
    dailyReview: dailyReview,
    rangeReport: rangeReport,
    monthReport: monthReport,
    trends: trends,

    // 清洗
    cleanParsed: cleanParsed,
    cleanStudyItem: cleanStudyItem,
    cleanSocialItem: cleanSocialItem,
    cleanSportItem: cleanSportItem,
    cleanDecision: cleanDecision,
    cleanReview: cleanReview,
    cleanReport: cleanReport,
    cleanTrends: cleanTrends,

    // 成本
    isPeak: isPeak,
    usageCost: usageCost,
    estimateTokens: estimateTokens,
    monthKey: monthKey,
    recordUsage: recordUsage,
    monthUsage: monthUsage,
    budgetWarning: budgetWarning
  };
});

      box.appendChild(banner('soft', '今天的记录又变过了，要不要重新生成复盘？', '重新生成', runReview));

  /* ==========================================================================
     渲染：时间线
     ======================================================================== */
  function dimChip(key) {
    var d = L.dimOf(key);
    var c = el('span', 'chip ' + (d && d.group === 'life' ? 'l' : 'g'),
               (d ? d.icon + ' ' + d.name : key));
    return c;
  }

  /**
   * 一条记录的正文。
   * ⚠️ **不加维度名前缀** —— 上面那排 chip 已经显示了「🌙 身体」，
   * 正文再写一遍「身体：睡眠9小时20分」就重复了，又长又啰嗦（第一版就是这样，
   * 从截图里看出来的）。这里只输出值，维度靠 chip 表达。
   */
  function entryText(e) {
    var bits = [];
    L.DIMS.forEach(function (d) {
      var s = L.compactDim(d.key, e[d.key]);
      if (s) bits.push(s);
    });
    return bits.join(' ｜ ');
  }

  function renderTimeline() {
    var day = L.getDay(state, curDate);
    var box = clear($('timeline'));
    var entries = (day && day.entries) ? day.entries : [];
    $('tlCount').textContent = entries.length ? '共 ' + entries.length + ' 条' : '';

    if (!entries.length) {
      box.appendChild(el('div', 'empty', '这一天还没有记录'));
      return;
    }
    entries.forEach(function (e) {
      var row = el('div', 'entry');
      row.appendChild(el('div', 't', e.at || ''));

      var body = el('div', 'body');
      var dims = el('div', 'dims');
      var got = [];
      L.DIMS.forEach(function (d) { if (L.hasValue(e[d.key])) got.push(d.key); });
      got.forEach(function (k) { dims.appendChild(dimChip(k)); });
      body.appendChild(dims);

      var txt = entryText(e);
      body.appendChild(el('div', 'txt', txt || (e.raw || '')));

      var acts = el('div', 'acts');
      var bEdit = el('button', 'tiny', '编辑');
      bEdit.onclick = function () { openEditSheet(e); };
      var bDel = el('button', 'tiny', '删除');
      bDel.onclick = function () { doDelete(e.id); };
      acts.appendChild(bEdit);
      acts.appendChild(bDel);
      body.appendChild(acts);

      row.appendChild(body);
      box.appendChild(row);
    });
  }

  /* ==========================================================================
     渲染：今日汇总（按 §6.1 三条聚合规则算出来）
     ======================================================================== */
  function renderSummary() {
    var t = L.dayTotals(state, curDate);
    var box = clear($('summary'));
    $('sumNote').textContent = t.entries ? '（' + t.entries + ' 条聚合）' : '';

    function kv(k, v) {
      var w = el('span', 'kv');
      w.appendChild(el('span', 'k', k));
      w.appendChild(el('span', 'v', v));
      box.appendChild(w);
    }

    if (!t.entries) {
      box.appendChild(el('span', 'k', '还没有记录'));
    } else {
      if (t.sleepMinutes !== null) kv('睡眠', L.formatMinutes(t.sleepMinutes));
      if (t.expense !== null) kv('支出', '¥' + t.expense);
      if (t.income !== null && t.income > 0) kv('收入', '¥' + t.income);
      if (t.studyCount) kv('学习', t.studyCount + ' 件');
      if (t.ideaCount) kv('想法', t.ideaCount + ' 条');
      if (t.decisionCount) kv('决策', t.decisionCount + ' 条');
    }

    var pct = Math.round(t.filled / t.total * 100);
    $('sumBar').style.width = pct + '%';
    $('sumMiss').textContent = t.entries
      ? '记了 ' + t.filled + '/' + t.total + ' 个维度' +
        (t.missing && false ? '' : '') +
        (missText(t) ? ' · 还没记：' + missText(t) : '')
      : '';
  }

  function missText(t) {
    var day = L.getDay(state, curDate);
    if (!day) return '';
    var c = L.dayCompletion(day);
    return c.missing.map(function (k) { var d = L.dimOf(k); return d ? d.name : k; }).join('、');
  }

  /* ==========================================================================
     渲染：手填表单（六个维度，可折叠）
     ======================================================================== */
  var formVal = {};        // 当前表单内容

  var TAGS = {
    symptoms: ['恶心', '反酸', '干呕', '头痛', '困倦', '失眠', '咳嗽', '腹痛', '其他'],
    moodTags: ['平静', '开心', '充实', '焦虑', '烦躁', '低落', '疲惫', '兴奋'],
    expenseTags: ['餐饮', '交通', '学习', '娱乐', '购物', '医疗', '住房', '其他']
  };

  function field(label, node) {
    var r = el('div', 'row');
    r.appendChild(el('label', null, label));
    var w = el('div', 'fi');
    w.appendChild(node);
    r.appendChild(w);
    return r;
  }
  function makeInput(type, path, ph) {
    var i = document.createElement('input');
    i.type = type;
    if (ph) i.placeholder = ph;
    i.value = getPath(formVal, path) === undefined ? '' : getPath(formVal, path);
    i.oninput = function () { setPath(formVal, path, i.value); refreshFormStatus(); };
    return i;
  }
  function makeTime(path) {
    var i = document.createElement('input');
    i.type = 'time';
    var v = getPath(formVal, path);
    if (v) i.value = v;
    i.oninput = function () { setPath(formVal, path, i.value); refreshFormStatus(); };
    return i;
  }
  function makeArea(path, ph) {
    var a = document.createElement('textarea');
    if (ph) a.placeholder = ph;
    var v = getPath(formVal, path);
    a.value = v === undefined ? '' : v;
    a.oninput = function () { setPath(formVal, path, a.value); refreshFormStatus(); };
    return a;
  }
  function makeStars(path) {
    var w = el('div', 'stars');
    for (var n = 1; n <= 5; n++) {
      (function (n) {
        var b = el('button', 'star', String(n));
        b.type = 'button';
        b.setAttribute('aria-pressed', String(getPath(formVal, path) === n));
        b.onclick = function () {
          var cur = getPath(formVal, path);
          setPath(formVal, path, cur === n ? undefined : n);   // 再点一次取消
          w.querySelectorAll('.star').forEach(function (x, idx) {
            x.setAttribute('aria-pressed', String(idx + 1 === getPath(formVal, path)));
          });
          refreshFormStatus();
        };
        w.appendChild(b);
      })(n);
    }
    return w;
  }
  function makeTags(path, list) {
    var w = el('div', 'tags');
    list.forEach(function (t) {
      var b = el('button', 'tag', t);
      b.type = 'button';
      var arr = getPath(formVal, path) || [];
      b.setAttribute('aria-pressed', String(arr.indexOf(t) > -1));
      b.onclick = function () {
        var a = (getPath(formVal, path) || []).slice();
        var i = a.indexOf(t);
        if (i > -1) a.splice(i, 1); else a.push(t);
        setPath(formVal, path, a.length ? a : undefined);
        b.setAttribute('aria-pressed', String(a.indexOf(t) > -1));
        refreshFormStatus();
      };
      w.appendChild(b);
    });
    return w;
  }

  function getPath(o, p) {
    var parts = p.split('.'), cur = o;
    for (var i = 0; i < parts.length; i++) {
      if (cur === undefined || cur === null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  function setPath(o, p, v) {
    var parts = p.split('.'), cur = o;
    for (var i = 0; i < parts.length - 1; i++) {
      if (typeof cur[parts[i]] !== 'object' || cur[parts[i]] === null) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    if (v === undefined || v === '' ) delete cur[parts[parts.length - 1]];
    else cur[parts[parts.length - 1]] = v;
  }

  /** 一个可折叠维度块 */
  function dimSection(dim, bodyNodes, statusFn) {
    var det = document.createElement('details');
    det.className = 'acc';
    var sm = document.createElement('summary');
    sm.appendChild(el('span', null, dim.icon));
    sm.appendChild(el('span', 'nm', dim.name));
    var st = el('span', 'st', '');
    sm.appendChild(st);
    sm.appendChild(el('span', 'arw', '›'));
    det.appendChild(sm);
    var bd = el('div', 'bd');
    bodyNodes.forEach(function (n) { bd.appendChild(n); });
    det.appendChild(bd);
    det._status = st;
    det._statusFn = statusFn;
    return det;
  }

  /*
   * ⚠️ 约定：**所有对 formVal 的写入都必须走 setPath**，不能直接赋值。
   *
   * 踩过的坑：三个「＋」按钮里，学习和社交是直接写 `formVal.study = arr`（路径浅，侥幸能用），
   * 决策写成 `formVal.plan.decisions = arr` —— 而 `formVal.plan` 还不存在，
   * 于是抛 `Cannot set properties of undefined (setting 'decisions')`，
   * 表现就是**点了「加一条决策」完全没反应**（异常被浏览器吞掉，控制台才有）。
   * setPath 会逐级建出中间对象，用它就不会有这个问题。
   */
  function addSub(kind) {
    var path = kind === 'study' ? 'study'
             : kind === 'social' ? 'social'
             : kind === 'sport' ? 'sport'
             : 'plan.decisions';
    var arr = getPath(formVal, path);
    if (!Array.isArray(arr)) arr = [];
    arr.push({});
    setPath(formVal, path, arr);
    renderForm();
    refreshFormStatus();
    // 新加的那块滚进视野，让用户知道点到了
    var subs = $('form').querySelectorAll('.sub');
    if (subs.length) subs[subs.length - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  /** 删掉某条子记录（用下标，和 formVal 保持一致） */
  function removeSub(kind, index) {
    var path = kind === 'study' ? 'study'
             : kind === 'social' ? 'social'
             : kind === 'sport' ? 'sport'
             : 'plan.decisions';
    var arr = getPath(formVal, path);
    if (!Array.isArray(arr)) return;
    arr.splice(index, 1);
    if (!arr.length) setPath(formVal, path, undefined);
    renderForm();
    refreshFormStatus();
  }
