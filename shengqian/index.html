      count: st.transactions.length,
      monthCount: monthCount,
      avgPerMonthCents: Math.round(total / monthCount),
      firstDate: dates[0] || '',
      lastDate: dates[dates.length - 1] || ''
    };
  }

  return {
    DEFAULT_CATEGORIES: DEFAULT_CATEGORIES,
    DATA_VERSION: DATA_VERSION,
    DEFAULT_COOL_OFF_CENTS: DEFAULT_COOL_OFF_CENTS,
    LENDING_CATEGORY: LENDING_CATEGORY,
    REVIEW_DELAY_MS: REVIEW_DELAY_MS,
    // 工具
    pad2: pad2, toDateKey: toDateKey, fromDateKey: fromDateKey,
    toMonthKey: toMonthKey, isValidMonthKey: isValidMonthKey, monthKeyOf: monthKeyOf,
    daysInMonth: daysInMonth, monthLabel: monthLabel, friendlyDate: friendlyDate,
    // 金额
    parseAmountToCents: parseAmountToCents, formatCents: formatCents,
    formatCentsShort: formatCentsShort, formatMoney: formatMoney,
    formatMoneyGrouped: formatMoneyGrouped,
    // 数据
    emptyState: emptyState, normalizeState: normalizeState, uid: uid,
    // 查询
    transactionsOfMonth: transactionsOfMonth, transactionsOfDate: transactionsOfDate,
    sortByDateDesc: sortByDateDesc, sumCents: sumCents, monthSummary: monthSummary,
    spentOn: spentOn, dailySeries: dailySeries, pieData: pieData,
    donutSegments: donutSegments,
    // 生活费（收入）
    incomesOf: incomesOf, sumIncomeCents: sumIncomeCents,
    addIncome: addIncome, updateIncome: updateIncome, removeIncome: removeIncome,
    // 周期（方案 A：到账日自动定周期）
    shiftDateKey: shiftDateKey, normalizePeriodKey: normalizePeriodKey,
    daysBetweenKeys: daysBetweenKeys,
    periodsOf: periodsOf, periodOf: periodOf, currentPeriod: currentPeriod,
    resolvePeriod: resolvePeriod, periodSummary: periodSummary, periodLabel: periodLabel,
    outsideSummary: outsideSummary, periodTotals: periodTotals,
    needsIncomeReminder: needsIncomeReminder,
    // 冷静期
    needsCoolOff: needsCoolOff, reviewAtFor: reviewAtFor, pendingReviews: pendingReviews,
    clearReview: clearReview, setCoolOff: setCoolOff,
    // 人情往来
    renqingStats: renqingStats, renqingStatsInRange: renqingStatsInRange,
    // 变更
    addTransaction: addTransaction, updateTransaction: updateTransaction,
    removeTransaction: removeTransaction, setBudget: setBudget,
    setTotalBudget: setTotalBudget, copyBudgetsFrom: copyBudgetsFrom,
    // 导入导出
    serialize: serialize, deserialize: deserialize, toCSV: toCSV,
    // 统计
    monthlyTotals: monthlyTotals, allTimeStats: allTimeStats
  };
});

        （可能是无痕模式），关掉页面数据就会丢。请用普通模式打开。</span></div>`);
    }

    /* 冷静期到点：这些是已经花钱、但还没点过确认的记录 */
    const pending = L.pendingReviews(state, Date.now());
    if (pending.length) {
      alerts.push(`<div class="alert warn" style="display:block">
        <div style="display:flex;gap:9px;align-items:flex-start">
          <span class="ico">🧊</span>
          <span>下面 <b>${pending.length}</b> 笔已经过了 24 小时冷静期。<b>还想留着就点「留着」</b>，
          觉得不该花就点「划掉」——划掉就删了，钱当没花出去。</span>
        </div>
        <div style="margin-top:6px">${pending.map((t) => {
          const c = CATS.find((x) => x.key === t.category) || { emoji: '❔', name: t.category };
          const why = t.isLending ? '借出去的钱' : (t.note ? esc(t.note) : c.name);
          return `<div class="review-item">
            <span class="em">${c.emoji}</span>
            <span class="mid">
              <span class="n">${esc(why)}${t.isLending ? '<span class="badge-lend">借出</span>' : ''}</span>
              <span class="s">${esc(c.name)} · ${L.friendlyDate(t.date, tk)}</span>
            </span>
            <span class="amt">-${L.formatCents(t.cents)}</span>
          </div>
          <div class="review-actions">
            <button class="keep" data-review-keep="${t.id}">留着（确实该花）</button>
            <button class="drop" data-review-drop="${t.id}">划掉（不买了）</button>
          </div>`;
        }).join('')}</div>
      </div>`);
    }

    el('homeAlerts').innerHTML = alerts.join('');

    /* 常记的几笔：按最近 60 天出现频次取前 7 个「备注/分类」组合 */
    const freq = {};
    state.transactions.forEach((t) => {
      const key = t.category + '|' + (t.note || '');
      freq[key] = freq[key] || { n: 0, cents: t.cents, category: t.category, note: t.note || '' };
      freq[key].n++;
    });
    const quick = Object.values(freq)
      .sort((a, b) => b.n - a.n || b.cents - a.cents)
      .slice(0, 5);
    if (quick.length === 0) {
      el('homeQuickCard').style.display = 'none';
    } else {
      el('homeQuickCard').style.display = '';
      el('homeQuick').innerHTML = quick.map((q) => {
        const c = CATS.find((x) => x.key === q.category) || { emoji: '❔', name: q.category };
        const label = q.note || c.name;
        return `<button class="qchip" data-quick="${esc(q.category)}" data-cents="${q.cents}" data-note="${esc(q.note)}">
          <span class="e">${c.emoji}</span>${esc(label)}
          <span style="color:var(--ink-3);font-size:12px">¥${L.formatCentsShort(q.cents)}</span>
        </button>`;
      }).join('');
    }

    /* 明细：近 30 天，**支出和生活费混排**、按日分组
     * 生活费单独存（state.incomes），这里只是把它们并进同一条时间线，
     * 视觉上用绿色 +¥ 和支出区分；点它走 data-income-edit，不会误当成支出。 */
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 29);
    const cutoffKey = L.toDateKey(cutoff);

    const allIncomes = L.incomesOf(state);
    const recentIncomes = allIncomes.filter((x) => x.date >= cutoffKey);
    const recentTx = state.transactions.filter((t) => t.date >= cutoffKey);

    // 空状态：支出和生活费都没有，才算"还没有记账"
    if (state.transactions.length === 0 && allIncomes.length === 0) {
      el('homeList').innerHTML = `
        <div class="empty">
          <div class="big">🧾</div>
          <p>还没有记账。<br>花完一笔就点右下角 ＋，3 秒记下。</p>
          <button class="btn-primary" id="emptyAdd">记第一笔</button>
        </div>`;
      return;
    }

    // 合成一条时间线：日期倒序，同日按创建时间倒序
    const entries = [];
    recentTx.forEach((t) => {
      entries.push({ kind: 'expense', date: t.date, at: t.createdAt || 0, item: t });
    });
    recentIncomes.forEach((x) => {
      entries.push({ kind: 'income', date: x.date, at: x.createdAt || 0, item: x });
    });
    entries.sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.at - a.at;
    });

    let html = '';
    if (entries.length === 0) {
      html += `<div class="empty" style="padding:26px 20px"><div class="big">🗓️</div><p>最近 30 天没有记录。<br>更早的账在「统计」里按月份看。</p></div>`;
    } else {
      const groups = {};
      entries.forEach((e) => { (groups[e.date] = groups[e.date] || []).push(e); });
      Object.keys(groups).sort().reverse().forEach((date) => {
        const items = groups[date];
        const dayExpense = L.sumCents(items.filter((e) => e.kind === 'expense').map((e) => e.item));
        const dayIncome = L.sumIncomeCents(items.filter((e) => e.kind === 'income').map((e) => e.item));

        // 头部的「合计」始终是花费；那天有进账就额外标一个绿色 +¥
        let headRight = `合计 ¥${L.formatCents(dayExpense)}`;
        if (dayIncome > 0) {
          headRight += `<span class="day-inc">进账 +¥${L.formatCents(dayIncome)}</span>`;
        }

        html += `<div class="daygroup">
          <div class="daygroup-head">
            <span class="d"><b>${L.friendlyDate(date, todayKey())}</b><span>${date.slice(5).replace('-', '/')}</span></span>
            <span>${headRight}</span>
          </div>`;
        items.forEach((e) => {
          if (e.kind === 'income') {
            const x = e.item;
            html += `<div class="tx inc" data-income-edit="${x.id}">
              <span class="em">💰</span>
              <span class="mid">
                <span class="name">生活费</span>
                ${x.note ? `<span class="note">${esc(x.note)}</span>` : ''}
              </span>
              <span class="amt inc">+${L.formatCents(x.cents)}</span>
            </div>`;
            return;
          }
          const t = e.item;
          const c = CATS.find((x) => x.key === t.category) || { emoji: '❔', name: t.category };
          html += `<div class="tx" data-edit="${t.id}">
            <span class="em">${c.emoji}</span>
            <span class="mid">
              <span class="name">${esc(c.name)}${t.isLending ? '<span class="badge-lend">借出</span>' : ''}</span>
              ${t.note ? `<span class="note">${esc(t.note)}</span>` : ''}
            </span>
            <span class="amt">-${L.formatCents(t.cents)}</span>
          </div>`;
        });
        html += `</div>`;
      });
    }
    el('homeList').innerHTML = html;
  }

  /** 首页的生活费卡片：列最近几笔，空时给引导 */
  function renderIncomeCard() {
    const list = L.incomesOf(state);
    const box = el('homeIncomeList');
    if (!box) return;
    if (!list.length) {
      box.innerHTML = `<div style="font-size:12.5px;color:var(--ink-3);line-height:1.55">
        记一笔生活费，App 就能按 <b>发放日</b> 给你划分周期，不用再对着日历月算。</div>`;
      return;
    }
    const recent = list.slice(-3).reverse();
    let html = recent.map((x) => `<div class="inc-row" data-income-edit="${x.id}">
        <span class="d">${esc(L.friendlyDate(x.date, todayKey()))}
          <span class="d2">${x.date.slice(5).replace('-', '/')}</span></span>
        <span class="v">¥${L.formatCents(x.cents)}</span>
      </div>`).join('');
    if (list.length > 3) {
      html += `<div style="font-size:11.5px;color:var(--ink-3);margin-top:5px">更早的还有 ${list.length - 3} 笔</div>`;
    }
    box.innerHTML = html;
  }

  /* ---------------- 统计页 ---------------- */
  /*
   * 周期切换：不再用"月份 ±1"，而是**在周期列表里前后移动**。
   * 因为周期长度不等（例如 9/15~10/11 是 27 天），按月份加减会算错。
   */
  function periodList() {
    return L.periodsOf(state, todayKey());
  }

  /** 保证 statPeriod 是一个存在的周期键；没选过就用当前周期 */
  function ensureStatPeriod() {
    const list = periodList();
    if (!list.length) { statPeriod = ''; return null; }
    const found = list.some((p) => p.key === statPeriod);
    if (!found) {
      const cur = list.find((p) => p.isCurrent);
      statPeriod = cur ? cur.key : list[list.length - 1].key;
    }
    return list;
  }

  function renderStats() {
    const tk = todayKey();
    const list = ensureStatPeriod();
    if (!list || !statPeriod) {
      el('monthLabel').textContent = '—';
      el('statsBody').innerHTML = '';
      return;
    }
    const idx = list.findIndex((p) => p.key === statPeriod);
    el('monthLabel').textContent = list[idx] ? list[idx].label : '';
    el('monthPrev').disabled = idx <= 0;
    el('monthNext').disabled = idx >= list.length - 1;

    const sum = L.periodSummary(state, statPeriod, CATS, tk);
    if (!sum) {
      el('statsBody').innerHTML = '';
      return;
    }
    const pie = L.pieData(sum);
    const body = el('statsBody');

    if (sum.count === 0) {
      body.innerHTML = `<div class="card"><div class="empty" style="padding:30px 16px">
        <div class="big">📉</div><p>${esc(sum.label)}还没有记录。</p>
      </div></div>`;
      return;
    }

    /* 环形图 */
    const R = 42, C = 2 * Math.PI * R;
    const segs = L.donutSegments(pie, C);
    const donutSVG = `
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="14"></circle>
        ${segs.map((s) => `<circle cx="60" cy="60" r="${R}" fill="none"
            stroke="${s.color}" stroke-width="14"
            stroke-dasharray="${s.dash.toFixed(2)} ${s.gap.toFixed(2)}"
            stroke-dashoffset="${s.offset.toFixed(2)}"></circle>`).join('')}
      </svg>`;

    const legend = pie.map((p) => `
      <div class="legend-row">
        <span class="dot" style="background:${p.color}"></span>
        <span class="n">${p.emoji} ${esc(p.name)}</span>
        <span class="p">${p.percent.toFixed(0)}%</span>
        <span class="a">¥${L.formatCents(p.cents)}</span>
      </div>`).join('');

    /* 分类排行：统计页只关心「钱花在哪」，没花过的分类不占版面 */
    const rankRows = sum.rows.filter((r) => r.usedCents > 0);
    const rank = rankRows.map((r) => {
      const width = r.limitCents > 0
        ? Math.min(100, r.usedCents / r.limitCents * 100)
        : (sum.spentCents > 0 ? r.usedCents / sum.spentCents * 100 : 0);
      const barCls = r.over ? 'over' : (r.limitCents > 0 && r.percent >= 80 ? 'warnb' : '');
      const right = r.limitCents > 0
        ? `<b>¥${L.formatCents(r.usedCents)}</b> / ¥${L.formatCents(r.limitCents)}${r.over ? '<span class="over-tag">超支</span>' : `<span class="left-tag">剩 ¥${L.formatCents(r.remainsCents)}</span>`}`
        : `<b>¥${L.formatCents(r.usedCents)}</b><span class="left-tag">未设预算</span>`;
      return `<div class="rank-row">
        <div class="rank-top">
          <span class="l"><span class="e">${r.emoji}</span>${esc(r.name)}</span>
          <span class="r">${right}</span>
        </div>
        <div class="bar ${barCls}"><i class="${r.over ? 'over' : ''}" style="width:${width.toFixed(1)}%;background:${r.color}"></i></div>
      </div>`;
    }).join('');

    /* 近 7 天柱状图 */
    const series = L.dailySeries(state, 7, tk);
    const maxDay = Math.max.apply(null, series.map((s) => s.cents).concat([1]));
    const bars = series.map((s) => {
      const h = s.cents > 0 ? Math.max(4, s.cents / maxDay * 100) : 2;
      const cls = s.cents === maxDay && s.cents > 0 ? 'max' : (s.cents > 0 ? 'has' : '');
      const lb = s.date.slice(5).replace('-', '/');
      return `<div class="col" title="${lb} ¥${L.formatCents(s.cents)}">
        <span class="v">${s.cents > 0 ? L.formatCentsShort(s.cents) : ''}</span>
        <span class="b ${cls} ${s.isToday ? 'today' : ''}" style="height:${h}%"></span>
        <span class="lb ${s.isToday ? 'today' : ''}">${s.isToday ? '今天' : s.label}</span>
      </div>`;
    }).join('');
    const weekAvg = Math.round(series.reduce((a, s) => a + s.cents, 0) / 7);

    /* 近 6 个周期趋势 */
    const months = L.periodTotals(state, 6, tk);
    const maxM = Math.max.apply(null, months.map((m) => m.cents).concat([1]));
    const W = 300, H = 100, PAD = 10;
    const stepX = months.length > 1 ? (W - PAD * 2) / (months.length - 1) : 0;
    const pts = months.map((m, i) => {
      const x = PAD + stepX * i;
      const y = H - PAD - (m.cents / maxM) * (H - PAD * 2 - 8);
      return { x, y, ...m };
    });
    const poly = pts.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const area = `${PAD},${H - PAD} ${poly} ${(PAD + stepX * (months.length - 1)).toFixed(1)},${H - PAD}`;
    const trendSVG = `
      <svg class="trend" viewBox="0 0 ${W} ${H + 22}" preserveAspectRatio="none">
        <polygon points="${area}" fill="var(--accent-soft)"></polygon>
        <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2"
                  stroke-linejoin="round" stroke-linecap="round"></polyline>
        ${pts.map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.key === statPeriod ? 4 : 2.6}"
            fill="${p.key === statPeriod ? 'var(--accent)' : 'var(--card)'}"
            stroke="var(--accent)" stroke-width="2"></circle>`).join('')}
        ${pts.map((p, i) => `<text x="${p.x.toFixed(1)}" y="${H + 14}" text-anchor="${i === 0 ? 'start' : (i === pts.length - 1 ? 'end' : 'middle')}"
            font-size="10" fill="var(--ink-3)">${p.label}</text>`).join('')}
      </svg>`;

    /* 人情往来：单独归集，重点盯「借出去的钱」这个漏财口 */
    const rq = L.renqingStatsInRange(state, sum.start, sum.end);
    let renqingCard = '';
    if (rq.count > 0) {
      const share = sum.spentCents > 0 ? Math.round(rq.totalCents / sum.spentCents * 100) : 0;
      const items = rq.items.slice(0, 6).map((t) => {
        const c = CATS.find((x) => x.key === t.category) || { emoji: '🤝', name: t.category };
        return `<div class="review-item">
          <span class="em">${c.emoji}</span>
          <span class="mid">
            <span class="n">${esc(t.note || c.name)}${t.isLending ? '<span class="badge-lend">借出</span>' : ''}</span>
            <span class="s">${t.date.slice(5).replace('-', '/')}</span>
          </span>
          <span class="amt">¥${L.formatCents(t.cents)}</span>
        </div>`;
      }).join('');
      renqingCard = `
        <div class="card">
          <div class="card-head"><span class="card-title big">🤝 人情往来</span>
            <span style="font-size:11.5px;color:var(--ink-3)">占本周期花费 ${share}%</span></div>
          <div class="renqing-line"><span class="k">本周期人情往来合计</span><span class="v">¥${L.formatCents(rq.totalCents)}（${rq.count} 笔）</span></div>
          <div class="renqing-line lent"><span class="k">其中借出去的钱</span><span class="v">¥${L.formatCents(rq.lentCents)}（${rq.lentCount} 笔）</span></div>
          <div class="renqing-line"><span class="k">借出去累计（全部时间）</span><span class="v">¥${L.formatCents(rq.lentAllTimeCents)}（${rq.lentAllTimeCount} 笔）</span></div>
          <div style="font-size:12px;color:var(--ink-3);line-height:1.6;margin:9px 0 4px">
            「借出去的钱」是<b>风险敞口</b>，不是消费：它不在你的预算里，但会真的把钱拿走。
            这类钱要单独记、单独盯，别混在吃喝里看不见。
          </div>
          <div style="border-top:1px solid var(--line-2);margin-top:6px">${items}</div>
        </div>`;
    }

    body.innerHTML = `
      <div class="card">
        <div class="card-head">
          <span class="card-title big">${esc(sum.label)} 总览</span>
          <span style="font-size:12px;color:var(--ink-3)">${sum.count} 笔</span>
        </div>
        <div style="display:flex;gap:14px;margin-bottom:14px">
          <div style="flex:1"><div style="font-size:11.5px;color:var(--ink-3)">${sum.source === "calendar" ? "本月" : "本周期"}花费</div>
            <div style="font-size:21px;font-weight:700;letter-spacing:-.5px">¥${L.formatCents(sum.spentCents)}</div></div>
          <div style="flex:1"><div style="font-size:11.5px;color:var(--ink-3)">日均</div>
            <div style="font-size:21px;font-weight:700;letter-spacing:-.5px">¥${L.formatCents(sum.avgPerDayCents)}</div>
            <div style="font-size:10.5px;color:var(--ink-3);margin-top:1px;line-height:1.35">
              基于 ${sum.recordedDays} 天记录<br>已过 ${sum.elapsedDays} 天
            </div></div>
          <div style="flex:1"><div style="font-size:11.5px;color:var(--ink-3)">最高一天</div>
            <div style="font-size:21px;font-weight:700;letter-spacing:-.5px">¥${L.formatCents(Math.max.apply(null, series.map((s) => s.cents).concat([0])))}</div></div>
        </div>
        <div class="donut-wrap">
          <div class="donut">${donutSVG}
            <div class="center"><div class="k">合计</div><div class="v">¥${L.formatCentsShort(sum.spentCents)}</div></div>
          </div>
          <div class="legend">${legend}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title big">钱花在哪了</span>
          <span style="font-size:11.5px;color:var(--ink-3)">按金额排序</span></div>
        <div class="rank">${rank}</div>
      </div>

      ${renqingCard}

      <div class="card">
        <div class="card-head"><span class="card-title big">最近 7 天</span>
          <span style="font-size:11.5px;color:var(--ink-3)">日均 ¥${L.formatCents(weekAvg)}</span></div>
        <div class="bars7">${bars}</div>
        <div style="font-size:11.5px;color:var(--ink-3);margin-top:10px">
          橙色最高柱 = 这 7 天花得最多的一天。连续几天都高，说明该收一收了。
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title big">近 6 个周期趋势</span>
          <span style="font-size:11.5px;color:var(--ink-3)">点上方箭头换月份</span></div>
        ${trendSVG}
      </div>`;
  }

  /* ---------------- 预算页 ---------------- */
  function renderBudget() {
    const tk = todayKey();
    const periodKey = currentPeriodKey();
    const sum = L.periodSummary(state, periodKey, CATS, tk) ||
                L.periodSummary(state, thisMonthKey() + '-01', CATS, tk);
    const mk = sum ? sum.key : periodKey;
    el('budMonthLabel').textContent = sum ? sum.label : '';

    const total = (state.totalBudgets && state.totalBudgets[mk]) || 0;

    const input = el('totalBudgetInput');
    if (document.activeElement !== input) {
      input.value = total > 0 ? L.formatCentsShort(total) : '';
    }

    const hint = el('totalBudgetHint');
    if (total > 0) {
      const spentPct = Math.round(sum.spentCents / total * 100);
      if (sum.remainingCents < 0) {
        hint.innerHTML = `已花 <b style="color:var(--danger)">¥${L.formatCents(sum.spentCents)}</b>，超出预算 <b style="color:var(--danger)">¥${L.formatCents(-sum.remainingCents)}</b>`;
      } else {
        hint.innerHTML = `已花 ¥${L.formatCents(sum.spentCents)}（${spentPct}%），剩 ${sum.remainDays} 天，每天还能花 <b style="color:var(--accent)">¥${L.formatCents(sum.dailyAllowanceCents)}</b>`;
      }
    } else {
      hint.textContent = '生活费之外想再压一个上限，就填这里（不填也不影响）。';
    }

    /*
     * 分类用量直接从周期汇总里取（sum.rows），不再自己按月份扫一遍 ——
     * 周期不是日历月，按 monthKeyOf 扫会把跨月的日子算错。
     */
    const usedOf = {};
    (sum ? sum.rows : []).forEach((r) => { usedOf[r.key] = r.usedCents; });
    const bmap = (state.budgets && state.budgets[mk]) || {};
    el('budgetRows').innerHTML = CATS.map((c) => {
      const used = usedOf[c.key] || 0;
      const limit = bmap[c.key] || 0;
      const pct = limit > 0 ? Math.min(100, used / limit * 100) : 0;
      const over = limit > 0 && used > limit;
      const sub = limit > 0
        ? (over
          ? `已花 <span class="usep">¥${L.formatCents(used)}</span> · <span style="color:var(--danger);font-weight:600">超支 ¥${L.formatCents(used - limit)}</span>`
          : `已花 <span class="usep">¥${L.formatCents(used)}</span> · 剩 ¥${L.formatCents(limit - used)}`)
        : (used > 0 ? `已花 <span class="usep">¥${L.formatCents(used)}</span> · 未设预算` : '未设预算');
      return `<div class="bud-row">
        <span class="em">${c.emoji}</span>
        <span class="info">
          <span class="n">${esc(c.name)}</span>
          <span class="s">${sub}</span>
          ${limit > 0 ? `<span class="bar ${over ? '' : (pct >= 80 ? 'warnb' : '')}"><i class="${over ? 'over' : ''}" style="width:${pct.toFixed(1)}%;background:${c.color}"></i></span>` : ''}
        </span>
        <span class="input-wrap">
          <span class="sym">¥</span>
          <input type="text" inputmode="decimal" data-cat="${c.key}"
                 value="${limit > 0 ? L.formatCentsShort(limit) : ''}" placeholder="—" autocomplete="off">
        </span>
      </div>`;
    }).join('');

    const all = L.allTimeStats(state);
    el('clearHint').textContent = all.count > 0
      ? `当前共 ${all.count} 笔、合计 ¥${L.formatCents(all.totalCents)}，不可撤销`
      : '不可撤销，建议先导出备份';

    /* 冷静期设置 */
    const on = state.settings.coolOff !== false;
    el('coolOffToggle').classList.toggle('on', on);
    el('coolOffBox').textContent = on ? '✓' : '';
    el('coolOffField').style.display = on ? '' : 'none';
    const cents = state.settings.coolOffCents;
    el('coolOffThreshold').textContent = !on
      ? '已关闭：所有支出都不再等 24 小时'
      : (cents > 0
        ? `当前门槛：超过 ¥${L.formatCents(cents)} 或属于人情往来才等 24 小时`
        : '当前门槛：0 元 —— 每一笔都要等 24 小时');
    const ci = el('coolOffInput');
    if (document.activeElement !== ci) {
      ci.value = L.formatCentsShort(cents);
    }
  }

  /* ============================ 提示 ============================ */
  let toastTimer = null;
  function toast(msg, isErr) {
    const t = el('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ============================ ③b 生活费弹层 ============================ */
  /*
   * 生活费单独一个弹层，不复用「记一笔」：
   * 那个弹层里有分类格、数字键盘、借出开关、冷静期，全是支出专用的。
   * 生活费只要「金额 + 到账日期 + 备注」，塞进去反而要藏一堆东西。
   */
  let incDraft = null;

  function openIncSheet(opts) {
    opts = opts || {};
    incDraft = {
      id: opts.id || null,
      amount: opts.amount || '',
      date: opts.date || todayKey(),
      note: opts.note || ''
    };
    el('incTitle').textContent = opts.id ? '改这笔生活费' : '记生活费';
    el('incSave').textContent = opts.id ? '保存' : '记下';
    el('incDelete').style.display = opts.id ? '' : 'none';
    /*
     * ⚠️ 这里**不能**再格式化一次。
     * 调用方传进来的 amount 已经是 `L.formatCentsShort(cents)` 的**字符串**（如 "2000"）。
     * 如果对它再调一次 formatCentsShort，它会被当成"分"处理 ——
     * "2000" 分 = ¥20，金额直接少 100 倍（踩过：编辑 2000 元变成 20）。
     * 所以：字符串原样用，只有传数字时才格式化。
     */
    const amt = opts.amount;
    el('incAmount').value = (typeof amt === 'number')
      ? L.formatCentsShort(amt)
      : (amt || '');
    el('incDate').value = incDraft.date;
    el('incNote').value = incDraft.note;
    el('incMask').classList.add('show');
    el('incSheet').classList.add('show');
    el('fab').classList.add('hide');
  }

  function closeIncSheet() {
    el('incMask').classList.remove('show');
    el('incSheet').classList.remove('show');
    el('fab').classList.toggle('hide', activeTab !== 'home');
    incDraft = null;
  }

  function saveIncSheet() {
    if (!incDraft) return;
    const input = {
      amount: el('incAmount').value,
      date: el('incDate').value,
      note: el('incNote').value
    };
    let r;
    if (incDraft.id) {
      r = L.updateIncome(state, incDraft.id, input);
      if (r.error) { toast(r.error, true); return; }
      closeIncSheet();
      commit(r.state);
      toast('已保存');
    } else {
      r = L.addIncome(state, input);
      if (r.error) { toast(r.error, true); return; }
      const cents = r.income.cents;
      closeIncSheet();
      commit(r.state);
      toast('记下了 ¥' + L.formatCents(cents) + ' 生活费');
    }
  }

  function deleteIncSheet() {
    if (!incDraft || !incDraft.id) return;
    const id = incDraft.id;
    closeIncSheet();
    commit(L.removeIncome(state, id));
    toast('已删除');
  }

  /* ============================ ④ 记账弹层 ============================ */
  function openSheet(opts) {
    opts = opts || {};
    const tk = todayKey();
    draft = {
      id: opts.id || null,
      amount: opts.amount || '',
      category: opts.category || (state.transactions.length
        ? mostUsedCategory() : 'food'),
      date: opts.date || tk,
      note: opts.note || '',
      isLending: !!opts.isLending
    };
    el('sheetTitle').textContent = opts.id ? '改这一笔' : '记一笔';
    el('keyOk').textContent = opts.id ? '保存' : '记下';
    el('sheetDelete').style.display = opts.id ? '' : 'none';
    el('dateInput').value = draft.date;
    el('noteInput').value = draft.note;
    renderCats();
    renderLendToggle();
    renderAmount();
    el('mask').classList.add('show');
    el('sheet').classList.add('show');
    el('fab').classList.add('hide');
  }

  function closeSheet() {
    el('mask').classList.remove('show');
    el('sheet').classList.remove('show');
    el('fab').classList.toggle('hide', activeTab !== 'home');
    draft = null;
  }

  function mostUsedCategory() {
    const counts = {};
    state.transactions.slice(-80).forEach((t) => { counts[t.category] = (counts[t.category] || 0) + 1; });
    let best = 'food', n = -1;
    Object.keys(counts).forEach((k) => { if (counts[k] > n) { n = counts[k]; best = k; } });
    return best;
  }

  function renderCats() {
    el('catGrid').innerHTML = CATS.map((c) =>
      `<button class="cat ${draft.category === c.key ? 'on' : ''}" data-cat="${c.key}">
        <span class="e">${c.emoji}</span>${esc(c.name)}
      </button>`).join('');
  }

  /** 「借出去的钱」开关：选中人情往来时自动勾上，也可以手动取消 */
  function renderLendToggle() {
    const on = !!(draft && (draft.isLending || draft.category === L.LENDING_CATEGORY));
    const btn = el('lendToggle');
    btn.classList.toggle('on', on);
    el('lendBox').textContent = on ? '✓' : '';
    // 只改这一行提示，不要用 textContent 去改按钮本身——那会把按钮里的文案整段清空
    el('lendHint').textContent = on
      ? '会单独统计，并强制过 24 小时冷静期'
      : '点一下：记成借出去的钱（单独统计，一定要冷静）';
  }

  function renderAmount() {
    const v = el('amountVal');
    if (draft.amount === '') {
      v.textContent = '0.00';
      v.classList.add('ph');
      el('amountBox').classList.remove('err');
    } else {
      const cents = L.parseAmountToCents(draft.amount);
      v.textContent = cents === null ? draft.amount : L.formatCents(cents);
      v.classList.remove('ph');
    }
    // 光标效果（仅纯 CSS 装饰，不影响取值）
    if (document.activeElement !== el('noteInput')) {
      const caret = document.createElement('i');
      caret.className = 'caret';
      v.appendChild(caret);
    }
  }

  function keyInput(k) {
    if (!draft) return;
    if (k === 'ok') { submitDraft(); return; }
    if (k === 'del') { draft.amount = draft.amount.slice(0, -1); renderAmount(); return; }
    const cur = draft.amount;
    if (k === '.') {
      if (cur.indexOf('.') !== -1) return;
      draft.amount = (cur === '' ? '0' : cur) + '.';
      renderAmount(); return;
    }
    // 数字键
    if (/^\d$/.test(k)) {
      const dot = cur.indexOf('.');
      if (dot !== -1 && cur.length - dot > 2) return;      // 已两位小数
      if (cur === '0') { draft.amount = k; renderAmount(); return; }
      if (cur.replace('.', '').length >= 9) return;         // 位数上限
      const next = cur + k;
      if (L.parseAmountToCents(next) === null) return;
      draft.amount = next; renderAmount(); return;
    }
  }

  function submitDraft() {
    if (!draft) return;
    const cents = L.parseAmountToCents(draft.amount);
    if (cents === null || cents <= 0) {
      const box = el('amountBox');
      box.classList.remove('err');
      void box.offsetWidth;               // 重启动画
      box.classList.add('err');
      toast('先输入金额', true);
      return;
    }
    const payload = {
      amount: draft.amount,
      date: el('dateInput').value || draft.date,
      category: draft.category,
      note: el('noteInput').value,
      isLending: draft.isLending
    };
    if (draft.id) {
      const r = L.updateTransaction(state, draft.id, payload);
      if (r.error) { toast(r.error, true); return; }
      commit(r.state);
      if (r.tx.reviewAt) toast('已保存，重新计算 24 小时冷静期');
      else toast('已保存修改');
    } else {
      const r = L.addTransaction(state, payload);
      if (r.error) { toast(r.error, true); return; }
      commit(r.state);
      const c = CATS.find((x) => x.key === r.tx.category);
      if (r.tx.reviewAt) {
        toast(`已记下 ${c ? c.emoji : ''}¥${L.formatCents(r.tx.cents)}，24 小时后提醒你确认`);
      } else {
        toast(`已记下 ${c ? c.emoji : ''}¥${L.formatCents(r.tx.cents)}`);
      }
    }
    closeSheet();
  }

  /* ============================ 事件绑定 ============================ */
  function bindTabs() {
    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.view').forEach((v) =>
          v.classList.toggle('active', v.id === 'view-' + activeTab));
        el('scroll').scrollTop = 0;
        render();
      });
    });
  }

  function bindHome() {
    el('homeHero').addEventListener('click', (e) => {
      if (e.target.id === 'heroAddIncome') { openIncSheet(); return; }
      if (e.target.id === 'heroSetBudget') {
        document.querySelector('.tab[data-tab="budget"]').click();
      }
    });
    /* 冷静期处理：留着 → 打标记；划掉 → 删掉这笔 */
    el('homeAlerts').addEventListener('click', (e) => {
      // 漏记生活费提醒里的「补记一笔」
      if (e.target.id === 'alertAddIncome') { openIncSheet(); return; }
      const keep = e.target.closest('[data-review-keep]');
      const drop = e.target.closest('[data-review-drop]');
      if (keep) {
        commit(L.clearReview(state, keep.dataset.reviewKeep));
        toast('好，这笔留着');
        return;
      }
      if (drop) {
        const id = drop.dataset.reviewDrop;
        const t = state.transactions.find((x) => x.id === id);
        if (!t) return;
        if (!confirm(`把「${t.note || '这笔'}」¥${L.formatCents(t.cents)} 划掉吗？\n\n等于你没花这笔钱。`)) return;
        commit(L.removeTransaction(state, id));
        toast('已划掉，省下 ¥' + L.formatCents(t.cents));
      }
    });
    el('homeList').addEventListener('click', (e) => {
      if (e.target.id === 'emptyAdd' || e.target.closest('#emptyAdd')) { openSheet(); return; }
      // 生活费行用 data-income-edit，和支出的 data-edit 分开，避免互相误伤
      const incRow = e.target.closest('[data-income-edit]');
      if (incRow) {
        const x = L.incomesOf(state).find((y) => y.id === incRow.dataset.incomeEdit);
        if (x) {
          openIncSheet({
            id: x.id,
            amount: L.formatCentsShort(x.cents),
            date: x.date,
            note: x.note
          });
        }
        return;
      }
      const row = e.target.closest('[data-edit]');
      if (row) {
        const t = state.transactions.find((x) => x.id === row.dataset.edit);
        if (t) {
          openSheet({
            id: t.id,
            amount: L.formatCentsShort(t.cents),
            category: t.category,
            date: t.date,
            note: t.note,
            isLending: t.isLending
          });
        }
      }
    });
    /* 生活费卡片：点最近一笔也能改 */
    el('homeIncomeList').addEventListener('click', (e) => {
      const row = e.target.closest('[data-income-edit]');
      if (!row) return;
      const x = L.incomesOf(state).find((y) => y.id === row.dataset.incomeEdit);
      if (!x) return;
      openIncSheet({
        id: x.id, amount: L.formatCentsShort(x.cents), date: x.date, note: x.note
      });
    });
    el('btnAddIncome').addEventListener('click', () => openIncSheet());
    el('incCancel').addEventListener('click', closeIncSheet);
    el('incMask').addEventListener('click', closeIncSheet);
    el('incSave').addEventListener('click', saveIncSheet);
    el('incDelete').addEventListener('click', deleteIncSheet);
    // 金额框里回车 = 直接记下（手机上少见，但键盘测试/桌面预览方便）
    el('incAmount').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveIncSheet(); }
    });
    el('homeQuick').addEventListener('click', (e) => {
      const chip = e.target.closest('[data-quick]');
      if (!chip) return;
      openSheet({
        category: chip.dataset.quick,
        amount: L.formatCentsShort(Number(chip.dataset.cents)),
        note: chip.dataset.note
      });
    });
  }

  function bindSheet() {
    el('fab').addEventListener('click', () => openSheet());
    el('sheetCancel').addEventListener('click', closeSheet);
    el('mask').addEventListener('click', closeSheet);
    el('btnClearAmount').addEventListener('click', () => {
      if (!draft) return;
      draft.amount = '';
      renderAmount();
    });
    el('sheetDelete').addEventListener('click', () => {
      if (!draft || !draft.id) return;
      const t = state.transactions.find((x) => x.id === draft.id);
      if (!t) { closeSheet(); return; }
      const c = CATS.find((x) => x.key === t.category) || { name: t.category };
      if (!confirm(`删掉这笔 ${c.name} ¥${L.formatCents(t.cents)} 吗？\n\n删了就找不回来了。`)) return;
      commit(L.removeTransaction(state, draft.id));
      closeSheet();
      toast('已删除这笔');
    });
    el('catGrid').addEventListener('click', (e) => {
      const b = e.target.closest('[data-cat]');
      if (!b || !draft) return;
      draft.category = b.dataset.cat;
      // 选「人情往来」默认按借出记；换到别的分类就把借出标记撤掉，
      // 否则开关会一直亮着，出现「吃喝 + 借出」这种自相矛盾的记录。
      draft.isLending = draft.category === L.LENDING_CATEGORY;
      renderCats();
      renderLendToggle();
    });
    el('lendToggle').addEventListener('click', () => {
      if (!draft) return;
      draft.isLending = !draft.isLending;
      if (draft.isLending) draft.category = L.LENDING_CATEGORY;
      renderCats();
      renderLendToggle();
    });
    el('keypad').addEventListener('click', (e) => {
      const b = e.target.closest('[data-k]');
      if (b) keyInput(b.dataset.k);
    });
    el('dateInput').addEventListener('change', () => {
      if (draft) draft.date = el('dateInput').value;
    });
    el('noteInput').addEventListener('input', () => {
      if (draft) draft.note = el('noteInput').value;
    });
    // 物理键盘（电脑上也能用）
    document.addEventListener('keydown', (e) => {
      // 生活费弹层打开时，只处理 Escape（别让它走记账那个键盘逻辑）
      if (el('incSheet').classList.contains('show')) {
        if (e.key === 'Escape') closeIncSheet();
        return;
      }
      if (!el('sheet').classList.contains('show')) return;
      if (e.key === 'Escape') { closeSheet(); return; }
      if (e.key === 'Enter') { submitDraft(); return; }
      if (e.key === 'Backspace' && document.activeElement !== el('noteInput') && document.activeElement !== el('dateInput')) {
        e.preventDefault(); keyInput('del'); return;
      }
      if (/^[\d.]$/.test(e.key) && document.activeElement !== el('noteInput') && document.activeElement !== el('dateInput')) {
        e.preventDefault(); keyInput(e.key);
      }
    });
    // 快速金额
    const quickVals = ['10', '15', '20', '30', '50', '100'];
    el('quickAmt').innerHTML = quickVals.map((v) => `<button data-amt="${v}">¥${v}</button>`).join('');
    el('quickAmt').addEventListener('click', (e) => {
      const b = e.target.closest('[data-amt]');
      if (!b || !draft) return;
      draft.amount = b.dataset.amt;
      renderAmount();
    });
  }

  function bindStats() {
    /*
     * 周期切换：在**周期列表里前后移动**，不做"月份 ±1"的日期运算。
     * 因为周期长度不等（比如 9/15~10/11 是 27 天），按月份加减会跳到不存在的周期。
     */
    el('monthPrev').addEventListener('click', () => {
      const list = ensureStatPeriod();
      if (!list) return;
      const i = list.findIndex((p) => p.key === statPeriod);
      if (i > 0) { statPeriod = list[i - 1].key; renderStats(); }
    });
    el('monthNext').addEventListener('click', () => {
      const list = ensureStatPeriod();
      if (!list) return;
      const i = list.findIndex((p) => p.key === statPeriod);
      if (i >= 0 && i < list.length - 1) { statPeriod = list[i + 1].key; renderStats(); }
    });
  }

  /** 当前周期的键（预算都记在它名下） */
  function currentPeriodKey() {
    const cur = L.currentPeriod(state, todayKey());
    return cur ? cur.key : (thisMonthKey() + '-01');
  }

  function bindBudget() {
    const totalInput = el('totalBudgetInput');
    const commitTotal = () => {
      const raw = totalInput.value.trim();
      if (raw === '') {
        commit(L.setTotalBudget(state, currentPeriodKey(), 0));
        toast('已清除总预算');
        return;
      }
      const cents = L.parseAmountToCents(raw);
      if (cents === null || cents <= 0) { toast('预算金额不对', true); renderBudget(); return; }
      commit(L.setTotalBudget(state, currentPeriodKey(), cents));
      toast(`自控目标 ¥${L.formatCents(cents)}`);
    };
    totalInput.addEventListener('blur', commitTotal);
    totalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') totalInput.blur(); });

    const rows = el('budgetRows');
    rows.addEventListener('blur', (e) => {
      const input = e.target.closest('input[data-cat]');
      if (!input) return;
      const raw = input.value.trim();
      const key = input.dataset.cat;
      if (raw === '') {
        commit(L.setBudget(state, currentPeriodKey(), key, 0));
        return;
      }
      const cents = L.parseAmountToCents(raw);
      if (cents === null || cents < 0) { toast('预算金额不对', true); renderBudget(); return; }
      commit(L.setBudget(state, currentPeriodKey(), key, cents));
    }, true);
    rows.addEventListener('keydown', (e) => {
      const input = e.target.closest('input[data-cat]');
      if (input && e.key === 'Enter') input.blur();
    });

    el('btnCopyPrev').addEventListener('click', () => {
      /* 复制"上一个周期"的预算到当前周期（不再按日历月减一） */
      const list = periodList();
      const curKey = currentPeriodKey();
      const idx = list.findIndex((p) => p.key === curKey);
      if (idx <= 0) { toast('还没有上一个周期可复制', true); return; }
      const prev = list[idx - 1].key;
      const prevLabel = list[idx - 1].label;
      const curLabel = list[idx].label;
      const has = (state.budgets[prev] && Object.keys(state.budgets[prev]).length) || state.totalBudgets[prev];
      if (!has) { toast(`${prevLabel}没有预算可复制`, true); return; }
      if ((state.budgets[curKey] && Object.keys(state.budgets[curKey]).length)) {
        if (!confirm(`${curLabel}已经有预算了，用${prevLabel}的覆盖它？`)) return;
      }
      commit(L.copyBudgetsFrom(state, prev, curKey));
      toast(`已复制${prevLabel}的预算`);
    });

    /* 冷静期开关与门槛 */
    el('coolOffToggle').addEventListener('click', () => {
      const on = state.settings.coolOff !== false;
      commit(L.setCoolOff(state, !on, state.settings.coolOffCents));
      toast(!on ? '已打开冷静期' : '已关闭冷静期');
    });
    const coolInput = el('coolOffInput');
    const commitCool = () => {
      const raw = coolInput.value.trim();
      if (raw === '') { commit(L.setCoolOff(state, true, 0)); toast('门槛设为 0：每笔都过冷静期'); return; }
      const cents = L.parseAmountToCents(raw);
      if (cents === null) { toast('金额不对', true); renderBudget(); return; }
      commit(L.setCoolOff(state, true, cents));
      toast(cents === 0 ? '门槛设为 0：每笔都过冷静期' : `超过 ¥${L.formatCents(cents)} 就要冷静 24 小时`);
    };
    coolInput.addEventListener('blur', commitCool);
    coolInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') coolInput.blur(); });
  }

  function bindData() {
    el('btnExportJson').addEventListener('click', () => {
      if (state.transactions.length === 0) { toast('还没有数据可导出', true); return; }
      download(`省钱记账-备份-${todayKey()}.json`, L.serialize(state), 'application/json');
      toast('已导出备份文件');
    });
    el('btnExportCsv').addEventListener('click', () => {
      if (state.transactions.length === 0) { toast('还没有数据可导出', true); return; }
      download(`省钱记账-账单-${todayKey()}.csv`, L.toCSV(state, CATS).replace(/^\ufeff/, ''), 'text/csv');
      toast('已导出表格文件');
    });
    el('btnImport').addEventListener('click', () => el('fileInput').click());
    el('fileInput').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const r = L.deserialize(reader.result);
        if (r.error) { toast(r.error, true); return; }
        const n = r.state.transactions.length;
        if (!confirm(`文件里有 ${n} 笔记录。\n\n确定要用它替换当前的全部数据吗？（当前数据将被覆盖）`)) return;
        commit(r.state);
        toast(`已导入 ${n} 笔记录`);
      };
      reader.onerror = () => toast('文件读取失败', true);
      reader.readAsText(f);
      e.target.value = '';
    });
    el('btnClear').addEventListener('click', () => {
      if (state.transactions.length === 0 && !Object.keys(state.budgets).length) {
        toast('本来就是空的');
        return;
      }
      if (!confirm('确定清空全部账单和预算吗？\n\n这个操作不可撤销，建议先「导出备份」。')) return;
      if (!confirm('再确认一次：真的要删掉所有记账数据？')) return;
      commit(L.emptyState());
      toast('已清空');
    });
  }

  function download(filename, text, mime) {
    try {
      const blob = new Blob([text], { type: mime + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    } catch (err) {
      toast('导出失败：' + err.message, true);
    }
  }

  /* ============================ 启动 ============================ */
  function boot() {
    load();
    bindTabs();
    bindHome();
    bindSheet();
    bindStats();
    bindBudget();
    bindData();
    render();

    // 回到今天：若当前不在本月，把统计也拉回本月
    el('btnToday').addEventListener('click', () => {
      statPeriod = '';   // 空串 = 回到当前周期
      if (activeTab !== 'home') document.querySelector('.tab[data-tab="home"]').click();
      else render();
      el('scroll').scrollTo({ top: 0, behavior: 'smooth' });
      toast(L.friendlyDate(todayKey(), todayKey()) + ' ' + todayKey().slice(5).replace('-', '/'));
    });

    // 从后台切回来时刷新“今天”，跨零点也不会显示错误日期
    document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

    // 防止手机键盘弹出的输入框被弹层遮住
    el('noteInput').addEventListener('focus', () => {
      setTimeout(() => el('noteInput').scrollIntoView({ block: 'center', behavior: 'smooth' }), 220);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<!-- PWA 增强层：注册离线缓存、处理「安装到桌面」与系统提醒。
     它不读写 App 的业务数据；file:// 打开时整段直接跳过。 -->
<script>
/* ===========================================================================
 * 省钱记账 —— PWA 增强层（由 pwa/build-pwa.js 注入到 index.html 末尾）
 *
 * 职责只有两件：
 *   ① 注册 Service Worker → 装到桌面后离线可用
 *   ② 处理「安装到桌面」提示
 *
 * 严格隔离：不读取、不修改 App 的任何业务数据。
 * 通过 file:// 打开时下面的判断会直接返回，App 行为与从前完全一致。
 * =========================================================================== */
(function () {
  'use strict';
  try {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;

    var STYLE_BOX = [
      'margin:0 0 12px', 'padding:12px 14px', 'border-radius:14px',
      'background:var(--accent-soft)', 'border:1px solid var(--accent)',
      'color:var(--ink)', 'font-size:13.5px', 'line-height:1.5',
      'display:flex', 'gap:10px', 'align-items:flex-start'
    ].join(';');

    /* ---------- ① 离线缓存 ---------- */
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (e) {
        console.warn('离线缓存注册失败（不影响正常使用）：', e);
      });
    });

    /* ---------- ② 安装到桌面 ---------- */
    var installEvent = null;

    function showInstallBanner() {
      var host = document.querySelector('.scroll');
      if (!host || document.querySelector('#pwa-install-banner')) return;
      var box = document.createElement('div');
      box.id = 'pwa-install-banner';
      box.setAttribute('style', STYLE_BOX);
      box.innerHTML =
        '<span style="font-size:16px">📲</span>' +
        '<div style="flex:1">' +
        '<b>装到桌面，用起来更像 App</b>' +
        '<div style="font-size:12px;color:var(--ink-2);margin-top:2px">' +
        '装好后全屏打开、没有地址栏，断网也能记账。</div>' +
        '<div style="margin-top:9px;display:flex;gap:8px">' +
        '<button id="pwa-install-go" style="background:var(--accent);color:#fff;font-weight:600;font-size:13px;padding:8px 16px;border-radius:99px">立即安装</button>' +
        '<button id="pwa-install-hide" style="font-size:12.5px;color:var(--ink-3);padding:8px 10px">以后再说</button>' +
        '</div></div>';
      host.insertBefore(box, host.firstChild);

      box.querySelector('#pwa-install-go').addEventListener('click', function () {
        if (!installEvent) return;
        installEvent.prompt();
        installEvent.userChoice.then(function () {
          installEvent = null;
          var b = document.querySelector('#pwa-install-banner');
          if (b) b.remove();
        });
      });
      box.querySelector('#pwa-install-hide').addEventListener('click', function () {
        var b = document.querySelector('#pwa-install-banner');
        if (b) b.remove();
      });
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      installEvent = e;
      showInstallBanner();
    });

    window.addEventListener('appinstalled', function () {
      var b = document.querySelector('#pwa-install-banner');
      if (b) b.remove();
    });
  } catch (e) {
    /* PWA 增强失败绝不能影响 App 本身 */
    try { console.warn('PWA 增强层跳过：', e); } catch (e2) {}
  }
})();
</script>
